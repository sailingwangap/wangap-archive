<!doctype html>
<html lang="fr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1530">
<title>Wang'ap — Nuit de quart (démo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wg.css">
<style>
:root{
  --night:#0B1530;--sea:#13244A;--moon:#EEE8DA;--gold:#F2C94C;--teal:#4FC1B5;--rose:#E07A6B;
  --bg:var(--night);--bg2:var(--sea);--bg3:#1B2F5C;--ink:var(--moon);--muted:#B9BBC2;--faint:rgba(238,232,218,.14);--hair:rgba(238,232,218,.22);
  --gold-ink:var(--gold);--teal-ink:var(--teal);--rose-ink:var(--rose);--star:#F2C94C;--on-star:#0B1530;
  --card:rgba(19,36,74,.82);--field:rgba(11,21,48,.6);--shadow:0 24px 60px rgba(0,0,0,.45);--vig:rgba(5,10,26,.78);
  --star-rgb:238,232,218;--gold-rgb:242,201,76;
  --serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif;--mono:'DM Mono',ui-monospace,Menlo,monospace;
  --g:16px;--hh:64px;
  --rd-bg:var(--bg2);--rd-ink:var(--ink);--rd-muted:var(--muted);--rd-accent:var(--gold-ink);--rd-title:var(--ink);
  --rd-title-font:var(--serif);--rd-body-font:var(--sans);--rd-radius:22px;
}
:root[data-theme="day"]{
  --bg:#F7F2E7;--bg2:#EFE7D5;--bg3:#E5DAC2;--ink:#16203A;--muted:#4C5366;--faint:rgba(22,32,58,.12);--hair:rgba(22,32,58,.2);
  --gold-ink:#875D00;--teal-ink:#1A6B64;--rose-ink:#A3402D;--star:#D4A021;--on-star:#16203A;
  --card:#FFFCF5;--field:#FFFDF8;--shadow:0 16px 40px rgba(70,50,20,.12);--vig:rgba(20,16,10,.55);
  --star-rgb:22,32,58;--gold-rgb:190,140,20;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);font:400 17px/1.6 var(--sans);overflow-x:hidden;transition:background .5s,color .5s}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--star);outline-offset:3px;border-radius:6px}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--g)}
.k{font:500 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);display:flex;align-items:center;gap:10px;margin:0 0 14px}
.k::before{content:"";width:22px;height:1px;background:currentColor;opacity:.7}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.005em;margin:0;line-height:1.05}
h2{font-size:clamp(40px,7vw,60px);margin-bottom:14px}
h2 em,h1 em{color:var(--gold-ink)}
.lead{color:var(--muted);font-size:17px;margin:0 0 26px;max-width:36em}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:.02em}
.sp{display:inline-block;width:12px;height:12px;background:var(--star);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font:600 15px/1 var(--sans);text-decoration:none;border:1px solid var(--hair);background:transparent;cursor:pointer;transition:background .25s,border-color .25s,transform .25s}
.btn:hover{border-color:var(--star)}
.btn.pri{background:var(--star);border-color:var(--star);color:var(--on-star);box-shadow:0 0 30px rgba(var(--gold-rgb),.28)}
.btn.pri:hover{transform:translateY(-1px)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.txt{color:var(--gold-ink);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.txt:hover{text-decoration:underline;text-underline-offset:4px}

/* ── header ── */
.hd{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s,backdrop-filter .3s}
.hd.solid{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--faint)}
.hd-in{height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 var(--g);max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-height:44px;margin-right:auto}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(var(--gold-rgb),.35),0 0 22px rgba(var(--gold-rgb),.25)}
.brand b{font:italic 400 27px/1 var(--serif);letter-spacing:.01em}
.nav{display:none}
.icb{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:transparent;display:inline-grid;place-items:center;cursor:pointer;padding:0}
.icb svg,.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.theme span{display:none}
.lang{position:relative;width:70px;height:44px;border:none;background:none;padding:0;cursor:pointer}
.lang::before{content:"";position:absolute;left:0;right:0;top:6px;bottom:6px;border-radius:999px;border:1px solid var(--hair)}
.lang i{position:absolute;top:50%;transform:translateY(-50%);font:500 11px/1 var(--mono);font-style:normal;letter-spacing:.06em;color:var(--muted)}
.lang i:first-of-type{left:11px}.lang i:last-of-type{right:10px}
.lang .moon{position:absolute;top:10px;left:6px;width:24px;height:24px;border-radius:50%;background:var(--moon);box-shadow:inset -7px -2px 0 0 #C9C2AE,0 0 12px rgba(238,232,218,.45);transition:transform .35s cubic-bezier(.3,.7,.2,1);display:grid;place-items:center;font:600 10px/1 var(--mono);color:#0B1530}
[data-theme="day"] .lang .moon{background:#16203A;color:#F7F2E7;box-shadow:inset -7px -2px 0 0 #36405C}
.lang[aria-checked="true"] .moon{transform:translateX(34px)}
.hd .login{display:none}

/* ── pill nav (phone) ── */
.pill{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),440px);display:flex;justify-content:space-between;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--bg2) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--hair);box-shadow:var(--shadow)}
.pill a,.pill button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;border:none;background:none;border-radius:999px;font:500 11px/1 var(--sans);color:var(--muted);cursor:pointer;padding:0}
.pill a:first-child{color:var(--gold-ink)}
.pill a:active,.pill button:active{background:var(--faint)}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(5,10,26,.55);display:none}
.sheet.open{display:block}
.sheet-in{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg2);border:1px solid var(--hair);border-radius:28px;padding:18px 18px 12px;box-shadow:var(--shadow)}
.sheet-in a{display:flex;align-items:center;gap:14px;min-height:50px;text-decoration:none;font:400 26px/1 var(--serif);border-bottom:1px solid var(--faint)}
.sheet-in a span{font-size:18px;width:26px;text-align:center}
.sheet-in .btn{width:100%;margin-top:14px;font-size:16px}
.sheet-x{position:absolute;top:10px;right:10px}

/* ── hero ── */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(var(--hh) + 40px + env(safe-area-inset-top,0px)) 0 48px;overflow:hidden}
.hero .wrap{width:100%}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid rgba(var(--gold-rgb),.45);font:500 12px/1.2 var(--mono);letter-spacing:.06em;color:var(--gold-ink);background:color-mix(in srgb,var(--bg) 60%,transparent)}
.hero .chap{font:italic 400 21px/1.3 var(--serif);color:var(--muted);margin:26px 0 10px}
.hero .chap b{font-style:normal;color:var(--teal-ink);font-weight:400}
.hero h1{font-size:clamp(44px,11.5vw,96px);line-height:.98;max-width:13ch;text-wrap:balance}
.hero h1 em{font-style:italic}
.miles{font:500 14px/1.4 var(--mono);letter-spacing:.08em;margin:22px 0 0;color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.miles .sp{width:9px;height:9px}
.q{font:italic 400 22px/1.35 var(--serif);color:var(--ink);margin:30px 0 0;max-width:30ch;padding-left:18px;border-left:1px solid rgba(var(--gold-rgb),.6)}
.q small{display:block;font:400 12px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);margin-top:10px;font-style:normal}
.hero .row{margin-top:30px}
.moonart{position:absolute;right:-60px;top:calc(var(--hh) + 30px);width:220px;height:220px;pointer-events:none;opacity:.95}
.horizon{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--bg2) 70%,transparent))}
.horizon svg{position:absolute;left:0;bottom:16px;width:100%;height:40px;stroke:rgba(79,193,181,.5);fill:none;stroke-width:1}
[data-theme="day"] .horizon svg{stroke:rgba(26,107,100,.4)}
.cue{display:flex;align-items:center;gap:10px;margin-top:34px;font:400 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cue i{width:1px;height:34px;background:linear-gradient(var(--star),transparent);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{50%{transform:translateY(6px);opacity:.4}}

/* ── figures ── */
.figs{padding:22px 0 56px}
.figs ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--faint);border:1px solid var(--faint);border-radius:22px;overflow:hidden}
.figs li{background:color-mix(in srgb,var(--bg) 82%,transparent);padding:20px 16px;display:flex;flex-direction:column;gap:6px}
.figs svg{width:26px;height:26px;fill:none;stroke:var(--star);stroke-width:1.4}
.figs b{font:400 44px/1 var(--serif)}
.figs span{font-size:14px;color:var(--muted);line-height:1.35}

/* ── split ── */
.split{position:relative}
.sky{position:relative;padding:64px var(--g) 40px}
.sky-head h2{font-size:clamp(38px,9vw,54px)}
.sky-head p{color:var(--muted);margin:0;max-width:34em}
.stage{position:relative;margin:26px calc(-1 * var(--g)) 0}
.layer{transition:opacity .9s ease}
.layer.route{display:none}
.cst{position:relative;width:100%;margin:0 auto}
.cst svg{display:block;width:100%;height:100%;overflow:visible}
.trk-glow{stroke:rgba(var(--gold-rgb),.22);stroke-width:12;fill:none;stroke-linecap:round;stroke-linejoin:round}
.trk{stroke:var(--star);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.st{transition:opacity .8s,transform .5s;opacity:.16;transform-box:fill-box;transform-origin:center}
.st.on{opacity:1}
.st.dim{opacity:.08!important}
.st .halo{fill:url(#halo)}
.st .core{fill:var(--star)}
.st.act .core{fill:var(--moon)}
[data-theme="day"] .st.act .core{fill:var(--rose-ink)}
.st.act{transform:scale(1.35)}
.plc{position:absolute;transform:translate(-50%,-50%);font:500 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;pointer-events:none}
.plc.r{transform:translate(10px,-50%)}.plc.l{transform:translate(calc(-100% - 10px),-50%)}.plc.t{transform:translate(-50%,calc(-100% - 10px))}.plc.b{transform:translate(-50%,10px)}
.now{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(79,193,181,.25),0 0 20px var(--teal)}
.now::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--teal);animation:ping 2.8s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.8);opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px;font:400 13px/1.4 var(--mono);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .dotn{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal)}
.active{display:none}
.story{position:relative;background:var(--bg);transition:background .5s}
.sec{padding:72px var(--g);border-top:1px solid var(--faint)}
.sec:first-child{border-top:0}

/* ── where ── */
.map{position:relative;overflow:hidden;aspect-ratio:1/1;border-radius:22px;background:var(--bg2);margin:0 calc(-1 * var(--g) + 4px);box-shadow:var(--shadow)}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px 20px var(--bg);opacity:.75;border-radius:inherit}
.mapstar{display:block;width:12px;height:12px;background:var(--star);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px var(--star))}
.mapboat{display:block;width:16px;height:16px;border-radius:50%;background:var(--teal);border:2px solid var(--moon);box-shadow:0 0 0 6px rgba(79,193,181,.3),0 0 24px var(--teal)}
.delay{display:flex;gap:16px;margin:26px 0 0;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--faint)}
.delay p{margin:0;font:italic 400 22px/1.3 var(--serif)}
.delay .mono{display:block;color:var(--muted);margin-top:10px;font-style:normal;line-height:1.6}
.delay svg{flex:none;width:40px;height:40px;stroke:var(--star);fill:none;stroke-width:1.2}
.where .row{margin-top:18px}
.cockpit{display:flex;align-items:center;gap:14px;margin-top:18px;padding:16px 18px;border-radius:18px;border:1px dashed rgba(79,193,181,.55);text-decoration:none;min-height:64px}
.cockpit b{display:block;font-weight:600;color:var(--teal-ink)}
.cockpit small{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px}
.cockpit .ar{margin-left:auto;color:var(--teal-ink);font-size:20px}

/* ── sillage ── */
.sill{position:relative;display:block;border-radius:24px;overflow:hidden;min-height:420px;text-decoration:none;color:#F4EFE3;box-shadow:var(--shadow);isolation:isolate}
.sill img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s}
.sill:hover img{transform:scale(1.04)}
.sill::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 35%,transparent 25%,rgba(5,10,26,.55) 70%),linear-gradient(to top,rgba(5,10,26,.92) 10%,rgba(5,10,26,.1) 60%)}
.sill svg{position:absolute;left:8%;right:8%;top:8%;width:84%;opacity:.95}
.sill .trk{stroke:#F2C94C;stroke-width:4}
.sill .trk-glow{stroke:rgba(242,201,76,.35)}
.sill-b{position:absolute;left:0;right:0;bottom:0;padding:24px}
.sill-b h3{font-size:40px;margin:6px 0 8px}
.sill-b p{margin:0 0 18px;color:#E2DCCD}
.sill .k{color:#F2C94C}
.sill .btn.pri{background:#F2C94C;border-color:#F2C94C;color:#0B1530}

/* ── carnet ── */
.today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 30px}
.today div{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--faint)}
.today b{display:block;font:400 40px/1 var(--serif);color:var(--gold-ink)}
.today span{font-size:14px;color:var(--muted)}
.today h3{grid-column:1/-1;font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.filters{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 10px}
.filters label{display:flex;flex-direction:column;gap:6px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
select,input,textarea{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--hair);background:var(--field);padding:12px 14px;font-size:16px;font-family:var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--star) 50%),linear-gradient(135deg,var(--star) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
select option{background:var(--bg2);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--star);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.2)}
.count{color:var(--muted);margin:0 0 22px}
.feat{display:block;cursor:pointer;margin:0 calc(-1 * var(--g)) 34px}
.feat .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--bg2)}
.feat .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s}
.feat:hover .ph img{transform:scale(1.03)}
.ph{position:relative}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,var(--vig) 100%),linear-gradient(to top,var(--vig),transparent 35%)}
.cap{position:absolute;left:var(--g);right:var(--g);bottom:14px;z-index:1;font:400 12px/1.4 var(--mono);letter-spacing:.04em;color:#F1ECDF;display:flex;align-items:center;gap:8px}
.cap .sp{width:9px;height:9px;background:#F2C94C}
.feat-b{padding:22px var(--g) 0}
.feat-b h3{font-size:clamp(36px,8vw,50px);margin:8px 0 14px;text-wrap:balance}
.feat-b p{margin:0 0 14px;font-size:17px}
.meta{font:400 13px/1.5 var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.meta .who{color:var(--rose-ink)}
.acts{display:flex;align-items:center;gap:4px;margin-top:8px}
.acts a{min-width:44px;min-height:44px;display:inline-grid;place-items:center;text-decoration:none;border-radius:50%;font-size:17px}
.acts a:hover{background:var(--faint)}
.acts .more{margin-left:auto;color:var(--gold-ink);font-weight:600;font-size:15px}
.list{container-type:inline-size;display:grid;gap:18px}
.post{display:block;cursor:pointer;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--faint);transition:opacity 1.1s ease,filter 1.1s ease,transform 1.1s ease,box-shadow .4s,border-color .4s;transition-delay:calc(var(--i,0) * 60ms)}
.post .ph{aspect-ratio:16/10;background:var(--bg3);overflow:hidden}
.post .ph img{width:100%;height:100%;object-fit:cover}
.post .pb{padding:16px 18px 10px}
.post h3{font-size:30px;line-height:1.08;margin:6px 0 8px}
.post p{margin:0;color:var(--muted);font-size:16px;line-height:1.55}
.post .et{margin-top:10px;font:400 12px/1.4 var(--mono);color:var(--teal-ink);letter-spacing:.03em}
.post[data-reveal],.feat[data-reveal]{opacity:.22;filter:saturate(.2) brightness(.65);transform:translateY(14px)}
.post.is-in,.feat.is-in{opacity:1;filter:none;transform:none}
.post .meta .sp{width:10px;height:10px;opacity:.25;transition:opacity 1s .4s,filter 1s .4s}
.post.is-in .meta .sp,.feat.is-in .meta .sp{opacity:1;filter:drop-shadow(0 0 5px var(--star))}
.post:hover{border-color:rgba(var(--gold-rgb),.45);box-shadow:0 0 0 1px rgba(var(--gold-rgb),.2),var(--shadow)}
.noph{background:radial-gradient(circle at 30% 30%,var(--bg3),var(--bg2));display:grid;place-items:center}
.noph .sp{width:36px;height:36px;filter:drop-shadow(0 0 12px var(--star))}
@container (min-width:520px){
  .post{display:grid;grid-template-columns:42% 1fr}
  .post .ph{aspect-ratio:auto;height:100%;min-height:220px}
}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--hair);border-radius:22px;color:var(--muted);font:italic 400 22px/1.3 var(--serif)}
.more-row{margin-top:30px;display:grid;gap:14px}
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:6px;align-items:center;padding:8px;border-radius:20px;border:1px solid var(--faint);text-decoration:none;background:var(--card)}
.gal img{aspect-ratio:1;object-fit:cover;border-radius:12px;width:100%}
.gal span{padding:0 10px 0 8px;font:400 22px/1.1 var(--serif);white-space:nowrap}
.gal span small{display:block;font:400 11px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em}

/* ── calendar ── */
.cal{padding:22px 14px 16px;border-radius:24px;background:radial-gradient(ellipse at 50% 0,var(--bg3),var(--bg2) 70%);border:1px solid var(--faint)}
[data-theme="day"] .cal{background:#1B2A4E;color:#EEE8DA;--muted:#C4C3C2;--star:#F2C94C}
.cal-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 6px 14px}
.cal-h b{font:italic 400 30px/1 var(--serif)}
.cal-h a{font:400 13px/1 var(--mono);color:var(--muted);text-decoration:none;min-width:44px;min-height:44px;display:inline-grid;place-items:center}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-g .wd{font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.1em;padding:6px 0 10px}
.n{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;border-radius:14px;font:400 11px/1 var(--mono);color:var(--muted)}
.n i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.n.fut i{background:none;border:1px solid currentColor;width:5px;height:5px;opacity:.5}
.n.fut{opacity:.6}
.n.lit{color:#F7F1E1}
.n.lit i{width:20px;height:20px;border-radius:0;opacity:1;background:var(--star);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 6px var(--star))}
.n.lit:hover{background:rgba(242,201,76,.1)}
.n.today{outline:1px solid rgba(79,193,181,.6);outline-offset:-4px}
.cal-l{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 6px 0;font:400 12px/1.4 var(--mono);color:var(--muted)}
.cal-l span{display:inline-flex;align-items:center;gap:7px}

/* ── crew ── */
.crew{display:grid;gap:16px}
.mate{border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--faint)}
.mate .ph{aspect-ratio:848/380;overflow:hidden;background:var(--moon)}
.mate .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.mate .ph.boat::after{display:none}
.mate .ph.boat img{object-position:top;mix-blend-mode:multiply}
.mate div.b{padding:16px 18px 18px;display:flex;gap:14px;align-items:center}
.mate .em{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bg3);flex:none}
.mate h3{font-size:32px}
.mate h3 small{font:italic 400 22px/1 var(--serif);color:var(--gold-ink);margin-left:6px}
.mate p{margin:3px 0 0;font:400 13px/1.4 var(--mono);color:var(--muted)}

/* ── genèse ── */
.gen{display:grid;gap:26px;align-items:center}
.ring{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:400 64px/1 var(--serif);color:var(--gold-ink)}
.ring small{font:400 12px/1.4 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.gen p{margin:0 0 12px}

/* ── programme ── */
.orb{position:relative;width:min(100%,520px);aspect-ratio:1;margin:8px auto 22px}
.orb svg{width:100%;height:100%;overflow:visible}
.rt{fill:none;stroke:var(--star);stroke-width:2.5;stroke-dasharray:3 9;stroke-linecap:round}
.orbit{fill:none;stroke:var(--faint);stroke-width:1.5}
.fl{position:absolute;transform:translate(-50%,-50%);font-size:15px;line-height:1;pointer-events:none}
.orb .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.orb .ctr b{font:italic 400 26px/1 var(--serif)}
.orb .ctr small{font:400 11px/1.4 var(--mono);color:var(--muted);letter-spacing:.1em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 24px}
.facts div{padding:14px 10px;border-radius:16px;border:1px solid var(--faint);text-align:center;font-size:14px;line-height:1.35;color:var(--muted)}
.facts b{display:block;font:400 24px/1.1 var(--serif);color:var(--ink);margin-bottom:4px}
.phases{list-style:none;margin:0 0 26px;padding:0 0 0 22px;position:relative}
.phases::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:linear-gradient(var(--star),rgba(var(--gold-rgb),.15))}
.phases li{position:relative;padding:9px 0;border-bottom:1px solid var(--faint);display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.phases li::before{content:"";position:absolute;left:-22px;top:15px;width:11px;height:11px;background:var(--star);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.phases li.done::before{filter:drop-shadow(0 0 4px var(--star))}
.phases li:not(.done)::before{opacity:.45}
.phases b{font-weight:600;font-size:16px}
.phases .mono{grid-column:2;color:var(--gold-ink);font-size:12px}
.phases span.d{grid-column:2;color:var(--muted);font-size:15px;line-height:1.4}

/* ── forms ── */
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:14px;font-weight:600}
.form .hint{font-size:14px;color:var(--muted);margin:-4px 0 4px}
textarea{min-height:130px;resize:vertical}
.news{margin-top:40px;padding:24px 20px;border-radius:24px;background:var(--card);border:1px solid var(--faint)}
.news h3{font-size:34px;margin-bottom:6px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-size:16px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--star);flex:none}

/* ── closing ── */
.close{position:relative;text-align:center;padding:90px var(--g) 120px}
.close img{width:190px;margin:0 auto 10px;filter:drop-shadow(0 0 40px rgba(var(--gold-rgb),.25))}
.close blockquote{margin:0 auto;max-width:18em;font:italic 400 clamp(32px,7vw,52px)/1.15 var(--serif)}
.close .row{justify-content:center;margin-top:30px}
.ft{position:relative;border-top:1px solid var(--faint);padding:28px var(--g) calc(110px + env(safe-area-inset-bottom,0px));text-align:center;background:var(--bg)}
.ft b{font:italic 400 22px/1.2 var(--serif);font-weight:400}
.ft small{display:block;margin-top:8px;font:400 11.5px/1.4 var(--mono);color:var(--muted);letter-spacing:.04em}

/* ── tablet ── */
@media (min-width:640px){
  :root{--g:32px}
  .figs ul{grid-template-columns:repeat(4,minmax(0,1fr))}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .today{grid-template-columns:repeat(4,minmax(0,1fr))}
  .feat .ph{aspect-ratio:3/2}
  .map{aspect-ratio:4/3;margin:0}
  .feat{margin:0 0 34px}.feat-b{padding:22px 0 0}
  .feat .ph{border-radius:24px}
  .crew{grid-template-columns:repeat(2,minmax(0,1fr))}.crew .mate:last-child{grid-column:1/-1}
  .story,.sky{max-width:760px;margin:0 auto}
}

/* ── desktop: sticky sky left, story right ── */
@media (min-width:1024px){
  :root{--hh:72px}
  .hd-in{padding:0 28px;gap:6px}
  .nav{display:flex;gap:2px;margin-right:10px}
  .nav a{padding:10px 10px;border-radius:999px;font-size:14px;text-decoration:none;color:var(--muted);min-height:44px;display:inline-flex;align-items:center}
  .nav a:hover{color:var(--ink);background:var(--faint)}
  .hd .login{display:inline-flex;min-height:42px;padding:0 16px;font-size:14px;margin-right:6px}
  .theme{width:auto;padding:0 14px 0 12px;gap:8px;display:inline-flex;align-items:center;border-radius:999px}
  .theme span{display:inline;font-size:14px}
  .pill,.sheet{display:none!important}
  .hero{padding-bottom:64px}
  .hero .wrap{padding:0 56px;max-width:1360px}
  .moonart{width:420px;height:420px;right:4%;top:auto;bottom:16%}
  .figs .wrap{padding:0 56px;max-width:1360px}
  .figs li{padding:26px 24px}
  .figs b{font-size:56px}
  .sec{padding:84px 44px}
  .close{padding:130px 40px 140px}
  .ft{padding-bottom:36px}
}
/* ⚠️ Revue (Bertrand, iPad, 18 oct.) : le ciel collé à gauche + le récit à droite
   seulement à la souris. Sur iPad on restait « bloqué sur la route en étoile » :
   une seule colonne, comme sur téléphone, mais à la largeur de la tablette. */
@media (min-width:1024px) and (hover:hover) and (pointer:fine){
  .split{display:grid;grid-template-columns:minmax(0,55fr) minmax(0,45fr);align-items:start}
  .sky{position:sticky;top:0;height:100vh;max-width:none;margin:0;padding:calc(var(--hh) + 26px) 48px 30px;display:flex;flex-direction:column}
  .sky-head p{font-size:16px}
  .stage{flex:1;min-height:0;margin:20px 0 0;container-type:size}
  .layer{position:absolute;inset:0;display:grid;place-items:center}
  .layer.route{display:grid;opacity:0;pointer-events:none}
  .sky[data-mode="route"] .layer.track{opacity:0}
  .sky[data-mode="route"] .layer.route{opacity:1}
  .cst{width:min(100cqw,calc(100cqh * var(--ar)))}
  .layer.route .orb{width:min(100cqw,100cqh);margin:0}
  .active{display:flex;align-items:center;gap:12px;min-height:58px;margin-top:14px;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--bg2) 70%,transparent);border:1px solid var(--faint);font-size:15px}
  .active .mono{color:var(--gold-ink)}
  .active b{font:italic 400 20px/1.2 var(--serif);font-weight:400}
  .story{max-width:none;margin:0;border-left:1px solid var(--faint);box-shadow:-40px 0 80px rgba(0,0,0,.25)}
  [data-theme="day"] .story{box-shadow:-30px 0 60px rgba(80,60,20,.06)}
  .story .orb.inline{display:none}
  .crew{grid-template-columns:1fr}
  .crew .mate{display:grid;grid-template-columns:44% 1fr}
  .crew .mate .ph{aspect-ratio:auto;height:100%;min-height:150px}
}
@media (min-width:1024px) and (not ((hover:hover) and (pointer:fine))){
  .split,.story{max-width:880px;margin-left:auto;margin-right:auto}
  .sky{max-width:880px;margin-left:auto;margin-right:auto}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* revue: garde-fou */ #app{overflow-x:clip}
.phases li{display:block}.phases .mono{margin-left:8px}.phases span.d{display:block;margin-top:2px}
@media (max-width:767px){.moonart{width:150px;height:150px;right:-46px;top:calc(var(--hh) + 96px);opacity:.55}}

<body data-design="d2">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="halo"><stop offset="0" stop-color="#F2C94C" stop-opacity=".55"/><stop offset="1" stop-color="#F2C94C" stop-opacity="0"/></radialGradient>
  <radialGradient id="pl" cx=".35" cy=".3"><stop offset="0" stop-color="#4FC1B5" stop-opacity=".55"/><stop offset="1" stop-color="#13244A" stop-opacity=".2"/></radialGradient>
  <path id="sp" d="M0-1C.1-.1.1-.1 1 0 .1.1.1.1 0 1-.1.1-.1.1-1 0-.1-.1-.1-.1 0-1Z"/>
</defs></svg>
<div id="app"></div>
<script src="data.js"></script>
<script src="wg.js"></script>
<script>
(() => {
const { D, t, esc } = WG;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPLIT = matchMedia('(min-width:1024px) and (hover:hover) and (pointer:fine)');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const S = { ch: '', et: '', theme: WG.store.get('wg-d2-theme') || 'night', active: null };
const root = document.documentElement;
const applyTheme = () => { root.dataset.theme = S.theme; $('meta[name="theme-color"]').content = S.theme === 'day' ? '#F7F2E7' : '#0B1530'; };
applyTheme();

/* ───────── icons ───────── */
const I = {
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
  book: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7h6"/>',
  orbit: '<circle cx="12" cy="12" r="3.2"/><ellipse cx="12" cy="12" rx="9.5" ry="4" transform="rotate(-20 12 12)"/>',
  crew: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20a6 6 0 0 1 12 0M15 15.6A4.5 4.5 0 0 1 21 20"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
};
const ic = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const SP = '<span class="sp" aria-hidden="true"></span>';

/* ───────── the track as a constellation (Mercator, viewBox 1000 × H) ───────── */
const merc = (la) => Math.log(Math.tan(Math.PI / 4 + (la * Math.PI) / 360)) * 180 / Math.PI;
const TR = (() => {
  const P = D.track; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, la0 = 1e9, la1 = -1e9;
  for (const [lo, la] of P) { const y = merc(la); x0 = Math.min(x0, lo); x1 = Math.max(x1, lo); y0 = Math.min(y0, y); y1 = Math.max(y1, y); la0 = Math.min(la0, la); la1 = Math.max(la1, la); }
  const VW = 1000, pad = 70, k = (VW - 2 * pad) / (x1 - x0), VH = Math.round((y1 - y0) * k + 2 * pad);
  const pr = ([lo, la]) => [pad + (lo - x0) * k, pad + (y1 - merc(la)) * k];
  const d = WG.segments(P).map((s) => s.map((p, i) => { const [x, y] = pr(p); return `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`; }).join('')).join('');
  // cumulative drawn length (gaps > 0.6° are not drawn, as in WG.segments)
  const cum = [0];
  for (let i = 1; i < P.length; i++) {
    const jump = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]) > 0.6;
    const [ax, ay] = pr(P[i - 1]), [bx, by] = pr(P[i]);
    cum.push(cum[i - 1] + (jump ? 0 : Math.hypot(bx - ax, by - ay)));
  }
  const total = cum[cum.length - 1];
  const near = (lo, la) => { let b = 0, bd = 1e9; P.forEach((p, i) => { const q = (p[0] - lo) ** 2 + (p[1] - la) ** 2; if (q < bd) { bd = q; b = i; } }); return b; };
  // posts whose position falls inside the sailed area become stars (grouped when they share a spot)
  const G = new Map();
  for (const p of D.posts) {
    if (p.lat == null || p.lon == null || p.lon < x0 - .4 || p.lon > x1 + .4 || p.lat < la0 - .4 || p.lat > la1 + .4) continue;
    const key = `${p.lat.toFixed(2)},${p.lon.toFixed(2)}`;
    if (!G.has(key)) G.set(key, { ll: [p.lon, p.lat], posts: [], f: cum[near(p.lon, p.lat)] / total });
    G.get(key).posts.push(p);
  }
  const east = P.reduce((a, p) => (p[0] > a[0] ? p : a));
  const places = [
    { fr: 'La Grande-Motte', ll: P[0], c: 't' }, { fr: 'La Ciotat', ll: [5.63, 43.17], c: 'r' },
    { fr: 'Minorque', en: 'Minorca', ll: WG.lastPoint(), c: 'l' }, { fr: 'Sardaigne', en: 'Sardinia', ll: [8.33, 40.0], c: 'r' },
    { fr: 'Malte', en: 'Malta', ll: [14.52, 35.9], c: 'b' }, { fr: 'Grèce', en: 'Greece', ll: east, c: 'l' },
  ];
  return { VW, VH, pr, d, groups: [...G.values()], places };
})();
const pct = (x, y) => `left:${(x / TR.VW * 100).toFixed(2)}%;top:${(y / TR.VH * 100).toFixed(2)}%`;

const constellation = () => {
  const stars = TR.groups.map((g, i) => {
    const [x, y] = TR.pr(g.ll); const r = 13 + Math.min(g.posts.length, 4) * 3;
    return `<g class="st" data-i="${i}" data-f="${g.f.toFixed(4)}" data-ids="${g.posts.map((p) => p.id).join(' ')}"><circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r * 2.6}"/><use class="core" href="#sp" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${r})"/></g>`;
  }).join('');
  const labels = TR.places.map((p) => { const [x, y] = TR.pr(p.ll); return `<span class="plc ${p.c}" style="${pct(x, y)}">${esc(t(p.fr, p.en || p.fr))}</span>`; }).join('');
  const [nx, ny] = TR.pr(WG.lastPoint());
  return `<div class="cst" style="--ar:${(TR.VW / TR.VH).toFixed(4)};aspect-ratio:${TR.VW}/${TR.VH}">
    <svg viewBox="0 0 ${TR.VW} ${TR.VH}" role="img" aria-label="${esc(t('La trace naviguée, dessinée comme une constellation', 'The sailed track, drawn as a constellation'))}">
      <path class="trk-glow" d="${TR.d}"/><path class="trk" d="${TR.d}"/>${stars}
    </svg>${labels}<span class="now" style="${pct(nx, ny)}" title="${esc(t('Dernière position publique', 'Latest public position'))}"></span></div>`;
};

/* ───────── the planned route as an orbit around a little planet ───────── */
const orbit = (cls = '') => {
  const C = 500, R = 430, a0 = WG.ROUTE[0][0];
  const pr = ([lo, la]) => { const a = ((a0 - lo) / 360) * 2 * Math.PI, r = R * (0.62 + (la / 44) * 0.3); return [C - r * Math.sin(a), C - r * Math.cos(a)]; };
  const pts = [];
  WG.ROUTE.forEach((p, i) => {
    if (!i) { pts.push(p); return; }
    const q = WG.ROUTE[i - 1], n = Math.max(1, Math.ceil(Math.abs(p[0] - q[0]) / 3));
    for (let s = 1; s <= n; s++) pts.push([q[0] + (p[0] - q[0]) * s / n, q[1] + (p[1] - q[1]) * s / n]);
  });
  const d = pts.map((p, i) => { const [x, y] = pr(p); return `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`; }).join('');
  const stars = WG.PHASES.map((ph, i) => { const [x, y] = pr(ph.lonlat); return `<use href="#sp" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${i < 3 ? 22 : 16})" fill="var(--star)" opacity="${i < 3 ? 1 : i === 3 ? .8 : .5}"/>`; }).join('');
  const flags = WG.PHASES.map((ph) => { const [x, y] = pr(ph.lonlat); const ox = (x - C) * 0.13, oy = (y - C) * 0.13; return `<span class="fl" style="left:${((x + ox) / 10).toFixed(2)}%;top:${((y + oy) / 10).toFixed(2)}%" title="${esc(ph.place)}">${ph.flag}</span>`; }).join('');
  return `<div class="orb ${cls}"><svg viewBox="0 0 1000 1000" role="img" aria-label="${esc(t('La route prévue autour du monde, en orbite', 'The planned round-the-world route, as an orbit'))}">
    <circle class="orbit" cx="500" cy="500" r="${R * 0.62}"/><circle cx="500" cy="500" r="96" fill="url(#pl)" stroke="var(--teal)" stroke-opacity=".5"/>
    <ellipse cx="500" cy="500" rx="170" ry="34" fill="none" stroke="var(--star)" stroke-opacity=".55" stroke-width="2" transform="rotate(-18 500 500)"/>
    <path class="rt" d="${d}"/>${stars}</svg>${flags}
    <div class="ctr"><b>${t('Le tour', 'Around')}</b><small>2026 — 2029</small></div></div>`;
};

/* ───────── 60-star ring (Hwangap, the 60-year cycle) ───────── */
const ring = () => {
  let s = '';
  for (let i = 0; i < 60; i++) { const a = (i / 60) * 2 * Math.PI, x = 150 + 128 * Math.sin(a), y = 150 - 128 * Math.cos(a); s += i ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i % 5 ? 1.6 : 2.6}" fill="currentColor" opacity="${i % 5 ? .45 : .8}"/>` : `<use href="#sp" transform="translate(${x} ${y}) scale(13)" fill="var(--star)"/><circle cx="${x}" cy="${y}" r="26" fill="url(#halo)"/>`; }
  return `<div class="ring" style="color:var(--muted)"><svg viewBox="0 0 300 300" aria-hidden="true">${s}</svg><div><b>환갑</b><small>Hwangap · 60</small></div></div>`;
};

let mapEl = null;
function drawMap() {
  const el = $('#map'); if (!el) return;
  const fresh = el.cloneNode(false); el.replaceWith(fresh); mapEl = fresh; // new node: the old ResizeObserver lets go
  const night = S.theme === 'night';
  WG.staticMap(fresh, {
    tiles: night ? 'dark' : 'light',
    filter: night ? 'sepia(.5) hue-rotate(180deg) saturate(1.8) brightness(.78) contrast(1.1)' : 'sepia(.35) saturate(.75) brightness(1.03)',
    line: { color: night ? '#F2C94C' : '#B8860B', width: 2.4, glow: night ? '#F2C94C' : '#E0B94A', draw: true },
    pad: 30,
    dots: TR.groups.map((g) => ({ lon: g.ll[0], lat: g.ll[1], html: '<i class="mapstar"></i>' })),
    boat: { html: '<i class="mapboat"></i>' },
  });
}

let trkLen = 0, groups = [];
function setupSky() {
  const paths = $$('#sky .trk, #sky .trk-glow');
  trkLen = paths[0] ? paths[0].getTotalLength() : 0;
  paths.forEach((p) => { p.style.strokeDasharray = `${trkLen} ${trkLen}`; p.style.strokeDashoffset = RM ? 0 : trkLen; });
  groups = $$('#sky .st').map((g) => ({ el: g, f: +g.dataset.f, ids: g.dataset.ids.split(' ') }));
}
let ticking = false;
function onScroll() {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    $('#hd')?.classList.toggle('solid', scrollY > 30);
    const sky = $('#sky'); if (!sky) return;
    let p = 1;
    if (!RM) {
      const vh = innerHeight;
      if (SPLIT.matches) {
        const a = $('.split').getBoundingClientRect(), b = $('#carnet').getBoundingClientRect();
        p = (-a.top + vh * 0.5) / Math.max(1, b.bottom - a.top - vh * 0.3);
      } else {
        const r = sky.getBoundingClientRect(); p = (vh * 0.85 - r.top) / (vh * 0.8);
      }
      p = Math.max(0, Math.min(1, p));
    }
    $$('#sky .trk, #sky .trk-glow').forEach((el) => { el.style.strokeDashoffset = (trkLen * (1 - p)).toFixed(1); });
    groups.forEach((g) => g.el.classList.toggle('on', p >= g.f - 0.003));
  });
}
function markFilter() {
  const ids = new Set(filtered().map((p) => p.id));
  groups.forEach((g) => g.el.classList.toggle('dim', (S.ch || S.et) && !g.ids.some((id) => ids.has(id))));
}
let obs = [];
function watch() {
  obs.forEach((o) => o.disconnect()); obs = [];
  if (!('IntersectionObserver' in window)) return;
  // the star of the story in view shines brighter (desktop: the sky is beside it)
  const act = $('#active');
  const io = new IntersectionObserver((ents) => ents.forEach((en) => {
    if (!en.isIntersecting) return;
    const id = en.target.getAttribute('data-post'); const p = D.posts.find((x) => x.id === id); if (!p) return;
    groups.forEach((g) => g.el.classList.toggle('act', g.ids.includes(id)));
    const g = groups.find((x) => x.ids.includes(id));
    if (act) act.innerHTML = `${SP}<span class="mono">${capline(p)}</span><b>${esc(WG.title(p))}</b>${g ? '' : `<span class="mono" style="margin-left:auto;color:var(--muted)">${t('écrit à terre', 'written ashore')}</span>`}`;
  }), { rootMargin: '-45% 0px -45% 0px' });
  $$('#list [data-post]').forEach((el) => io.observe(el)); obs.push(io);
  const sky = $('#sky');
  const io2 = new IntersectionObserver((ents) => ents.forEach((en) => { sky.dataset.mode = en.isIntersecting ? 'route' : 'track'; }), { rootMargin: '-40% 0px -40% 0px' });
  io2.observe($('#programme')); obs.push(io2);
  Stars.watch($$('[data-sky]'));
}
function renderList() {
  $('#list').innerHTML = listHTML(); $('#count').innerHTML = countHTML();
  WG.reveal($('#list')); markFilter(); watch();
}
function render() {
  const y = scrollY;
  $('#app').innerHTML = page();
  drawMap(); setupSky(); markFilter(); WG.reveal(); watch(); onScroll();
  scrollTo(0, y);
}

document.addEventListener('change', (e) => {
  if (e.target.id === 'fch') { S.ch = e.target.value; if (S.et && D.etapes.find((x) => x.id === S.et)?.chapter_id !== S.ch && S.ch) S.et = ''; $('#fet').innerHTML = etapeOpts(); renderList(); }
  if (e.target.id === 'fet') { S.et = e.target.value; renderList(); }
});
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-lang]')) { WG.setLang(WG.lang === 'fr' ? 'en' : 'fr'); return; }
  if (e.target.closest('[data-theme-btn]')) {
    S.theme = S.theme === 'night' ? 'day' : 'night'; WG.store.set('wg-d2-theme', S.theme); applyTheme();
    const b = e.target.closest('[data-theme-btn]'); b.outerHTML = themeBtn(); $('[data-theme-btn]').focus(); drawMap(); Stars.recolor(); return;
  }
  if (e.target.closest('[data-sheet]')) { $('#sheet').classList.add('open'); $('#sheet a')?.focus(); return; }
  if (e.target.closest('[data-sheet-x]') || e.target.id === 'sheet') $('#sheet').classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') $('#sheet')?.classList.remove('open');
  const c = e.target.closest?.('[data-post]');
  if (c && (e.key === 'Enter' || e.key === ' ') && e.target === c) { e.preventDefault(); const p = D.posts.find((x) => x.id === c.dataset.post); if (p) WG.openPost(p); }
});
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', onScroll);
addEventListener('wg:lang', render);

/* ───────── the star field: one small canvas, paused when hidden ───────── */
const Stars = (() => {
  const c = document.createElement('canvas'); c.className = 'stars'; c.setAttribute('aria-hidden', 'true'); document.body.prepend(c);
  const x = c.getContext('2d'); let W = 0, H = 0, list = [], raf = 0, last = 0, seen = 0, io, rgb, gold, dayMode;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const recolor = () => { const cs = getComputedStyle(root); rgb = cs.getPropertyValue('--star-rgb').trim(); gold = cs.getPropertyValue('--gold-rgb').trim(); dayMode = S.theme === 'day'; draw(performance.now()); };
  const size = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; c.style.width = `${W}px`; c.style.height = `${H}px`; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed = 7; const n = Math.round(Math.min(140, Math.max(60, (W * H) / 7500)));
    list = Array.from({ length: n }, () => ({ x: rnd() * W, y: rnd() * H, r: rnd() < 0.12 ? 1.3 + rnd() * 0.9 : 0.4 + rnd() * 0.8, a: 0.35 + rnd() * 0.6, s: 0.0004 + rnd() * 0.0012, ph: rnd() * 6.28, g: rnd() < 0.1 }));
    draw(performance.now());
  };
  function draw(tm) {
    x.clearRect(0, 0, W, H);
    for (const s of list) {
      const tw = RM ? 1 : 0.55 + 0.45 * Math.sin(tm * s.s + s.ph);
      const a = s.a * tw * (dayMode ? 0.45 : 1);
      x.fillStyle = `rgba(${s.g ? gold : rgb},${a.toFixed(3)})`;
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.2832); x.fill();
      if (s.r > 1.5) { x.fillRect(s.x - s.r * 3, s.y - 0.3, s.r * 6, 0.6); x.fillRect(s.x - 0.3, s.y - s.r * 3, 0.6, s.r * 6); }
    }
  }
  const frame = (tm) => { raf = 0; if (tm - last > 50) { last = tm; draw(tm); } loop(); };
  const loop = () => { if (!raf && !RM && seen > 0 && !document.hidden) raf = requestAnimationFrame(frame); };
  const stop = () => { if (raf) cancelAnimationFrame(raf); raf = 0; };
  document.addEventListener('visibilitychange', () => (document.hidden ? stop() : loop()));
  addEventListener('resize', () => { clearTimeout(size.t); size.t = setTimeout(size, 150); });
  const watch = (els) => {
    io?.disconnect(); seen = 0;
    if (!('IntersectionObserver' in window)) { seen = 1; loop(); return; }
    const vis = new Set();
    io = new IntersectionObserver((ents) => { ents.forEach((en) => (en.isIntersecting ? vis.add(en.target) : vis.delete(en.target))); seen = vis.size; seen ? loop() : stop(); });
    els.forEach((el) => io.observe(el));
  };
  return { size, recolor, watch };
})();

Stars.recolor(); Stars.size();
WG.inert();
render();
})();
</script>
