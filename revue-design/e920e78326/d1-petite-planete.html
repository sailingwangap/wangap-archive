<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wang'ap — La Petite Planète (démo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&text=%ED%99%98%EA%B0%91&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wg.css">
<style>
:root{
  --paper:#F6EFDF;--card:#FBF6EA;--ink:#2E3A4B;--muted:#566172;--sky:#8FC1D4;--sky-ink:#2B6176;--gold:#E9B44C;--gold-ink:#7A5610;
  --rose:#C9534A;--rose-btn:#B2423A;--rose-ink:#A0372E;--green:#7A9A5B;--green-ink:#4A6732;--night:#26324A;
  --ft:'Fraunces',Georgia,serif;--fb:'Literata',Georgia,serif;--fh:'Caveat','Segoe Print',cursive;
  --rd-bg:#FBF6EA;--rd-ink:#2E3A4B;--rd-muted:#566172;--rd-accent:#A0372E;--rd-title:#2E3A4B;
  --rd-title-font:'Fraunces',Georgia,serif;--rd-body-font:'Literata',Georgia,serif;--rd-radius:24px;
  --gut:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background-color:var(--paper);background-image:var(--grain);color:var(--ink);font:400 17px/1.62 var(--fb);overflow-x:hidden;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky-ink);outline-offset:3px;border-radius:6px}
h1,h2,h3,.ft{font-family:var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:560;letter-spacing:-.012em;line-height:1.1;margin:0}
.hand{font-family:var(--fh);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gut)}
.sec{position:relative;isolation:isolate;padding:56px 0}
.washes{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.wash{position:absolute;width:var(--s);aspect-ratio:1;background:radial-gradient(closest-side,rgba(var(--c),.30) 0,rgba(var(--c),.22) 52%,rgba(var(--c),.5) 70%,rgba(var(--c),0) 76%);-webkit-mask:var(--m-blob) center/100% 100% no-repeat;mask:var(--m-blob) center/100% 100% no-repeat;opacity:0;transform:scale(.5) rotate(-10deg);transition:opacity 1.6s ease,transform 2.4s cubic-bezier(.2,.7,.2,1)}
.wash.b2{-webkit-mask-image:var(--m-blob2);mask-image:var(--m-blob2)}
.wash.is-in{opacity:1;transform:none}
.sh{margin-bottom:26px;max-width:640px}
.kick{display:inline-block;font:700 25px/1 var(--fh);color:var(--rose-ink);transform:rotate(-2deg);margin-bottom:8px}
.sh h2,.h2{font-size:clamp(31px,6.4vw,50px)}
.sh p{margin:10px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:28px 22px 26px 20px/22px 26px 20px 28px;font:600 16px/1.1 var(--fb);text-decoration:none;border:0;cursor:pointer;transition:transform .2s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--rose-btn);color:#fff;box-shadow:0 3px 0 #85302A}
.btn-s{background:rgba(251,246,234,.7);color:var(--ink);border:1.7px solid var(--ink)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.link{color:var(--rose-ink);font-weight:600;text-decoration:none;border-bottom:1.5px solid rgba(160,55,46,.35);padding:10px 0 2px;display:inline-block}

/* masques aquarelle */
.mr1{-webkit-mask:var(--m-r1) center/100% 100% no-repeat;mask:var(--m-r1) center/100% 100% no-repeat}
.mr2{-webkit-mask:var(--m-r2) center/100% 100% no-repeat;mask:var(--m-r2) center/100% 100% no-repeat}
.mr3{-webkit-mask:var(--m-r3) center/100% 100% no-repeat;mask:var(--m-r3) center/100% 100% no-repeat}
.mrect{-webkit-mask:var(--m-rect) center/100% 100% no-repeat;mask:var(--m-rect) center/100% 100% no-repeat}

/* en-tête */
.top{padding:calc(10px + env(safe-area-inset-top,0px)) 0 6px;position:relative;z-index:5}
.top-in{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;min-height:48px;margin-right:auto}
.brand img{width:46px;height:46px;mix-blend-mode:multiply}
.brand b{font:italic 600 27px/1 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;letter-spacing:-.01em}
.nav{display:none}
.nav a{text-decoration:none;font-size:16px;padding:12px 2px;position:relative}
.nav a:hover{color:var(--rose-ink)}
.lang{display:inline-flex;border:1.6px solid var(--ink);border-radius:999px;padding:2px;background:rgba(251,246,234,.7)}
.lang button{min-width:44px;min-height:44px;border:0;background:none;border-radius:999px;font:600 15px/1 var(--fb);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.login{min-height:48px;padding:0 14px}
.login span{display:none}
.icbtn{width:48px;height:48px;border-radius:50%;border:1.6px solid var(--ink);background:rgba(251,246,234,.7);display:none;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* héros */
.hero{padding-top:6px}
.planet-wrap{position:relative;width:min(100%,400px);margin:0 auto}
.planet{display:block;width:100%;height:auto;overflow:visible}
.prince{position:absolute;left:-6%;bottom:2%;width:40%;height:auto;-webkit-mask:linear-gradient(#000 70%,transparent 96%);mask:linear-gradient(#000 70%,transparent 96%);filter:drop-shadow(0 6px 10px rgba(46,58,75,.12))}
.planet-cap{text-align:center;font-size:23px;color:var(--sky-ink);margin:-4px 0 0;transform:rotate(-1.5deg)}
.spin{transform-box:view-box;transform-origin:220px 262px;animation:spin 160s linear infinite}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 7s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 4s ease-in-out infinite}
.tw:nth-of-type(2n){animation-delay:-2s;animation-duration:5.5s}
@keyframes spin{to{transform:rotate(-360deg)}}
@keyframes bob{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(1.5px)}}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.hero-txt{text-align:center;margin-top:8px}
.chap-now{font-size:24px;color:var(--rose-ink);margin:0 0 10px;transform:rotate(-1.5deg)}
.badge{display:inline-block;font:600 14px/1.3 var(--fb);letter-spacing:.02em;padding:8px 16px;border-radius:999px;background:rgba(143,193,212,.32);color:var(--sky-ink);border:1.4px solid rgba(43,97,118,.35)}
.hero h1{font-size:clamp(32px,8.4vw,56px);margin:16px 0 0;font-weight:540}
.hero h1 em{font-style:italic;color:var(--rose-ink);font-weight:500}
.sub{margin:12px 0 0;font-size:18px;color:var(--muted)}
.q{margin:24px auto 0;max-width:470px;font:italic 400 19px/1.5 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;position:relative}
.q cite{display:block;font:600 19px/1.2 var(--fh);color:var(--muted);margin-top:6px;font-style:normal}
.q svg{width:30px;height:30px;display:block;margin:0 auto 4px}
.hero .ctas{justify-content:center}
.figs{list-style:none;padding:0;margin:40px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 12px}
.figs li{text-align:center;position:relative}
.figs .fig-i{width:68px;height:68px;margin:0 auto 6px;display:grid;place-items:center;position:relative}
.figs .fig-i::before{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,rgba(var(--c),.45),rgba(var(--c),.18) 70%,transparent);-webkit-mask:var(--m-r2) center/100% 100%;mask:var(--m-r2) center/100% 100%}
.figs svg{width:36px;height:36px;position:relative}
.figs b{display:block;font:600 34px/1 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1}
.figs span{display:block;font-size:15px;color:var(--muted);margin-top:4px;line-height:1.35}

/* livre ouvert (bureau) */
.page{position:relative}
.spread>.page+.page{margin-top:36px}

/* où sommes-nous */
.map{position:relative;overflow:hidden;aspect-ratio:1/0.92;background:#E9DEC4}
.map-cap{font-size:21px;color:var(--sky-ink);margin:4px 0 0;text-align:center;transform:rotate(-1deg)}
.boat-mk{display:block;width:18px;height:18px;border-radius:50%;background:var(--rose);border:3px solid #FBF6EA;box-shadow:0 0 0 7px rgba(233,180,76,.45),0 2px 6px rgba(0,0,0,.25)}
.fox{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.fox-i{position:relative;width:96px;height:96px}
.fox-i::before{content:"";position:absolute;inset:-6px;background:radial-gradient(closest-side,rgba(233,180,76,.5),rgba(233,180,76,.15) 75%,transparent);-webkit-mask:var(--m-r3) center/100% 100%;mask:var(--m-r3) center/100% 100%}
.fox-i img{position:relative;width:100%;height:100%;mix-blend-mode:multiply}
.bubble{position:relative;margin:0;background:#FFFCF4;border:1.6px solid rgba(46,58,75,.28);border-radius:22px 26px 24px 18px/20px 22px 26px 24px;padding:12px 15px;font:600 21px/1.25 var(--fh);color:var(--ink)}
.bubble::before{content:"";position:absolute;left:-9px;top:44%;width:16px;height:16px;background:#FFFCF4;border-left:1.6px solid rgba(46,58,75,.28);border-bottom:1.6px solid rgba(46,58,75,.28);transform:rotate(45deg);border-radius:0 0 0 4px}
.bubble b{color:var(--rose-ink)}
.pos{margin:22px 0 0;padding:14px 0;border-top:1.5px dashed rgba(46,58,75,.3);border-bottom:1.5px dashed rgba(46,58,75,.3)}
.pos dt{font-size:15px;color:var(--muted)}
.pos dd{margin:2px 0 0}
.pos .coord{font:600 22px/1.3 var(--ft);font-variation-settings:"SOFT" 100;letter-spacing:.01em}
.cockpit{display:flex;align-items:center;gap:12px;margin-top:20px;padding:14px 16px;text-decoration:none;border-radius:18px;background:rgba(122,154,91,.16);border:1.5px solid rgba(74,103,50,.35)}
.cockpit b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.cockpit small{display:block;font-size:14.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.cockpit .ic{color:var(--green-ink);width:30px;height:30px}
.cockpit>span:last-child{margin-left:auto;font-size:20px;color:var(--green-ink)}

/* escales — les planètes */
.row{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:8px 0 14px;scroll-padding:0 var(--gut)}
.row::-webkit-scrollbar{display:none}
.row-in{display:flex;gap:10px;width:max-content;padding:0 var(--gut);position:relative}
.row-in::before{content:"";position:absolute;left:40px;right:40px;top:86px;border-top:2px dashed rgba(122,86,16,.45);z-index:-1}
.pl{flex:0 0 auto;width:158px;scroll-snap-align:center;text-align:center;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;text-decoration:none;display:block}
.pl-disc{height:172px;display:grid;place-items:center}
.pl-o{position:relative;width:var(--d,128px);height:var(--d,128px);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pl:hover .pl-o{transform:translateY(-4px) rotate(-3deg)}
.pl-o::before{content:"";position:absolute;inset:-13%;background:radial-gradient(closest-side,rgba(var(--c),.55) 0,rgba(var(--c),.3) 70%,rgba(var(--c),0) 100%);-webkit-mask:var(--m-r2) center/100% 100% no-repeat;mask:var(--m-r2) center/100% 100% no-repeat}
.pl-ph{position:absolute;inset:0;overflow:hidden;background:#D9CDB2}
.pl-ph img{position:absolute;left:-8%;top:-8%;width:116%;height:116%;object-fit:cover;transform:translateX(var(--px,0))}
.pl-paint{position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.65),transparent 40%),radial-gradient(circle at 60% 70%,rgba(var(--c),.9),rgba(var(--c),.55))}
.pl-paint svg{position:absolute;left:50%;top:50%;width:34%;transform:translate(-50%,-50%)}
.pl.cur .pl-o{--d:150px}
.pl.cur .pl-o::after{content:"";position:absolute;inset:-9%;border-radius:50%;border:2px dashed var(--gold-ink);animation:spin 40s linear infinite}
.pl-n{display:block;font:700 20px/1 var(--fh);color:var(--rose-ink);margin-top:2px}
.pl-t{display:block;font:560 17px/1.2 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;margin:4px 6px 0;min-height:2.4em}
.pl-t::first-letter{text-transform:uppercase}
.pl-d{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.pl-now{position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(-4deg);white-space:nowrap;background:var(--gold);color:#2E3A4B;font:700 17px/1 var(--fh);padding:5px 10px;border-radius:12px 14px 10px 14px;z-index:2}
.pl[data-reveal] .pl-o{opacity:.2;transform:scale(.82);filter:blur(4px);transition:opacity 1.1s,transform 1.4s cubic-bezier(.2,.8,.2,1),filter 1.1s}
.pl.is-in .pl-o{opacity:1;transform:none;filter:none}
.row-nav{display:none;gap:10px;justify-content:flex-end;margin-top:4px}
.row-nav button{width:48px;height:48px;border-radius:50%;border:1.6px solid var(--ink);background:var(--card);font-size:20px;cursor:pointer;color:var(--ink)}

/* table des matières + sillage */
.epi{font:italic 400 18px/1.5 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;color:var(--muted);margin:14px 0 22px}
.toc{list-style:none;margin:0;padding:0}
.toc li+li{border-top:1px solid rgba(46,58,75,.1)}
.toc button{display:flex;align-items:flex-end;gap:10px;width:100%;min-height:64px;padding:12px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.toc button:hover .toc-t{color:var(--rose-ink)}
.toc-n{font:600 22px/1 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;color:var(--rose-ink);min-width:34px;align-self:flex-start;padding-top:3px}
.toc-t{font:560 20px/1.2 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;flex:0 1 auto}
.toc-t small{display:block;font:400 14.5px/1.3 var(--fb);color:var(--muted);margin-top:4px}
.toc-dots{flex:1 1 24px;min-width:24px;border-bottom:2.5px dotted rgba(46,58,75,.45);margin-bottom:7px}
.toc-p{font:700 20px/1 var(--fh);white-space:nowrap;padding-bottom:3px}
.toc li.cur .toc-p{color:var(--rose-ink)}
.sil-ph{position:relative;margin:18px 0 0;aspect-ratio:4/3}
.sil-ph img{width:100%;height:100%;object-fit:cover;display:block}
.sil-ph svg{position:absolute;inset:0;width:100%;height:100%}
.sil-ph figcaption{font:600 20px/1.2 var(--fh);color:var(--sky-ink);margin-top:6px;transform:rotate(-1deg)}
.sil h3{font-size:clamp(26px,5vw,34px)}
.sil p{margin:8px 0 0;color:var(--muted)}

/* carnet */
.today{margin:0 0 30px}
.today h3{font:700 25px/1.1 var(--fh);color:var(--sky-ink);margin:0 0 12px}
.stats{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats li{padding:14px 14px 12px;border-radius:22px 18px 24px 16px/18px 24px 16px 22px;background:rgba(var(--c),.2);border:1.4px solid rgba(var(--c),.55)}
.stats b{display:block;font:600 32px/1 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1}
.stats span{font-size:15px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end;margin:0 0 26px}
.fl{flex:1 1 220px;display:block}
.fl span{display:block;font:700 20px/1 var(--fh);color:var(--muted);margin:0 0 4px 4px}
.fl select{width:100%;min-height:50px;-webkit-appearance:none;appearance:none;font:400 16px/1.2 var(--fb);color:var(--ink);background:#FFFCF4 var(--chev) right 14px center/14px no-repeat;border:1.6px solid rgba(46,58,75,.5);border-radius:16px 20px 14px 18px;padding:0 40px 0 14px}
.fcount{flex:1 0 100%;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted);min-height:24px}
.fcount button{background:none;border:0;color:var(--rose-ink);font:600 15px var(--fb);min-height:44px;cursor:pointer;text-decoration:underline;padding:0}
[data-post]{cursor:pointer}
.feat{margin-bottom:34px}
.feat-ph{position:relative;aspect-ratio:4/3;background:#E2D6BC}
.feat-ph img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font:600 21px/1.2 var(--fh);color:var(--sky-ink);margin:8px 4px 0;transform:rotate(-1deg)}
.meta{font-size:14.5px;color:var(--muted);margin:0}
.etp{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;color:var(--green-ink);margin-top:6px;line-height:1.3}
.etp::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px rgba(122,154,91,.25)}
.feat h3{font-size:clamp(28px,6vw,40px);margin:10px 0 0}
.feat .ex{margin:12px 0 0}
.acts{display:flex;align-items:center;gap:4px;margin-top:12px}
.acts a{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;text-decoration:none;font-size:19px}
.acts a:hover{background:rgba(201,83,74,.1)}
.more{margin-left:auto;font-weight:600;color:var(--rose-ink);font-size:16px;white-space:nowrap}
.cards{display:grid;gap:22px}
.card{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:start}
.card-ph{position:relative;width:104px;height:104px;background:#E2D6BC}
.card-ph img{width:100%;height:100%;object-fit:cover;display:block}
.card-ph .pl-paint{--c:143,193,212}
.card h3{font-size:20px;margin:3px 0 0;line-height:1.18}
.card .cap{display:none}
.card .acts{margin-top:4px;margin-left:-10px}
.card .more{font-size:15px}
.empty{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;max-width:560px}
.aside{display:grid;gap:22px;margin-top:40px}
.box{background:var(--card);border-radius:24px 18px 26px 20px/20px 26px 18px 24px;padding:20px;box-shadow:0 1px 0 rgba(46,58,75,.08),0 14px 30px -24px rgba(46,58,75,.5)}
.box h3{font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:12px;text-align:center}
.cal i{font:600 13px/1 var(--fb);font-style:normal;color:var(--muted);padding:6px 0}
.cal span,.cal a{display:grid;place-items:center;height:42px;font-size:15px;border-radius:50%}
.cal a{font-weight:700;text-decoration:none;position:relative;color:var(--ink)}
.cal a::before{content:"";position:absolute;inset:1px;background:radial-gradient(closest-side,rgba(233,180,76,.85),rgba(233,180,76,.45) 75%,transparent);-webkit-mask:var(--m-r1) center/100% 100%;mask:var(--m-r1) center/100% 100%;z-index:-1}
.cal{isolation:isolate}
.cal-l{font:600 18px/1.2 var(--fh);color:var(--muted);margin:10px 0 0}
.gal{display:flex;align-items:center;gap:14px;text-decoration:none;min-height:64px}
.gal-st{display:flex;flex:none}
.gal-st img{width:58px;height:58px;object-fit:cover;margin-left:-16px;border:3px solid var(--card);border-radius:50%}
.gal-st img:first-child{margin-left:0}
.gal b{font:560 20px/1.2 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;display:block}
.gal small{font-size:14.5px;color:var(--muted)}

/* équipage */
.crew{list-style:none;margin:0;padding:0;display:grid;gap:26px}
.crew li{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.crew-ph{position:relative;width:120px;height:120px}
.crew-ph::before{content:"";position:absolute;inset:-10%;background:radial-gradient(closest-side,rgba(var(--c),.5),rgba(var(--c),.2) 70%,transparent);-webkit-mask:var(--m-r3) center/100% 100%;mask:var(--m-r3) center/100% 100%}
.crew-ph>div{position:absolute;inset:0;overflow:hidden;background:#E8F1F3}
.crew-ph img{width:100%;height:100%;object-fit:cover;display:block}
.crew-ph .boat{position:absolute;left:4%;right:4%;top:50%;transform:translateY(-50%);aspect-ratio:848/360;overflow:hidden}
.crew-ph .boat img{height:auto;object-fit:initial}
.crew h3{font-size:26px}
.crew .who{font:700 22px/1.1 var(--fh);color:var(--rose-ink);margin:2px 0 0}
.crew .role{font-size:15.5px;color:var(--muted);margin:2px 0 0}
.tame{margin:34px auto 0;text-align:center;max-width:560px}

/* genèse */
.gen-mark{position:relative;text-align:center;padding:10px 0}
.gen-mark .kr{font:400 112px/1 'Nanum Brush Script',var(--ft);color:var(--rose-ink);display:block}
.gen-mark .hw{font:700 26px/1 var(--fh);color:var(--sky-ink)}
.gen-ph{width:min(70%,260px);aspect-ratio:1;margin:18px auto 0;position:relative}
.gen-ph img{width:100%;height:100%;object-fit:cover;display:block}
.gen p{margin:14px 0 0}

/* programme */
.hl{list-style:none;padding:0;margin:0 0 30px;display:flex;flex-wrap:wrap;gap:10px}
.hl li{padding:9px 16px;border-radius:999px;font-size:15.5px;background:rgba(var(--c),.22);border:1.4px solid rgba(var(--c),.6)}
.prog{list-style:none;margin:0;padding:0}
.prow{display:block}
.ph{position:relative;padding:0 0 18px 40px}
.ph::after{content:"";position:absolute;left:10px;top:12px;bottom:-12px;border-left:2px dashed rgba(122,86,16,.45)}
.prow:last-child .ph:last-child::after{display:none}
.ph::before{content:"";position:absolute;left:1px;top:3px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 45%),rgb(var(--c));box-shadow:0 0 0 4px var(--paper);z-index:1}
.ph b{display:block;font:560 19px/1.25 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1}
.ph .per{display:block;font:700 20px/1.1 var(--fh);color:var(--rose-ink)}
.ph small{display:block;font-size:15px;color:var(--muted);line-height:1.4;margin-top:2px}

/* lettres */
.form{display:grid;gap:14px}
.fld span{display:block;font:700 20px/1 var(--fh);color:var(--muted);margin:0 0 5px 4px}
.fld input,.fld textarea{width:100%;min-height:50px;font:400 16px/1.4 var(--fb);color:var(--ink);background:#FFFCF4;border:1.6px solid rgba(46,58,75,.42);border-radius:16px 20px 14px 18px;padding:12px 14px}
.fld textarea{min-height:120px;resize:vertical;background:#FFFCF4 repeating-linear-gradient(transparent 0 31px,rgba(143,193,212,.45) 31px 32px);background-position:0 10px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--sky-ink);box-shadow:0 0 0 3px rgba(143,193,212,.45)}
.hint{font-size:15px;color:var(--muted);margin:0}
.opts{display:grid;gap:8px;margin:6px 0 4px;padding:0;border:0}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-size:16.5px}
.opt input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border:1.8px solid var(--ink);border-radius:8px 6px 9px 7px;background:#FFFCF4;display:grid;place-items:center;flex:none;cursor:pointer}
.opt input:checked{background:var(--rose-btn);border-color:var(--rose-btn)}
.opt input:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.letters h3{font-size:clamp(26px,5.4vw,34px);margin-bottom:6px}

/* fin + pied */
.night{background:radial-gradient(60% 80% at 20% 30%,rgba(143,193,212,.22),transparent 70%),radial-gradient(50% 70% at 85% 70%,rgba(201,83,74,.18),transparent 70%),linear-gradient(#2E3A4B,#1F2A3E);color:#F6EFDF;text-align:center;padding:84px 0 76px;margin-top:30px;position:relative;overflow:hidden;-webkit-mask:var(--m-band) center/100% 100% no-repeat;mask:var(--m-band) center/100% 100% no-repeat}
.night svg.sky{position:absolute;inset:0;width:100%;height:100%}
.night blockquote{position:relative;margin:0 auto;max-width:720px;font:italic 400 clamp(24px,5vw,38px)/1.3 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1}
.night cite{display:block;font:600 22px/1.2 var(--fh);font-style:normal;color:rgba(246,239,223,.82);margin-top:12px}
.night .link{color:var(--gold);border-color:rgba(233,180,76,.5);margin-top:26px;font-size:17px;position:relative}
.foot{text-align:center;padding:30px 0 20px;font-size:15px;color:var(--muted)}
.foot b{font:italic 600 22px/1 var(--ft);color:var(--ink);display:block;margin-bottom:6px}
.foot small{display:block;font-size:13px;margin-top:10px;opacity:.9}

/* barre d'onglets (téléphone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:700;display:flex;background:rgba(251,246,234,.97);padding:6px 6px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 24px -18px rgba(46,58,75,.55)}
.tabbar::before{content:"";position:absolute;left:0;right:0;top:-7px;height:8px;background:var(--wavy) repeat-x 0 0/80px 8px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:var(--ink);text-decoration:none;font:600 12.5px/1.1 var(--fb);background:none;border:0;position:relative;cursor:pointer;padding:0}
.tab svg{width:27px;height:27px;position:relative;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on::before{content:"";position:absolute;top:0;left:50%;width:52px;height:38px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(233,180,76,.7),rgba(233,180,76,.25) 70%,transparent);-webkit-mask:var(--m-r1) center/100% 100%;mask:var(--m-r1) center/100% 100%}
.tab.on{color:var(--rose-ink)}

/* menu */
.sheet{position:fixed;inset:0;z-index:860;background:rgba(30,38,52,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex;animation:wgFade .2s}
.sheet-card{width:100%;max-width:460px;background:var(--card);background-image:var(--grain);border-radius:26px 26px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:wgUp .26s cubic-bezier(.2,.8,.2,1);max-height:90dvh;overflow:auto}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet-h h2{font-size:28px;margin-right:auto}
.sheet ul{list-style:none;margin:0 0 14px;padding:0}
.sheet li a{display:flex;align-items:center;gap:14px;min-height:52px;text-decoration:none;font:560 21px/1.2 var(--ft);font-variation-settings:"SOFT" 100,"WONK" 1;border-bottom:1.5px dotted rgba(46,58,75,.25)}
.sheet li a span{width:28px;text-align:center;font-size:20px}
.sheet-f{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.x{width:48px;height:48px;border-radius:50%;border:0;background:rgba(46,58,75,.08);font-size:18px;cursor:pointer;color:var(--ink)}

@media (min-width:600px){
  .figs{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 24px}
  .card{grid-template-columns:1fr;gap:0}
  .card-ph{width:100%;height:auto;aspect-ratio:4/3}
  .card .cap{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 4px 4px}
  .card h3{font-size:22px}
  .crew{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}
  .crew li{grid-template-columns:1fr;text-align:center;justify-items:center}
  .crew-ph{width:180px;height:180px;margin-bottom:6px}
  .aside{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (min-width:760px){
  :root{--gut:32px}
  body{padding-bottom:0}
  .tabbar{display:none}
  .icbtn{display:inline-flex}
  .login span{display:inline}
  .sec{padding:80px 0}
  .row-nav{display:flex}
  .sheet{align-items:flex-start;justify-content:flex-end;padding:76px 28px}
  .sheet-card{border-radius:26px}
  .map{aspect-ratio:auto;height:440px}
  .fox{grid-template-columns:120px 1fr}
  .fox-i{width:120px;height:120px}
  .prow{display:flex;position:relative;padding:0 50px}
  .prow::before{content:"";position:absolute;left:50px;right:50px;top:0;border-top:2px dashed rgba(122,86,16,.45)}
  .prow:first-child::before{left:0}
  .prow:last-child::before{right:0}
  .prow:nth-child(1)::after,.prow:nth-child(2)::after{content:"";position:absolute;top:0;bottom:-2px;width:50px;border:2px dashed rgba(122,86,16,.45)}
  .prow:nth-child(1)::after{right:0;border-left:0;border-radius:0 60px 60px 0}
  .prow:nth-child(2)::after{left:0;border-right:0;border-radius:60px 0 0 60px}
  .prow:nth-child(2){flex-direction:row-reverse}
  .prow .ph{flex:1;padding:28px 10px 34px}
  .prow .ph::after{display:none}
  .prow .ph::before{left:10px;top:-11px}
}
@media (min-width:900px){
  .spread{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background-color:var(--card);background-image:var(--grain);border-radius:12px 12px 16px 16px;position:relative;
    box-shadow:0 2px 0 -1px #EDE3CD,0 3px 0 -1px rgba(46,58,75,.14),0 6px 0 -3px #EDE3CD,0 7px 0 -3px rgba(46,58,75,.12),0 10px 0 -5px #E7DCC3,0 34px 60px -34px rgba(46,58,75,.55)}
  .spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:70px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(122,86,16,.07) 38%,rgba(46,58,75,.2) 50%,rgba(122,86,16,.07) 62%,transparent);pointer-events:none}
  .spread>.page{padding:56px 54px 50px}
  .spread>.page+.page{margin-top:0}
  .spread .folio{position:absolute;bottom:18px;font:600 18px/1 var(--fh);color:var(--muted)}
  .spread .page-l .folio{left:54px}.spread .page-r .folio{right:54px}
  .hero .spread .page-l{display:flex;flex-direction:column;justify-content:center}
  .hero-txt{text-align:left;margin-top:0}
  .hero .ctas{justify-content:flex-start}
  .hero .q{margin-left:0}.hero .q svg{margin:0 0 4px}
  .hero h1{font-size:clamp(40px,4.1vw,54px)}
  .feat .spread .page-l{padding:40px 30px 40px 40px}
  .feat .spread .page-r{padding:48px 48px 44px 40px;display:flex;flex-direction:column;justify-content:center}
  .cbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;align-items:start}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .aside{grid-template-columns:1fr;margin-top:0;position:sticky;top:20px}
  .gen .page-l{display:flex;flex-direction:column;justify-content:center}
  .gen-mark .kr{font-size:150px}
}
@media (min-width:1100px){
  .nav{display:flex;gap:22px;margin-right:18px}
  .icbtn{display:none}
  .cbody{grid-template-columns:minmax(0,1fr) 320px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .wash{opacity:1;transform:none}
  .pl[data-reveal] .pl-o{opacity:1;transform:none;filter:none}
}

.card>div,.cards>*{min-width:0}
.folio{display:none}
@media (min-width:900px){.spread .folio{display:block}}

  // ── Données ──

  const metaLine = (p) => `${esc(WG.date(p.date))} · ${esc(p.author)}`;
  const featHTML = (p) => {

      <div class="page page-l">${ph ? `<div class="feat-ph mrect">${im(ph.url, 1200, WG.cap(ph))}</div>${WG.cap(ph) ? `<p class="cap">${esc(cut(WG.cap(ph), 90))}</p>` : ''}` : `<div class="feat-ph mrect">${paint(0)}</div>`}</div>

    const fc = document.getElementById('f-chap'), fe = document.getElementById('f-et');
    if (!fc) return;
    fc.innerHTML = `<option value="">${t('Tous les chapitres', 'All chapters')}</option>${chapters.map((c) => `<option value="${esc(c.id)}"${c.id === state.chap ? ' selected' : ''}>${esc(WG.chapter(c.id))}</option>`).join('')}`;
    const ets = etapes.filter((e) => !state.chap || e.chapter_id === state.chap);
    if (state.et && !ets.some((e) => e.id === state.et)) state.et = '';
    fe.innerHTML = `<option value="">${t('Toutes les étapes', 'All stages')}</option>${ets.map((e) => `<option value="${esc(e.id)}"${e.id === state.et ? ' selected' : ''}>${esc(WG.etape(e.id))}</option>`).join('')}`;
    const list = filtered();
    const on = state.chap || state.et;
    document.getElementById('fcount').innerHTML = on ? `${nStories(list.length)} ${t('dans cette sélection', 'in this selection')} <button data-reset>${t('Tout afficher', 'Show all')}</button>` : '';
    document.getElementById('feat').innerHTML = list.length ? featHTML(list[0]) : `<div class="empty"><span class="fox-i"><img src="/images/renard-mange.webp" alt="" width="256" height="256"></span><p class="bubble">${t('Le renard a cherché partout : aucun récit public pour cette sélection… pour l’instant.', 'The fox looked everywhere: no public story for this selection… yet.')}</p></div>`;
    document.getElementById('cards').innerHTML = list.slice(1, 7).map(cardHTML).join('');
  };

  const crew = () => `
  <section class="sec" id="equipage">
    <div class="washes">${wash(2, '--s:420px;right:-160px;top:-40px')}${wash(0, '--s:340px;left:-140px;bottom:-60px', 1)}</div>
    <div class="wrap">
      <header class="sh"><span class="kick">${t('Les personnages', 'The characters')}</span><h2 class="h2">${t('L’Équipage', 'The Crew')}</h2></header>
      <ul class="crew">
        <li><span class="crew-ph" style="--c:${COLORS[2]}"><div class="mr1"><img src="/images/photo2.webp" alt="Catherine" loading="lazy" width="800" height="450"></div></span><div><h3>Catherine</h3><p class="who">🌹 ${t('La Rose', 'The Rose')}</p><p class="role">${t('Co-skipper · Navigatrice', 'Co-skipper · Navigator')}</p></div></li>
        <li><span class="crew-ph" style="--c:${COLORS[1]}"><div class="mr2"><img src="/images/photo3.webp" alt="Bertrand" loading="lazy" width="800" height="600"></div></span><div><h3>Bertrand</h3><p class="who">🦊 ${t('Le Renard', 'The Fox')}</p><p class="role">${t('Skipper · Capitaine', 'Skipper · Captain')}</p></div></li>
        <li><span class="crew-ph" style="--c:${COLORS[0]}"><div class="mr3"><span class="boat"><img src="/images/boat.webp" alt="${t('Wang’ap, l’Outremer 52', 'Wang’ap, the Outremer 52')}" loading="lazy" width="848" height="608"></span></div></span><div><h3>Wang’ap</h3><p class="who">⭐ ${t('L’Astéroïde', 'The Asteroid')}</p><p class="role">Outremer 52 · ${t('Catamaran', 'Catamaran')}</p></div></li>
      </ul>
      <blockquote class="q tame">${esc(WG.quote('tame'))}<cite>— ${t('le renard, dans Le Petit Prince', 'the fox, in The Little Prince')}</cite></blockquote>
    </div>
  </section>`;

  const genese = () => `
  <section class="sec gen" id="genese">
    <div class="washes">${wash(1, '--s:440px;left:-160px;top:0')}</div>
    <div class="wrap"><div class="spread">
      <div class="page page-l"><div class="gen-mark"><span class="kr" lang="ko">환갑</span><span class="hw">Hwangap</span></div>
        <div class="gen-ph mr2"><img src="/images/photo1.webp" alt="Catherine &amp; Bertrand" loading="lazy" width="800" height="450"></div><p class="hand planet-cap">Catherine &amp; Bertrand</p><span class="folio">v</span></div>
      <div class="page page-r"><span class="kick">${t('La Genèse', 'Genesis')}</span><h2 class="h2">${t('Une décision, un bateau, quatre ans de préparation', 'One decision, one boat, four years of preparation')}</h2>
        <p>${t('Wang’ap est né d’un mot coréen — 환갑 (Hwangap) — une tradition millénaire célébrant les 60 ans comme le début d’un nouveau cycle. Depuis 2022, Catherine et Bertrand préparent ce tour du monde : formations, construction du bateau, logistique.', 'Wang’ap was born from a Korean word — 환갑 (Hwangap) — an age-old tradition that celebrates turning 60 as the start of a new cycle. Since 2022, Catherine and Bertrand have been preparing this round-the-world voyage: training, building the boat, logistics.')}</p>
        <a class="link" href="#!">${t('Lire la genèse complète →', 'Read the full story →')}</a><span class="folio">vi</span></div>
    </div></div>
  </section>`;

  const programme = () => {
    const OC = [0, 0, 0, 0, 0, 1, 1, 3, 3, 3, 1, 2, 2, 0, 0];
    const rows = [0, 5, 10].map((s) => `<li class="prow">${WG.PHASES.slice(s, s + 5).map((ph, j) => `<div class="ph" style="--c:${COLORS[OC[s + j]]}"><b>${ph.flag} ${esc(ph.place)}</b><span class="per">${esc(ph.period())}</span><small>${esc(ph.desc())}</small></div>`).join('')}</li>`).join('');
    return `
  <section class="sec" id="programme">
    <div class="washes">${wash(0, '--s:480px;right:-180px;top:-60px', 1)}${wash(3, '--s:360px;left:-160px;bottom:0')}</div>
    <div class="wrap">
      <header class="sh"><span class="kick">${t('La route prévue', 'The planned route')}</span><h2 class="h2">${t('Le Programme', 'The Programme')}</h2><p>${t(`~${WG.fmtNm(36000)} nm · 35 étapes · 2026–2029`, `~${WG.fmtNm(36000)} nm · 35 stages · 2026–2029`)}</p></header>
      <ul class="hl"><li style="--c:${COLORS[2]}">${t('Départ Saint-Cyr · sept. 2026', 'Departure from Saint-Cyr · Sept 2026')}</li><li style="--c:${COLORS[0]}">${t('3 océans', '3 oceans')}</li><li style="--c:${COLORS[3]}">${t('Retour Saint-Cyr · été 2029', 'Home to Saint-Cyr · summer 2029')}</li></ul>
      <ol class="prog">${rows}</ol>
      <div class="ctas"><a class="btn btn-p" href="#!">▶ ${t('Voir l’animation', 'Watch the animation')}</a><a class="btn btn-s" href="#!">${t('Voir le programme →', 'See the full programme →')}</a></div>
    </div>
  </section>`;
  };

  const letters = () => `
  <section class="sec letters" id="contact">
    <div class="washes">${wash(2, '--s:420px;left:-170px;top:20px', 1)}${wash(1, '--s:360px;right:-150px;bottom:-40px')}</div>
    <div class="wrap">
      <header class="sh"><span class="kick">${t('Un petit mot pour le bord', 'A note for the boat')}</span><h2 class="h2">${t('Écrire à l’équipage', 'Write to the crew')}</h2></header>
      <div class="spread">
        <div class="page page-l"><h3>${t('Nous envoyer un message', 'Send us a message')}</h3>
          <form class="form">
            <label class="fld"><span>${t('Prénom *', 'First name *')}</span><input name="prenom" required autocomplete="given-name"></label>
            <label class="fld"><span>Email</span><input type="email" name="email" autocomplete="email"></label>
            <label class="fld"><span>${t('Téléphone (WhatsApp)', 'Phone (WhatsApp)')}</span><input type="tel" name="tel" autocomplete="tel"></label>
            <label class="fld"><span>Message</span><textarea name="message" rows="4"></textarea></label>
            <p class="hint">${t('Indiquez un email ou un téléphone pour que nous puissions vous répondre.', 'Leave an email or a phone number so we can reply.')}</p>
            <div><button class="btn btn-p" type="submit">${t('Envoyer', 'Send')} ✉️</button></div>
          </form><span class="folio">vii</span></div>
        <div class="page page-r"><h3>${t('Suivre le voyage par email', 'Follow the voyage by email')}</h3>
          <form class="form">
            <fieldset class="opts">
              <label class="opt"><input type="checkbox" checked> 📰 ${t('La newsletter', 'The newsletter')}</label>
              <label class="opt"><input type="checkbox" checked> 📝 ${t('Les nouvelles publications', 'New posts')}</label>
              <label class="opt"><input type="checkbox"> 🧭 ${t('Les nouvelles étapes', 'New stages')}</label>
            </fieldset>
            <label class="fld"><span>Email</span><input type="email" name="nl-email" autocomplete="email"></label>
            <div><button class="btn btn-p" type="submit">${t('S’inscrire', 'Subscribe')}</button></div>
          </form><span class="folio">viii</span></div>
      </div>
    </div>
  </section>`;

  const closing = () => {
    let s = ''; const P = [[6, 20, 1], [14, 62, .6], [24, 30, .8], [33, 78, .5], [46, 16, .6], [58, 70, 1], [68, 28, .5], [79, 58, .8], [88, 22, .6], [94, 74, .5], [40, 86, .4], [72, 88, .4]];
    P.forEach(([x, y, k]) => { s += star(x * 10, y * 4, k, '#E9B44C'); });
    return `
  <section class="night" id="fin">
    <svg class="sky" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s}</svg>
    <div class="wrap"><blockquote>${esc(WG.quote('stars'))}<cite>— ${t('Le Petit Prince', 'The Little Prince')}</cite></blockquote>
    <a class="link" href="#!">${t('Espace skippers →', 'Skippers’ area →')}</a></div>
  </section>
  <footer class="foot"><div class="wrap"><b>wang'ap</b>Wang'ap · Outremer 52 · 2026–2029<small>${t('Démo de design — contenus réels, liens inactifs', 'Design demo — real content, inactive links')}</small></div></footer>`;
  };

  const chrome = () => `
  <nav class="tabbar" aria-label="${t('Navigation', 'Navigation')}">
    <a class="tab" href="#histoire" data-t="histoire">${ic('book', '')}<span>${t('Histoire', 'Story')}</span></a>
    <a class="tab" href="#ou" data-t="carte">${ic('map', '')}<span>${t('Carte', 'Map')}</span></a>
    <a class="tab" href="#carnet" data-t="journal">${ic('journal', '')}<span>Journal</span></a>
    <a class="tab" href="#calendrier" data-t="cal">${ic('cal', '')}<span>${t('Calendrier', 'Calendar')}</span></a>
    <button class="tab" data-menu>${ic('menu', '')}<span>Menu</span></button>
  </nav>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Menu"><div class="sheet-card">
    <div class="sheet-h"><h2>${t('Sommaire', 'Contents')}</h2><button class="x" data-close aria-label="${t('Fermer', 'Close')}">✕</button></div>
    <ul>${WG.NAV().map((n) => `<li><a href="#!"><span aria-hidden="true">${n.icon}</span>${esc(n.label)}</a></li>`).join('')}</ul>
    <div class="sheet-f"><div class="lang" role="group" aria-label="${t('Langue', 'Language')}"><button data-lang="fr" aria-pressed="${WG.lang === 'fr'}">FR</button><button data-lang="en" aria-pressed="${WG.lang === 'en'}">EN</button></div><a class="btn btn-s" href="#!">${ic('user')}${t('Connexion', 'Sign in')}</a></div>
  </div></div>`;

  // ── Rendu ──
  let rowRAF;
  const render = () => {
    const y = window.scrollY;
    app.innerHTML = header() + '<main>' + hero() + where() + escales() + tocSillage() + carnet() + crew() + genese() + programme() + letters() + '</main>' + closing() + chrome();
    renderList();
    WG.reveal();
    const mapEl = document.getElementById('map');
    requestAnimationFrame(() => {
      WG.staticMap(mapEl, { tiles: 'physical', maxZoom: 8, pad: 30, filter: 'sepia(.22) saturate(.9) brightness(1.04)', line: { color: '#B2423A', width: 3, glow: '#FBF6EA', draw: true }, boat: { html: '<span class="boat-mk"></span>' } });
    });
    const row = document.getElementById('row');
    const par = () => {
      const r = row.getBoundingClientRect(); const cx = r.left + r.width / 2;
      row.querySelectorAll('.pl-ph img').forEach((img) => { const b = img.parentNode.getBoundingClientRect(); const off = ((b.left + b.width / 2) - cx) / r.width; img.style.setProperty('--px', `${(-off * 12).toFixed(1)}px`); });
    };
    if (!RM) { row.addEventListener('scroll', () => { cancelAnimationFrame(rowRAF); rowRAF = requestAnimationFrame(par); }, { passive: true }); par(); }
    spy();
    window.scrollTo(0, y);
  };

  // L'onglet actif suit la section à l'écran.
  let io;
  const spy = () => {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver((ents) => ents.forEach((en) => {
      if (!en.isIntersecting) return;
      const k = en.target.getAttribute('data-tab');
      document.querySelectorAll('.tab[data-t]').forEach((a) => { a.classList.toggle('on', a.dataset.t === k); if (a.dataset.t === k) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    }), { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('[data-tab]').forEach((s) => io.observe(s));
  };

  const sheet = (on) => { const s = document.getElementById('sheet'); s.classList.toggle('on', on); document.body.style.overflow = on ? 'hidden' : ''; if (on) s.querySelector('.x').focus(); };
  document.addEventListener('click', (e) => {
    const l = e.target.closest('[data-lang]'); if (l) { if (l.dataset.lang !== WG.lang) WG.setLang(l.dataset.lang); return; }
    if (e.target.closest('[data-menu]')) { sheet(true); return; }
    const sh = document.getElementById('sheet');
    if (sh && sh.classList.contains('on') && (e.target === sh || e.target.closest('[data-close]'))) { sheet(false); return; }
    const c = e.target.closest('[data-chap]');
    if (c) { state.chap = c.dataset.chap; state.et = ''; renderList(); document.getElementById('carnet').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); return; }
    if (e.target.closest('[data-reset]')) { state.chap = ''; state.et = ''; renderList(); return; }
    const s = e.target.closest('[data-scroll]');
    if (s) { document.getElementById('row').scrollBy({ left: Number(s.dataset.scroll) * 330, behavior: RM ? 'auto' : 'smooth' }); }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'f-chap') { state.chap = e.target.value; renderList(); }
    if (e.target.id === 'f-et') { state.et = e.target.value; renderList(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { const sh = document.getElementById('sheet'); if (sh?.classList.contains('on')) sheet(false); }
    const a = e.target.closest?.('article[data-post]');
    if (a && e.target === a && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const p = D.posts.find((x) => x.id === a.dataset.post); if (p) WG.openPost(p); }
  });
  window.addEventListener('wg:lang', render);
  WG.inert();
  render();
})();
</script>
<script src="survey.js"></script>
</body>
</html>
