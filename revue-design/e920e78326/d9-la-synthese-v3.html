/* Design 9 — « La Synthèse v3 » (12 nov.). d8 a reçu 5/5 de Catherine et de Bertrand ; on
   garde tout ce qu'ils ont aimé (les couleurs, la lisibilité, le journal à une photo, les cartes
   postales, la galerie, le sommaire) et on corrige, point par point, leurs remarques :
   - l'accueil : la photo de Wang'ap EN GRAND et nette (plus de bord estompé), choisie par
     Bertrand parmi six (« Choisir la photo », le choix part avec son avis) ; le logo en grand
     et « wang'ap » dans sa police (Georgia 800, comme l'en-tête de l'application) ; des
     caractères plus petits ;
   - le Petit Prince revient, sans enfantillage : le logo, et une phrase du livre en exergue
     de chaque section ;
   - les cartes : la mappemonde (World Physical : la mer en bleu, les méridiens, les tropiques,
     une rose des vents) et une vraie carte de géographe pour la route parcourue (NatGeo) ;
     la route simplifiée et lissée, qui se dessine quand on arrive dessus ;
   - la galerie : Photos | Vidéos, et les vidéos se regardent sur place ;
   - le lecteur : chaque photo ENTIÈRE, une à la fois, numérotée, avec des flèches ;
   - les fonds : fini le vert pâle, le rose et le lavande — bleu Outremer, lie-de-vin, ivoire ;
   - des animations qui se jouent quand on arrive dessus (Catherine ne les avait pas vues).
   Données : data-d9.js — un nouvel instantané public (56 récits, la route jusqu'à l'Atlantique,
   les vidéos), délai public appliqué. Règle 8 : seulement les chapitres et étapes commencés,
   jamais de « prochaine étape », pas de date de fin pour l'escale encore ouverte. */
:root{
  --cream:#FBF6EA;--navy:#14284B;--ink:#1D2B44;--muted:#525D6F;--gold:#E8B059;
  --c-home:#D9962B;--c-map:#1F6F8B;--c-jnl:#2C5282;--c-gal:#0E7C7B;--c-esc:#C0503A;--c-prg:#A8730F;--c-crw:#1D5C96;--c-gen:#8C2F45;--c-ctc:#14284B;
  --ch0:#4F7A3F;--ch1:#1F6F8B;--ch2:#C0503A;--ch3:#A8730F;--ch4:#5E4687;
  --o-med:#1F6F8B;--o-atl:#0E7C7B;--o-pac:#24406E;--o-ind:#A8730F;--o-ret:#C0503A;
  --fw:Georgia,"Times New Roman",serif;
  --fs:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --top-bg:#FBF6EA;--top-ink:#14284B;--top-mut:#5A6475;
  --card:#FFFFFF;--card-ink:#1D2B44;--card-mut:#5A6475;--hair:rgba(29,43,68,.13);--hair-2:rgba(29,43,68,.28);
  --shadow:0 1px 2px rgba(20,40,75,.07),0 16px 32px -18px rgba(20,40,75,.42);
  --gut:16px;
  --rd-bg:#FFFFFF;--rd-ink:#1D2B44;--rd-muted:#5A6475;--rd-accent:#B0432F;--rd-title:#14284B;
  --rd-title-font:Georgia,"Times New Roman",serif;--rd-body-font:Georgia,"Times New Roman",serif;--rd-radius:20px;
}
[data-theme="night"]{
  --top-bg:#0D1830;--top-ink:#F3EBDA;--top-mut:#A9B2C2;--muted:#A9B2C2;
  --card:#18233A;--card-ink:#EFE8D8;--card-mut:#A9B2C2;--hair:rgba(239,232,216,.14);--hair-2:rgba(239,232,216,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 34px -18px rgba(0,0,0,.75);
  --ch0:#8CBF77;--ch1:#5FB0CC;--ch2:#EE8E76;--ch3:#E2B04F;--ch4:#B49BE0;
  --o-med:#5FB0CC;--o-atl:#45C2BE;--o-pac:#8DB2EA;--o-ind:#E2B04F;--o-ret:#EE8E76;
  --c-home:#E8B059;--c-map:#4FA3C0;--c-jnl:#7BA3E0;--c-gal:#3FB8B5;--c-esc:#E5876F;--c-prg:#E2B04F;--c-crw:#7FB2E5;--c-gen:#E58A9E;--c-ctc:#E8B059;
  --rd-bg:#18233A;--rd-ink:#EFE8D8;--rd-muted:#A9B2C2;--rd-accent:#F0C474;--rd-title:#F6EFDF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background:var(--top-bg);color:var(--ink);font:400 17px/1.6 var(--fw);overflow-x:hidden;overflow-x:clip;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--c-map);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--fw);font-weight:700;letter-spacing:.02em;line-height:1.12;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--gut)}
/* une seule colonne qui ne déborde jamais ; les grilles en ajoutent plus bas */
.hero-in,.near-g,.jgrid,.jlist,.jcards,.crew,.gen,.forms,.oc{grid-template-columns:minmax(0,1fr)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mr2{-webkit-mask:var(--m-r2) center/100% 100% no-repeat;mask:var(--m-r2) center/100% 100% no-repeat}
.mrect{-webkit-mask:var(--m-rect) center/100% 100% no-repeat;mask:var(--m-rect) center/100% 100% no-repeat}

/* ── les bandes : une couleur par section, une vague pour les séparer ── */
.band{position:relative;background:var(--bg);color:var(--fg);padding:60px 0 70px}
.band::before{content:"";position:absolute;left:0;right:0;top:-15px;height:16px;background:var(--bg);-webkit-mask:var(--wave) repeat-x 0 0/150px 16px;mask:var(--wave) repeat-x 0 0/150px 16px;pointer-events:none}
.b-home{--bg:#14284B;--fg:#F6EFE0;--mut:rgba(246,239,224,.8);--acc:#E8B059;--on-acc:#14284B}
.b-num{--bg:#E8B059;--fg:#14284B;--mut:#4F3D0E;--acc:#14284B;--on-acc:#F6EFE0}
.b-map{--bg:#D3E7EE;--fg:#10283A;--mut:#3D5566;--acc:#1F6F8B;--on-acc:#FFFFFF}
.b-jnl{--bg:#F6EBDA;--fg:#1D2B44;--mut:#535E70;--acc:#2C5282;--on-acc:#FFFFFF}
.b-gal{--bg:#0E3A42;--fg:#EEF5F2;--mut:rgba(238,245,242,.8);--acc:#E8B059;--on-acc:#0E3A42}
.b-esc{--bg:#BF4F39;--fg:#FFF8EF;--mut:rgba(255,248,239,.88);--acc:#FFF3DA;--on-acc:#9A3826}
.b-prg{--bg:#F2E2BF;--fg:#2A2414;--mut:#5C5135;--acc:#8F620F;--on-acc:#FFFFFF}
.b-crw{--bg:#1B4572;--fg:#F4EFE3;--mut:rgba(244,239,227,.84);--acc:#E8B059;--on-acc:#14284B}
.b-gen{--bg:#6B2333;--fg:#F8EDE6;--mut:rgba(248,237,230,.84);--acc:#E8B059;--on-acc:#4A1622}
.b-ctc{--bg:#F7EFDD;--fg:#14284B;--mut:#4F5A6B;--acc:#14284B;--on-acc:#F7EFDD}
.b-end{--bg:#0B1730;--fg:#F3EBDA;--mut:rgba(243,235,218,.8);--acc:#E8B059;--on-acc:#0B1730}
[data-theme="night"] .b-home{--bg:#0A1630}
[data-theme="night"] .b-num{--bg:#3A2C10;--fg:#F2C979;--mut:rgba(242,201,121,.78);--acc:#F2C979;--on-acc:#3A2C10}
[data-theme="night"] .b-map{--bg:#0E2A36;--fg:#E3EEF2;--mut:#A3BCC7;--acc:#5FB0CC;--on-acc:#0E2A36}
[data-theme="night"] .b-jnl{--bg:#111A2C;--fg:#EFE8D8;--mut:#A9B2C2;--acc:#8DB2EA;--on-acc:#111A2C}
[data-theme="night"] .b-gal{--bg:#061F24}
[data-theme="night"] .b-esc{--bg:#4A1F17;--acc:#F3C9A8;--on-acc:#4A1F17}
[data-theme="night"] .b-prg{--bg:#2A2214;--fg:#F2E6CB;--mut:#C2B391;--acc:#E8B059;--on-acc:#2A2214}
[data-theme="night"] .b-crw{--bg:#0F2944}
[data-theme="night"] .b-gen{--bg:#36121B}
[data-theme="night"] .b-ctc{--bg:#1C1A16;--fg:#F2E9D6;--mut:#BDB29C;--acc:#E8B059;--on-acc:#1C1A16}
[data-theme="night"] .b-end{--bg:#050B18}

/* ── titres de section : une icône, un titre, une phrase ── */
.sh{display:flex;gap:14px;align-items:flex-start;margin:0 0 28px;max-width:780px}
.sh-i{flex:none;width:52px;height:52px;border-radius:16px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 8px 18px -10px rgba(0,0,0,.55);margin-top:2px}
.sh-i svg{width:28px;height:28px}
.sh h2{font-size:clamp(29px,5.8vw,44px);color:var(--fg)}
.sh p{margin:8px 0 0;font:400 17px/1.45 var(--fs);color:var(--mut)}
/* le Petit Prince en exergue (Catherine : « il n'y a plus vraiment de référence au Petit Prince ») */
.epi{margin:-12px 0 30px;max-width:640px;padding-left:16px;border-left:2px solid var(--acc);font:italic 400 17px/1.5 var(--fw);color:var(--fg)}
.epi cite{display:block;margin-top:4px;font:600 13px/1.3 var(--fs);font-style:normal;letter-spacing:.04em;color:var(--mut)}
.b-num .epi{margin:0 0 24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 22px;border-radius:999px;font:700 16px/1.15 var(--fs);text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--acc);color:var(--on-acc)}
.btn-s{background:transparent;color:var(--fg);border-color:currentColor}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.ctas.c{justify-content:center}

/* ── en-tête ── */
.top{background:var(--top-bg);color:var(--top-ink);position:relative;z-index:40}
.top-in{display:flex;align-items:center;gap:10px;min-height:64px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--top-ink);margin-right:auto;min-height:48px;min-width:0}
.brand .lg{width:46px;height:46px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.14);flex:none}
.brand .lg img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font:800 25px/1 var(--fw);letter-spacing:.05em;white-space:nowrap}
.brand small{display:none;font:500 13px/1.25 var(--fs);color:var(--top-mut);border-left:1px solid var(--hair-2);padding-left:11px;margin-left:2px}
.seg{display:inline-flex;border:1.5px solid var(--hair-2);border-radius:999px;padding:2px;background:var(--top-bg)}
.seg button{min-width:44px;min-height:40px;border:0;background:none;border-radius:999px;font:700 14px/1 var(--fs);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;color:var(--top-ink)}
.seg button svg{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--top-ink);color:var(--top-bg)}
.top .theme{display:none}
.login{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;justify-content:center;padding:0 12px;border-radius:999px;border:1.5px solid var(--hair-2);text-decoration:none;color:var(--top-ink);font:700 14.5px/1 var(--fs)}
.login span{display:none}

/* barre des sections (iPad, ordinateur) */
.navbar{display:none}
.nv-i{width:28px;height:28px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.nv-i svg{width:17px;height:17px}
[data-theme="night"] .nv-i,[data-theme="night"] .som-i,[data-theme="night"] .tab.on .ti{color:#0D1830}

/* barre d'onglets (téléphone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:700;display:flex;background:var(--top-bg);border-top:1px solid var(--hair);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 24px -18px rgba(0,0,0,.5)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;color:var(--top-ink);text-decoration:none;font:700 11.5px/1.1 var(--fs);background:none;border:0;position:relative;cursor:pointer;padding:0;min-width:0}
.tab+.tab::before{content:"";position:absolute;left:0;top:12px;bottom:12px;border-left:1px solid var(--hair)}
.tab .ti{width:40px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--c);transition:background .2s,color .2s}
.tab .ti svg{width:23px;height:23px}
.tab.on .ti{background:var(--c);color:#fff}
.tab.menu .ti{background:var(--top-ink);color:var(--top-bg)}

/* le sommaire */
.sheet{position:fixed;inset:0;z-index:920;background:rgba(8,14,28,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex;animation:wgFade .2s}
.sheet-card{width:100%;max-width:480px;background:var(--top-bg);color:var(--top-ink);border-radius:24px 24px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:wgUp .26s cubic-bezier(.2,.8,.2,1);max-height:92dvh;overflow:auto;overscroll-behavior:contain}
.sheet-h{display:flex;align-items:center;gap:10px;padding:4px 0 12px;border-bottom:2px solid var(--top-ink)}
.sheet-h h2{font-size:30px;margin-right:auto}
.x{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--hair-2);background:none;font:700 14px/1 var(--fs);cursor:pointer;color:var(--top-ink)}
.x svg{width:18px;height:18px}
.som{list-style:none;margin:0;padding:0}
.som li+li{border-top:1px solid var(--hair)}
.som a{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 2px;text-decoration:none;color:var(--top-ink)}
.som-i{flex:none;width:42px;height:42px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center}
.som-i svg{width:22px;height:22px}
.som b{display:block;font:700 19px/1.2 var(--fw);letter-spacing:.02em}
.som small{display:block;font:400 14px/1.3 var(--fs);color:var(--top-mut);margin-top:2px}
.som .arr{margin-left:auto;color:var(--c);display:grid}
.sheet-f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:14px;border-top:2px solid var(--top-ink);margin-top:4px}

/* ── accueil (d9) : la photo en grand et nette ; le logo et « wang'ap » dans sa police ── */
.hero{padding:0 0 64px}
.hero::before{display:none}
.hero-ph{position:relative;height:clamp(330px,62vh,700px);overflow:hidden;background:#0A1630}
.hero-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--hp,50% 55%);display:block;transition:opacity .7s}
.hero-ph img.kb{animation:kb 24s ease-out both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.hero-ph::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:16px;background:var(--bg);-webkit-mask:var(--wave) repeat-x 0 0/150px 16px;mask:var(--wave) repeat-x 0 0/150px 16px;z-index:1}
.hero-cap{position:absolute;left:var(--gut);bottom:var(--hb,78px);z-index:2;max-width:52%;margin:0;font:italic 400 15px/1.3 var(--fw);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65),0 0 14px rgba(0,0,0,.4)}
.hero-pick{position:absolute;right:var(--gut);bottom:calc(var(--hb,78px) - 8px);z-index:2;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,255,255,.94);color:#14284B;font:700 14px/1 var(--fs);cursor:pointer;box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.hero-pick svg{width:18px;height:18px}
.picks{display:none;gap:12px;overflow-x:auto;scrollbar-width:none;padding:16px var(--gut) 6px;max-width:1180px;margin:0 auto;position:relative;z-index:4}
.picks::-webkit-scrollbar{display:none}
.picks.on{display:flex}
.pk{flex:0 0 auto;width:118px;border:0;padding:0;background:none;color:var(--mut);font:600 12.5px/1.25 var(--fs);text-align:left;cursor:pointer}
.pk img{display:block;width:118px;height:80px;object-fit:cover;border-radius:12px;border:3px solid transparent;margin-bottom:6px}
.pk[aria-pressed="true"]{color:var(--fg)}
.pk[aria-pressed="true"] img{border-color:var(--acc)}
.picks-n{flex:0 0 220px;margin:0;align-self:center;font:500 13.5px/1.4 var(--fs);color:var(--mut)}
.hero-in{position:relative;display:grid;gap:16px}
.hero-id{display:flex;align-items:flex-end;gap:16px;margin-top:-58px;position:relative;z-index:3;pointer-events:none}
.picks.on+.hero-in .hero-id{margin-top:6px}
.hero-logo{flex:none;width:112px;height:112px;border-radius:28px;background:#fff;overflow:hidden;box-shadow:0 14px 30px -12px rgba(0,0,0,.7),0 0 0 5px rgba(232,176,89,.6)}
.hero-logo img{display:block;width:100%;height:100%;object-fit:cover}
.wordmark{margin:0 0 6px;font:800 clamp(40px,9.5vw,64px)/1 var(--fw);letter-spacing:.05em;color:var(--fg)}
.eyebrow{font:700 13px/1.3 var(--fs);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--acc);flex:none}
.lead{margin:14px 0 0;font:400 clamp(19px,2.4vw,22px)/1.45 var(--fw);color:var(--fg);max-width:620px}
.lead em{font-style:italic;color:var(--acc)}
.sub{margin:8px 0 0;font:500 16px/1.4 var(--fs);color:var(--mut)}
.q{margin:0;padding-left:16px;border-left:3px solid var(--acc);font:italic 400 17.5px/1.5 var(--fw);color:var(--fg);max-width:520px}
.q cite{display:block;font:500 14px/1.3 var(--fs);font-style:normal;color:var(--mut);margin-top:6px}
.chap{margin:16px 0 0;font:500 14.5px/1.35 var(--fs);color:var(--mut)}
.chap b{color:var(--fg);font-weight:700}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 4s ease-in-out infinite}
.tw:nth-of-type(2n){animation-delay:-2s;animation-duration:5.5s}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* ── les chiffres ── */
.b-num{padding:40px 0 46px}
.nums{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}
.nums li{border-left:3px solid var(--fg);padding-left:12px}
.nums b{display:block;font:700 clamp(36px,8vw,54px)/1 var(--fw);letter-spacing:.01em}
.nums span{display:block;font:600 15px/1.3 var(--fs);color:var(--mut);margin-top:6px}
.nums-n{margin:24px 0 0;font:500 14px/1.45 var(--fs);color:var(--mut);display:flex;gap:8px;align-items:flex-start}
.nums-n svg{width:18px;height:18px;margin-top:1px}

/* ── la carte ── */
.wm-card,.near-card,.pos-card,.box,.art,.ph,.duo,.boat,.form-card{background:var(--card);color:var(--card-ink);border-radius:22px;box-shadow:var(--shadow)}
.wm-card{margin:0;overflow:hidden}
.wm-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding:14px 18px}
.wm-h b{font:700 20px/1.2 var(--fw);letter-spacing:.02em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:600 14px/1.2 var(--fs);color:var(--card-mut)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:26px;height:0;border-top:4px solid var(--trk);border-radius:2px}
.legend i.d{border-top:4px dotted var(--rte)}
.legend i.p{width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--rte)}
.wm-card,.near-card{--trk:#C0503A;--rte:#1D3A66}
[data-theme="night"] .wm-card,[data-theme="night"] .near-card{--trk:#FF8C6E;--rte:#F2C979}
.wm-scroll{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.wm-scroll::-webkit-scrollbar{display:none}
.wm{position:relative;overflow:hidden;background:#9EC3E0}
.wm-t{position:absolute;inset:0}
.wm-t img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none}
.wm svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.wl{position:absolute;white-space:nowrap;font:700 12.5px/1 var(--fs);color:#10233F;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 6px rgba(255,255,255,.9),0 0 10px rgba(255,255,255,.7);pointer-events:none}
.wl .f{font-size:14px;margin-right:4px;text-shadow:none}
.wl.eq{font:italic 400 12px/1 var(--fw);color:#1F3F66;letter-spacing:.06em}
[data-theme="night"] .wl{color:#F3EBDA;text-shadow:0 0 2px #0B1730,0 0 4px #0B1730,0 0 8px rgba(11,23,48,.9)}
[data-theme="night"] .wl.eq{color:#A3BCC7}
[data-theme="night"] .wm-t,[data-theme="night"] .nm-t{filter:brightness(.58) saturate(.8) contrast(1.12) hue-rotate(-6deg)}
.wm-f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 12px 18px;font:600 14px/1.3 var(--fs);color:var(--card-mut);border-top:1px solid var(--hair)}
.wm-f .hint{display:inline-flex;align-items:center;gap:8px}
.arrows{display:flex;gap:8px;flex:none}
.arrows button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--hair-2);background:var(--card);color:var(--card-ink);display:grid;place-items:center;cursor:pointer}
.wm-card.fit .arrows,.wm-card.fit .hint-sw{display:none}
.near-g{display:grid;gap:18px;margin-top:22px}
.near-card{margin:0;overflow:hidden;display:flex;flex-direction:column}
.near{position:relative;height:320px;overflow:hidden;background:#A4C8E8}
.nm-t{position:absolute;inset:0;overflow:hidden}
.nm-t img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none}
.near svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.pill{position:absolute;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:5px 9px;border-radius:999px;background:rgba(255,252,245,.95);color:#14284B;font:700 12.5px/1 var(--fs);box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
[data-theme="night"] .pill{background:rgba(13,24,48,.92);color:#F3EBDA}
.trk-d{stroke-dasharray:1 2;stroke-dashoffset:1}
.go .trk-d{animation:draw 3.2s cubic-bezier(.35,.1,.25,1) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center}
.go .pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{to{opacity:1;transform:none}}
.fadein{opacity:0;transition:opacity 1.2s ease .5s}
.go .fadein{opacity:1}
.near-card figcaption{padding:12px 18px;font:600 14.5px/1.3 var(--fs);color:var(--card-mut);border-top:1px solid var(--hair)}
.boat-mk{display:block;width:18px;height:18px;border-radius:50%;background:var(--trk);border:3px solid #fff;box-shadow:0 0 0 6px rgba(232,176,89,.5),0 2px 6px rgba(0,0,0,.3);animation:beat 2.4s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(232,176,89,.8),0 2px 6px rgba(0,0,0,.3)}70%{box-shadow:0 0 0 16px rgba(232,176,89,0),0 2px 6px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 0 rgba(232,176,89,0),0 2px 6px rgba(0,0,0,.3)}}
.pos-card{padding:22px}
.pos-card h3{font-size:22px}
.coord{font:700 22px/1.3 var(--fw);letter-spacing:.03em;margin:10px 0 0;color:var(--c-map)}
.when{margin:2px 0 0;font:500 15px/1.4 var(--fs);color:var(--card-mut)}
.when::first-letter{text-transform:uppercase}
.delay{display:flex;gap:10px;margin:16px 0 0;padding:12px 14px;border-radius:14px;background:rgba(31,111,139,.1);font:500 15px/1.45 var(--fs)}
.delay svg{width:20px;height:20px;color:var(--c-map);margin-top:1px}
.delay em{display:block;font:italic 400 15px/1.45 var(--fw);color:var(--card-mut);margin-top:4px}
.pos-card .ctas{margin-top:18px}
.pos-card .btn-s{color:var(--card-ink)}
.cockpit{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 16px;text-decoration:none;border-radius:16px;border:1.5px solid var(--hair-2)}
.cockpit b{display:block;font:700 15.5px/1.3 var(--fs)}
.cockpit small{display:block;font:400 14px/1.35 var(--fs);color:var(--card-mut);margin-top:2px}
.cockpit>svg:first-child{color:var(--c-map);width:28px;height:28px}
.cockpit>svg:last-child{margin-left:auto;color:var(--c-map)}

/* ── le journal ── */
.filters{margin:0 0 26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--hair-2);background:var(--card);color:var(--card-ink);font:600 14.5px/1.2 var(--fs);cursor:pointer;text-align:left}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--cc);flex:none}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fl-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px}
.sel{display:flex;align-items:center;gap:10px;font:600 14.5px/1 var(--fs);color:var(--mut)}
.sel select{min-height:46px;-webkit-appearance:none;appearance:none;padding:0 40px 0 14px;border-radius:12px;border:1.5px solid var(--hair-2);background:var(--card) var(--chev) right 14px center/14px no-repeat;font:500 15px/1.2 var(--fs);color:var(--card-ink);max-width:min(78vw,360px)}
.fcount{font:500 14.5px/1.3 var(--fs);color:var(--mut);margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fcount button{background:none;border:0;color:var(--acc);font:700 14.5px var(--fs);min-height:44px;cursor:pointer;text-decoration:underline;padding:0}
.jgrid{display:grid;gap:28px}
.jlist,.jcards{display:grid;gap:24px}
.art{position:relative;overflow:hidden;cursor:pointer;border-top:7px solid var(--cc);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;min-width:0}
.art:hover{transform:translateY(-3px)}
.art-ph{position:relative;aspect-ratio:3/2;margin:12px 12px 0}
.art-ph .pm{position:absolute;inset:0;background:#E2D6BC}
.art-ph img,.art-ph video{width:100%;height:100%;object-fit:cover;display:block}
.art-n{position:absolute;right:10px;bottom:10px;z-index:1;display:inline-flex;align-items:center;gap:6px;background:rgba(14,26,48,.84);color:#fff;font:700 12.5px/1 var(--fs);padding:7px 10px;border-radius:999px}
.art-n svg{width:15px;height:15px}
.art-b{padding:14px 18px 16px;display:flex;flex-direction:column;flex:1;min-width:0}
.art-m{margin:0;font:600 13.5px/1.35 var(--fs);color:var(--card-mut);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.art-m .ch{color:var(--cc);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:800}
.art h3{font-size:21px;line-height:1.22;margin:8px 0 0}
.art-x{margin:8px 0 0;font:400 16px/1.55 var(--fw)}
.art-f{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--hair-2);font:600 14px/1.3 var(--fs);color:var(--card-mut)}
.art-f>span:first-child{display:inline-flex;align-items:center;gap:6px;min-width:0}
.art-f>span:first-child svg{width:16px;height:16px;color:var(--cc)}
.art-f .more{margin-left:auto;white-space:nowrap;color:var(--c-jnl);display:inline-flex;align-items:center;gap:6px}
.art-f .more svg{width:17px;height:17px}
.art-x+.art-f{margin-top:14px}
.art.feat h3{font-size:clamp(25px,4.4vw,30px)}
.art.feat .art-x{font-size:17px}
.art .lbl{position:absolute;left:24px;top:24px;z-index:1;background:var(--cc);color:#fff;font:800 12px/1 var(--fs);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px}
.jside{display:grid;gap:18px;align-content:start}
.box{padding:18px}
.box h3{font-size:21px}
.box p{margin:6px 0 0;font:400 15px/1.45 var(--fs);color:var(--card-mut)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:10px;text-align:center}
.cal i{font:700 12px/1 var(--fs);font-style:normal;color:var(--card-mut);padding:6px 0}
.cal span,.cal button{display:grid;place-items:center;height:38px;font:500 14.5px/1 var(--fs);border-radius:50%;border:0;background:none;padding:0;color:var(--card-ink)}
.cal button{font-weight:800;cursor:pointer;background:var(--gold);color:#14284B}
.gal-sc{display:flex;align-items:center;gap:14px;text-decoration:none;min-height:64px}
.gal-st{display:flex;flex:none}
.gal-st img{width:54px;height:54px;object-fit:cover;margin-left:-14px;border:3px solid var(--card);border-radius:50%}
.gal-st img:first-child{margin-left:0}
.gal-sc b{display:block;font:700 19px/1.2 var(--fw)}
.gal-sc small{display:block;font:400 14px/1.35 var(--fs);color:var(--card-mut)}
.gal-sc>svg{margin-left:auto;color:var(--c-gal)}

/* ── la galerie ── */
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:150px;gap:8px;grid-auto-flow:dense}
.gt{position:relative;overflow:hidden;border-radius:14px;border:0;padding:0;cursor:pointer;background:#1A4A52;display:block;min-width:0}
.gt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.gt:hover img{transform:scale(1.05)}
.gt.big{grid-column:span 2;grid-row:span 2}
.gt.wide{grid-column:span 2}
.gt span{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 9px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font:600 13px/1.3 var(--fs);text-align:left;opacity:0;transition:opacity .25s}
.gt:hover span,.gt:focus-visible span,.gt.big span{opacity:1}
.gal-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:22px;font:500 15px/1.4 var(--fs);color:var(--mut)}
/* d9 : la galerie en deux — les photos, les vidéos (Bertrand) */
.gtabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;border:1.5px solid rgba(238,245,242,.3);margin:0 0 20px}
.gtabs button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:none;color:var(--fg);font:700 15px/1 var(--fs);cursor:pointer}
.gtabs button svg{width:18px;height:18px}
.gtabs button small{font:700 12.5px/1 var(--fs);opacity:.8}
.gtabs button[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vt{position:relative;display:block;aspect-ratio:4/3;border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;background:#123F47;min-width:0}
.vt img{width:100%;height:100%;object-fit:cover;display:block}
.vt .pl{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.93);color:#0E3A42;display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(0,0,0,.6);transition:transform .2s}
.vt .pl svg{width:24px;height:24px;margin-left:3px;fill:currentColor}
.vt:hover .pl{transform:translate(-50%,-50%) scale(1.08)}
.vt .vc{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font:600 12.5px/1.3 var(--fs);text-align:left}
.vt .vc>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vbox{position:fixed;inset:0;z-index:960;background:rgba(5,10,20,.9);display:flex;align-items:center;justify-content:center;padding:16px;animation:wgFade .2s}
.vbox-in{width:min(960px,100%);color:#F3EBDA}
.vbox video{display:block;width:100%;max-height:72dvh;background:#000;border-radius:14px}
.vbox-h{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:12px;font:600 14.5px/1.35 var(--fs)}
.vbox-h b{font:700 19px/1.25 var(--fw);margin-right:auto;flex:1 1 220px}
.vbox .btn{--acc:#E8B059;--on-acc:#14284B}
.vbox .x{color:#F3EBDA;border-color:rgba(243,235,218,.45)}

/* ── les escales : cartes postales ── */
.pcs{--edge:max(var(--gut),calc((100% - 1180px) / 2 + var(--gut)));display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:6px var(--edge) 22px;scroll-padding:0 var(--edge);overscroll-behavior-x:contain}
.pcs::-webkit-scrollbar{display:none}
.pc{flex:0 0 min(84vw,350px);height:240px;perspective:1200px;scroll-snap-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:6px}
.pc-in{position:relative;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.9,.3,1)}
.pc.is-flip .pc-in{transform:rotateY(180deg)}
.pc-f,.pc-b{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:#FFFCF5;color:#1D2B44;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.18),0 18px 30px -16px rgba(0,0,0,.55);transition:visibility 0s .33s}
.pc-b{visibility:hidden;transform:rotateY(180deg);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.pc.is-flip .pc-b{visibility:visible}
.pc.is-flip .pc-f{visibility:hidden}
.pc-f{padding:8px}
.pc-ph{position:relative;width:100%;height:100%;overflow:hidden;border-radius:3px;background:#E9DCC0}
.pc-ph img,.pc-ph svg{width:100%;height:100%;object-fit:cover;display:block}
.pc-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,18,34,.72))}
.pc-lab{position:absolute;left:20px;right:64px;bottom:18px;z-index:2;color:#FFF8EF}
.pc-lab b{display:block;font:700 20px/1.18 var(--fw);letter-spacing:.02em;text-wrap:balance}
.pc-lab span{display:block;font:600 14px/1.2 var(--fs);opacity:.92;margin-top:4px}
.pc-turn{position:absolute;right:18px;bottom:18px;z-index:2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#FFF8EF;color:#9A3826}
.pc-turn svg{width:20px;height:20px}
.pc-note{padding:16px 12px 14px 18px;display:flex;flex-direction:column;border-right:1px solid rgba(29,43,68,.22);margin:12px 0;min-width:0}
.pc-note p{margin:0;font:italic 400 15.5px/1.45 var(--fw);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.pc-note .sig{margin-top:auto;padding-top:6px;font:700 14px/1.2 var(--fs);color:#9A3826}
.pc-addr{position:relative;padding:14px 14px 14px 12px;display:flex;flex-direction:column;min-width:0}
.pc-stamp{align-self:flex-end;width:48px;height:58px;border:2px dashed rgba(29,43,68,.35);padding:3px;background:#FFFCF5}
.pc-stamp span{display:grid;place-items:center;width:100%;height:100%;background:#C0503A;color:#FFF3DA}
.pc-stamp svg{width:24px;height:24px}
.pc-pm{position:absolute;right:46px;top:34px;width:62px;height:62px;color:#1F6F8B;opacity:.72}
.pc-lines{margin-top:auto;display:grid;gap:5px}
.pc-lines span{display:block;font:600 13.5px/1.25 var(--fs);border-bottom:1px solid rgba(29,43,68,.25);padding-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-read{margin-top:10px;align-self:flex-start;min-height:40px;padding:0 14px;font-size:14px;background:#BF4F39;color:#fff}
.pc-empty{color:#5A6475}
.pcs-f{display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 15px/1.3 var(--fs);color:var(--mut)}
.pcs-f .hint{display:inline-flex;align-items:center;gap:8px}
.b-esc .arrows button{background:transparent;color:var(--fg);border-color:rgba(255,248,239,.6)}

/* ── le programme ── */
.oc{display:grid;gap:28px}
.oc-g h3{font-size:21px;margin:0 0 12px;padding-bottom:8px;border-bottom:4px solid var(--oc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-g h3 small{display:block;font:800 13.5px/1.2 var(--fs);color:var(--oc);letter-spacing:.04em;margin-top:4px}
.ph{position:relative;border-radius:16px;padding:14px 16px 14px 18px;border-left:6px solid var(--oc)}
.ph+.ph{margin-top:10px}
.ph .fl{display:block;font-size:22px;line-height:1.1;letter-spacing:3px}
.ph b{display:block;font:700 17px/1.25 var(--fw);margin-top:7px;letter-spacing:.01em}
.ph .per{display:block;font:800 13px/1.3 var(--fs);color:var(--oc);margin-top:4px;letter-spacing:.02em}
.ph small{display:block;font:400 14.5px/1.4 var(--fs);color:var(--card-mut);margin-top:4px}
.ph .ok{position:absolute;right:12px;top:12px;font:800 11.5px/1 var(--fs);background:#3F7A3A;color:#fff;border-radius:999px;padding:5px 9px;letter-spacing:.03em}
.prg-n{margin:26px 0 0;font:500 15px/1.5 var(--fs);color:var(--mut);max-width:760px}

/* ── l'équipage ── */
.crew{display:grid;gap:22px}
.duo,.boat{margin:0;overflow:hidden;display:flex;flex-direction:column}
.duo .cp,.boat .cp{position:relative;aspect-ratio:16/10;background:#CFE0EA}
.duo img,.boat img{width:100%;height:100%;object-fit:cover;display:block}
.who{display:grid;grid-template-columns:1fr 1fr}
.who>div{padding:16px 18px 18px}
.who>div+div{border-left:1px solid var(--hair)}
.who h3,.boat h3{font-size:26px}
.role{margin:4px 0 0;font:600 14.5px/1.35 var(--fs);color:var(--card-mut)}
.alias{margin:6px 0 0;font:italic 400 15.5px/1.3 var(--fw);color:#94650F}
[data-theme="night"] .alias{color:#E8B059}
.boat>div:last-child{padding:16px 18px 18px}
.crew-q{margin:30px auto 0;max-width:640px;text-align:center;font:italic 400 20px/1.5 var(--fw);color:var(--fg)}
.crew-q cite{display:block;font:500 14.5px/1.3 var(--fs);font-style:normal;color:var(--mut);margin-top:8px}

/* ── la genèse ── */
.gen{display:grid;gap:26px;align-items:center}
.gen-mark{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.gen-mark .kr{font:400 110px/1 'Nanum Brush Script',var(--fw);color:var(--acc);letter-spacing:0;text-transform:none}
.gen-mark span{font:700 15px/1.3 var(--fs);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.gen-ph{border-radius:22px;overflow:hidden;aspect-ratio:16/10;box-shadow:var(--shadow)}
.gen-ph img{width:100%;height:100%;object-fit:cover;display:block}
.gen p{margin:14px 0 0;font-size:17.5px}
.lnk{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:var(--acc);font:700 16px/1.2 var(--fs);text-decoration:none;border-bottom:2px solid currentColor;padding:10px 0 3px}
.lnk svg{width:18px;height:18px}

/* ── nous écrire ── */
.forms{display:grid;gap:20px}
.form-card{padding:22px}
.form-card h3{font-size:23px;margin-bottom:12px}
.form{display:grid;gap:12px}
.fld span{display:block;font:700 14px/1.2 var(--fs);color:var(--card-mut);margin:0 0 6px 2px}
.fld input,.fld textarea{width:100%;min-height:48px;font:400 16px/1.4 var(--fs);color:var(--card-ink);background:var(--card);border:1.5px solid var(--hair-2);border-radius:12px;padding:11px 13px}
.fld textarea{min-height:110px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(20,40,75,.2)}
.fhint{font:400 14.5px/1.4 var(--fs);color:var(--card-mut);margin:0}
.opts{display:grid;gap:6px;margin:0;padding:0;border:0}
.opt{display:flex;align-items:center;gap:12px;min-height:46px;cursor:pointer;font:500 16px/1.3 var(--fs)}
.opt input{width:22px;height:22px;accent-color:var(--acc);margin:0}

/* ── la fin ── */
.b-end{text-align:center;padding:84px 0 60px}
.b-end svg.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.b-end blockquote{position:relative;margin:0 auto;max-width:720px;font:italic 400 clamp(23px,4.6vw,36px)/1.35 var(--fw)}
.b-end cite{display:block;font:500 15px/1.3 var(--fs);font-style:normal;color:var(--mut);margin-top:14px}
.b-end .lnk{position:relative}
.foot{position:relative;margin-top:56px;padding-top:30px;border-top:1px solid rgba(243,235,218,.18);font:400 14.5px/1.5 var(--fs);color:var(--mut)}
.foot .fwm{display:block;font:800 26px/1 var(--fw);letter-spacing:.05em;color:var(--fg);margin-bottom:8px}
.foot small{display:block;font-size:13px;margin-top:6px;opacity:.85}
.foot .ctas{justify-content:center}
[data-theme="night"] .wg-tab{background:#E8B059;color:#14284B}
[data-theme="night"] .art .lbl{color:#0D1830}

/* d9 : le lecteur — chaque photo ENTIÈRE (plus rien de coupé), une à la fois, numérotée,
   avec des flèches ; les vidéos du récit à la suite (Catherine) */
.wg-reader-card{max-width:880px}
.rd-wrap{position:relative;background:#0B1730}
.wg-reader-photos{gap:0;scrollbar-width:none;overscroll-behavior-x:contain}
.wg-reader-photos::-webkit-scrollbar{display:none}
.wg-reader-photos figure,.wg-reader-photos figure:only-child{flex:0 0 100%;display:flex;flex-direction:column;background:#0B1730}
.wg-reader-photos img,.wg-reader-photos video{display:block;width:100%;height:min(62dvh,560px);object-fit:contain;background:#0B1730}
.wg-reader-photos figcaption{color:#D5DCE6;padding:8px 16px 10px;font:italic 400 14.5px/1.4 var(--fw);min-height:2.6em}
.rd-n{position:absolute;left:12px;top:12px;z-index:2;background:rgba(11,23,48,.8);color:#fff;font:700 13px/1 var(--fs);padding:7px 10px;border-radius:999px}
.rd-a{position:absolute;top:calc(min(62dvh,560px) / 2);transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#14284B;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px -4px rgba(0,0,0,.6)}
.rd-a svg{width:22px;height:22px}
.rd-a[data-d="-1"]{left:10px}
.rd-a[data-d="1"]{right:10px}
.rd-a:disabled{opacity:0;pointer-events:none}
.rd-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.rd-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.rd-dots i.on{background:#E8B059}

/* d9 : où donner son avis — un bandeau en haut (hors du design jugé) et l'onglet « Mon avis »
   en or (il était marine sur l'accueil marine) ; au téléphone, au-dessus de la barre du bas,
   loin de « Choisir la photo » (Flavien, 12 nov. : « where they can comment the version ») */
.rvw{background:#E8B059;color:#14284B;font:600 14px/1.3 var(--fs)}
.rvw-in{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding-top:calc(5px + env(safe-area-inset-top,0px));padding-bottom:5px}
.rvw b{font-weight:800}
.rvw button{flex:none;border:0;border-radius:999px;background:#14284B;color:#fff;font:700 14px/1 var(--fs);min-height:38px;padding:0 15px;cursor:pointer;white-space:nowrap}
.rvw+.top .top-in{padding-top:6px}
.wg-tab{background:#E8B059;color:#14284B;font-weight:700;padding:16px 11px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
@media (max-width:759px){.wg-tab{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:none}}

/* d9 : les animations se jouent quand on arrive dessus (Catherine ne les avait pas vues) */
.rv{opacity:0}
.rv.in{animation:rvIn .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--rd,0s)}
@keyframes rvIn{from{opacity:0;transform:translateY(26px)}to{opacity:1}}

}

  .som-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:var(--top-ink);color:var(--top-bg);border:0;border-radius:999px;padding:0 18px;min-height:44px;align-self:center;font:700 15px/1 var(--fs);cursor:pointer;white-space:nowrap}

<script>
(function () {
  const { D, t, esc } = WG;
  const app = document.getElementById('app');
  const root = document.documentElement;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const S = { chap: '', et: '', flip: new Set(), theme: root.getAttribute('data-theme') === 'night' ? 'night' : 'day', gtab: 'ph' };

  // ── Masques « aquarelle » de d1 et la vague qui sépare les sections ──
  const url = (s) => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
  const disp = (seed, freq, scale, shape, vb = '0 0 200 200', blur = 0.7) => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='${vb}' preserveAspectRatio='none'><filter id='f' x='-20%' y='-20%' width='140%' height='140%'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='3' seed='${seed}'/><feDisplacementMap in='SourceGraphic' scale='${scale}' xChannelSelector='R' yChannelSelector='G'/><feGaussianBlur stdDeviation='${blur}'/></filter><g filter='url(#f)'>${shape}</g></svg>`;
  const R = root.style;
  R.setProperty('--m-r2', url(disp(11, 0.035, 20, "<circle cx='100' cy='100' r='84'/>")));
  R.setProperty('--m-rect', url(disp(5, 0.022, 16, "<rect x='9' y='9' width='282' height='182' rx='6'/>", '0 0 300 200', 0.6)));
  R.setProperty('--wave', url("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 150 16' preserveAspectRatio='none'><path d='M0 9C19 3 56 3 75 9S131 15 150 9V16H0Z'/></svg>"));
  const chev = (c) => url(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 9'><path d='M1.5 1.5l5.5 5.5 5.5-5.5' fill='none' stroke='${c}' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>`);

  // ── Icônes (le dessin des icônes Lucide, celles de l'application) ──
  const ICON = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
    map: '<path d="M14.1 5.6a2 2 0 0 0 1.8 0l3.7-1.9A1 1 0 0 1 21 4.6v12.8a1 1 0 0 1-.6.9l-4.5 2.3a2 2 0 0 1-1.8 0l-4.2-2.1a2 2 0 0 0-1.8 0l-3.7 1.8A1 1 0 0 1 3 19.4V6.6a1 1 0 0 1 .6-.9l4.5-2.3a2 2 0 0 1 1.8 0z"/><path d="M15 5.8v15"/><path d="M9 3.2v15"/>',
    book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.2"/>',
    anchor: '<path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
    sprout: '<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
    mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    menu: '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>',
    close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    pin: '<path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
    arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    left: '<path d="m15 18-6-6 6-6"/>',
    right: '<path d="m9 18 6-6-6-6"/>',
    play: '<path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/>',
    full: '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
    compass: '<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    turn: '<path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.9 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/>',
    images: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
    sail: '<path d="M22 18H2a4 4 0 0 0 4 4h12a4 4 0 0 0 4-4Z"/><path d="M21 14 10 2 3 14h18Z"/><path d="M10 2v16"/>',
    talk: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
    video: '<path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
    swipe: '<path d="M18 8H6"/><path d="m10 4-4 4 4 4"/><path d="M6 16h12"/><path d="m14 12 4 4-4 4"/>',
  };
  const ic = (k, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
  const STARP = 'M0-10C1.2-3 3-1.2 10 0 3 1.2 1.2 3 0 10-1.2 3-3 1.2-10 0-3-1.2-1.2-3 0-10z';
  const star = (x, y, s, c = '#E8B059') => `<g transform="translate(${x} ${y}) scale(${s})"><path class="tw" fill="${c}" d="${STARP}"/></g>`;

  // ── Les sections : une couleur, une icône, un nom simple (menus et titres) ──
  const SECS = [
    ['accueil', 'home', 'home', 'Accueil', 'Home', 'Le voyage en un coup d’œil', 'The voyage at a glance'],
    ['carte', 'map', 'map', 'Carte', 'Map', 'Le tour du monde prévu, la route parcourue', 'The planned voyage, the route sailed'],
    ['journal', 'book', 'jnl', 'Journal', 'Journal', 'Tous les récits, du plus récent au plus ancien', 'Every story, newest first'],
    ['galerie', 'camera', 'gal', 'Galerie', 'Gallery', 'Les photos du voyage', 'Photos of the voyage'],
    ['escales', 'anchor', 'esc', 'Escales', 'Stops', 'Une carte postale de chaque escale', 'A postcard from every stop'],
    ['programme', 'globe', 'prg', 'Programme', 'Programme', 'La route prévue, 2026–2029, avec ses drapeaux', 'The planned route, 2026–2029, flag by flag'],
    ['equipage', 'users', 'crw', 'Équipage', 'Crew', 'Catherine, Bertrand et Wang’ap', 'Catherine, Bertrand and Wang’ap'],
    ['genese', 'sprout', 'gen', 'Genèse', 'Genesis', 'Pourquoi « Wang’ap » ?', 'Why “Wang’ap”?'],
    ['contact', 'mail', 'ctc', 'Contact', 'Contact', 'Nous écrire, recevoir les nouvelles', 'Write to us, get the news'],
  ].map(([id, icon, c, fr, en, dFr, dEn]) => ({ id, icon, c: `var(--c-${c})`, label: () => t(fr, en), desc: () => t(dFr, dEn) }));
  const SEC = Object.fromEntries(SECS.map((s) => [s.id, s]));
  const sh = (id, title, sub) => `<header class="sh"><span class="sh-i">${ic(SEC[id].icon)}</span><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div></header>`;
  // Le Petit Prince en exergue, une phrase par section — le texte du livre (Gallimard), traduit par nous.
  const Q = WG.QUOTES;
  const EPI = {
    num: ['« Les grandes personnes aiment les chiffres. »', '“Grown-ups love figures.”'],
    carte: ['« Droit devant soi on ne peut pas aller bien loin… »', '“Straight ahead of you, nobody can go very far…”'],
    journal: ['« On ne connaît que les choses que l’on apprivoise. »', '“One only understands the things that one tames.”'],
    galerie: [Q.heart.fr, Q.heart.en],
    escales: [Q.desert.fr, Q.desert.en],
    programme: ['« Pour les uns, qui voyagent, les étoiles sont des guides. »', '“For some, who travel, the stars are guides.”'],
    equipage: [Q.tame.fr, Q.tame.en],
    genese: ['« Toutes les grandes personnes ont d’abord été des enfants. (Mais peu d’entre elles s’en souviennent.) »', '“All grown-ups were once children. (But only few of them remember it.)”'],
  };
  const epi = (k) => `<blockquote class="epi">${esc(t(EPI[k][0], EPI[k][1]))}<cite>— ${t('Le Petit Prince', 'The Little Prince')}</cite></blockquote>`;

  // ── Données (data.js : ce que le public voit déjà, délai appliqué) ──
  const byDate = (a, b) => a.date_start.localeCompare(b.date_start);
  // Règle 8 : seulement les chapitres et les étapes déjà commencés au dernier point public.
  const begun = (x) => x.date_start && x.date_start <= D.lastPublicAt;
  const chapters = D.chapters.filter(begun).sort(byDate);
  const etapes = D.etapes.filter(begun).sort(byDate);
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
  const CHC = [0, 1, 2, 3, 4].map((i) => `var(--ch${i})`);
  const chapIdx = (id) => chapters.findIndex((c) => c.id === id);
  const chapColor = (id) => CHC[Math.max(0, chapIdx(id)) % CHC.length];
  const curChap = chapters[chapters.length - 1];
  const lastAt = new Date(D.lastPublicAt);
  const cap1 = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const etName = (id) => cap1(WG.etape(id)).replace(/\s*->\s*/g, ' → ');
  const nStories = (n) => (n ? t(`${n} récit${n > 1 ? 's' : ''}`, `${n} stor${n > 1 ? 'ies' : 'y'}`) : t('pas encore de récit', 'no story yet'));
  const cut = (s, n) => (s && s.length > n ? `${s.slice(0, s.lastIndexOf(' ', n))}…` : s || '');
  const im = (u, w, alt = '', lazy = true) => `<img src="${esc(WG.img(u, w))}" alt="${esc(alt)}" ${lazy ? 'loading="lazy" ' : ''}decoding="async">`;
  const dShort = (iso) => WG.date(iso, { day: 'numeric', month: 'short' });
  const nf = (n) => WG.fmtNm(n);
  const postBy = (prefix) => D.posts.find((p) => p.id.startsWith(prefix));
  const photoOf = (prefix, i) => { const p = postBy(prefix); return p && p.photos[i] ? { p, ph: p.photos[i] } : null; };
  const nVid = (p) => (p.videos || []).length;
  const nPh = (p) => Math.max(0, (p.nPhotos || p.photos.length) - nVid(p));
  const totalPhotos = D.posts.reduce((a, p) => a + nPh(p), 0);
  const VIDS = D.posts.flatMap((p) => (p.videos || []).map((v) => ({ p, v })));
  // L'image d'aperçu de chaque vidéo (scripts/design-survey/posters.mjs) : on ne charge une vidéo
  // que quand on la lance (sinon ≈ 1,4 Mo chacune rien que pour la montrer).
  const poster = (u) => `snaps/v/${u.split('/').pop().replace(/\.mp4$/i, '.jpg')}`;
  // Une escale encore ouverte au dernier point public : on tait sa date de fin (règle 8).
  const range = (e) => (new Date(`${e.date_end}T23:59:59Z`) > lastAt
    ? t(`depuis le ${dShort(e.date_start)}`, `since ${dShort(e.date_start)}`)
    : `${dShort(e.date_start)} – ${dShort(e.date_end)}`);

  // ── Le programme RÉEL (src/pages/ProgrammePage.jsx, phases 3 à 18) ──
  const OCEANS = {

  // ───────────────────── la carte du monde (tuiles Esri + encre) ─────────────────────

  const PHYS = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/${z}/${y}/${x}`;

  const simplify = (pts, eps) => {
    if (pts.length < 3) return pts;
    const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
    const st = [[0, pts.length - 1]];
    while (st.length) {
      const [a, b] = st.pop(); const [ax, ay] = pts[a], [bx, by] = pts[b];

    return p;
  };

  const drawn = RM ? '' : ' class="trk-d" pathLength="1"';
  const trackSvg = (proj, eps, TRK, GLOW, w) => {

  // Une rose des vents, à la manière des vieilles mappemondes.

    + [45, 135, 225, 315].map((a) => `<path transform="rotate(${a})" d="M0,${(-r * 0.72).toFixed(1)}L${(r * 0.1).toFixed(1)},0L0,${(r * 0.1).toFixed(1)}L${(-r * 0.1).toFixed(1)},0Z" fill="${c}" opacity=".55"/>`).join('')

    + `<text y="${(-r * 1.25).toFixed(1)}" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="${(r * 0.45).toFixed(1)}" fill="${c}">N</text></g>`;

  const WB = { w: 75, e: 435, n: 50, s: -44 };

    svg += `<path d="M0,${f(Y(0))}H${W}" stroke="${LINE}" stroke-width="1.3" stroke-dasharray="7 5" fill="none"/>`;

      + `<span class="wl eq fadein" style="left:${lx}px;top:${f(Y(23.44) - 9)}px;transform:translate(-50%,-50%)">${t('Tropique du Cancer', 'Tropic of Cancer')}</span>`
      + `<span class="wl eq fadein" style="left:${lx}px;top:${f(Y(-23.44) + 9)}px;transform:translate(-50%,-50%)">${t('Tropique du Capricorne', 'Tropic of Capricorn')}</span>`;

  const NSTOPS = [[4.08, 43.56, '🇫🇷', 'La Grande-Motte', 'La Grande-Motte', 'l'], [14.51, 35.9, '🇲🇹', 'Malte', 'Malta', 'r'], [east[0], east[1], '🇬🇷', 'Grèce', 'Greece', 'l'], [-5.35, 36.13, '🇬🇮', 'Gibraltar', 'Gibraltar', 'r']];

    if (!root || RM || !('IntersectionObserver' in window)) return;
    if (!rvIO) rvIO = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); rvIO.unobserve(en.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
    root.querySelectorAll('.sh, .epi, .art, .gt, .pc, .oc-g, .duo, .boat, .gen-ph, .form-card, .wm-card, .near-card, .pos-card, .nums li, .jside .box').forEach((el) => {
      if (el.classList.contains('rv')) return;
      el.classList.add('rv');
      el.style.setProperty('--rd', `${(Math.min([...el.parentElement.children].indexOf(el), 5) * 0.08).toFixed(2)}s`);
      rvIO.observe(el);
    });
  };
  const goWhenSeen = () => {
    const els = [document.getElementById('wm-card'), document.querySelector('.near-card')].filter(Boolean);
    if (RM || !('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('go')); return; }
    if (goIO) goIO.disconnect();
    goIO = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('go'); goIO.unobserve(en.target); } }), { threshold: 0.3 });
    els.forEach((e) => goIO.observe(e));
  };
  let hinted = false;
  const hintFlip = () => {
    const pc = document.querySelector('#pcs .pc');
    if (hinted || !pc || RM || !('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver((es) => {
      if (!es[0].isIntersecting) return;
      io.disconnect(); hinted = true;
      setTimeout(() => { if (S.flip.has(pc.dataset.flip)) return; flip(pc); setTimeout(() => { if (S.flip.has(pc.dataset.flip)) flip(pc); }, 2000); }, 700);
    }, { threshold: 0.7 });
    io.observe(pc);
  };

  // ── Le lecteur (d9) : chaque photo entière, une à la fois, numérotée, avec des flèches ;
  // les vidéos du récit à la suite ; ouvert sur la photo touchée dans la galerie ──
  let lastPost = null, lastPh = 0;
  document.addEventListener('click', (e) => { const el = e.target.closest('[data-post]'); if (el) { lastPost = D.posts.find((x) => x.id === el.dataset.post) || null; lastPh = Number(el.dataset.ph || 0); } }, true);
  const enhanceReader = (ov) => {
    const p = lastPost;
    let sc = ov.querySelector('.wg-reader-photos');
    if (p && nVid(p)) {
      if (!sc) { sc = document.createElement('div'); sc.className = 'wg-reader-photos'; ov.querySelector('.wg-reader-body').before(sc); }
      sc.insertAdjacentHTML('beforeend', p.videos.map((v) => `<figure><video controls playsinline preload="none" poster="${esc(poster(v.url))}" src="${esc(v.url)}"></video>${WG.cap(v) ? `<figcaption>${esc(WG.cap(v))}</figcaption>` : ''}</figure>`).join(''));
    }
    if (!sc) return;
    const figs = [...sc.children], n = figs.length;
    const wrap = document.createElement('div'); wrap.className = 'rd-wrap'; sc.before(wrap); wrap.appendChild(sc);
    if (n < 2) return;
    wrap.insertAdjacentHTML('beforeend', `<span class="rd-n" aria-live="polite"></span><button type="button" class="rd-a" data-d="-1" aria-label="${t('Précédente', 'Previous')}">${ic('left')}</button><button type="button" class="rd-a" data-d="1" aria-label="${t('Suivante', 'Next')}">${ic('right')}</button><div class="rd-dots" aria-hidden="true">${figs.map(() => '<i></i>').join('')}</div>`);
    const cnt = wrap.querySelector('.rd-n'), dots = [...wrap.querySelectorAll('.rd-dots i')], prev = wrap.querySelector('[data-d="-1"]'), next = wrap.querySelector('[data-d="1"]');
    const cur = () => Math.round(sc.scrollLeft / Math.max(1, sc.clientWidth));
    const upd = () => {
      const i = cur();
      cnt.textContent = `${i + 1} / ${n}`;
      dots.forEach((d, j) => d.classList.toggle('on', j === i));
      prev.disabled = i === 0; next.disabled = i === n - 1;
      sc.querySelectorAll('video').forEach((v) => { if (!v.paused && figs.indexOf(v.closest('figure')) !== i) v.pause(); });
    };
    const go = (i) => sc.scrollTo({ left: Math.max(0, Math.min(n - 1, i)) * sc.clientWidth, behavior: RM ? 'auto' : 'smooth' });
    wrap.addEventListener('click', (e) => { const a = e.target.closest('.rd-a'); if (a) go(cur() + Number(a.dataset.d)); });
    sc.addEventListener('scroll', () => requestAnimationFrame(upd), { passive: true });
    ov.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); go(cur() + (e.key === 'ArrowRight' ? 1 : -1)); } });
    if (lastPh > 0 && lastPh < n) sc.scrollLeft = lastPh * sc.clientWidth;
    upd();
  };
  new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((nd) => { if (nd.nodeType === 1 && nd.classList.contains('wg-reader')) enhanceReader(nd); }))).observe(document.body, { childList: true });

  // ── Rendu ──
  const applyTheme = () => {
    root.setAttribute('data-theme', S.theme);
    document.querySelector('meta[name="theme-color"]').content = S.theme === 'night' ? '#0D1830' : '#FBF6EA';
    R.setProperty('--chev', chev(S.theme === 'night' ? '#EFE8D8' : '#1D2B44'));
  };
  const counters = () => {
    const els = [...document.querySelectorAll('[data-count]')];
    if (RM || !('IntersectionObserver' in window)) return;
    const run = (el) => {
      const to = +el.dataset.count, t0 = performance.now();
      const tick = (now) => { const q = Math.min(1, (now - t0) / 1300); el.textContent = nf(Math.round(to * (1 - (1 - q) ** 3))); if (q < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    };
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { io.unobserve(e.target); run(e.target); } }), { threshold: 0.6 });
    els.forEach((el) => io.observe(el));
  };
  let spyIO;
  const spy = () => {
    if (spyIO) spyIO.disconnect();
    if (!('IntersectionObserver' in window)) return;
    spyIO = new IntersectionObserver((ents) => ents.forEach((en) => {
      if (!en.isIntersecting) return;
      const k = en.target.getAttribute('data-tab');
      document.querySelectorAll('[data-t]').forEach((a) => { const on = a.dataset.t === k; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    }), { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('[data-tab]').forEach((s) => spyIO.observe(s));
  };
  let wmRO;
  const render = () => {
    const y = window.scrollY;
    applyTheme();
    app.innerHTML = header() + '<main>' + hero() + numbers() + carte() + journal() + galerie() + escales() + programme() + equipage() + genese() + contact() + '</main>' + closing() + chrome();
    renderList();
    wmW = 0;
    requestAnimationFrame(() => { worldMap(true); mountNear(true); });
    if (wmRO) wmRO.disconnect();
    if ('ResizeObserver' in window) {
      let rt;
      wmRO = new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { worldMap(false); mountNear(false); }, 160); });
      wmRO.observe(document.getElementById('wm-scroll')); wmRO.observe(document.getElementById('near'));
    }
    counters();
    spy();
    reveal();
    goWhenSeen();
    hintFlip();
    window.scrollTo(0, y);
  };

  const sheet = (on) => { const s = document.getElementById('sheet'); s.classList.toggle('on', on); document.body.style.overflow = on ? 'hidden' : ''; if (on) s.querySelector('.x').focus(); };
  const flip = (pc) => {
    const id = pc.dataset.flip, on = !S.flip.has(id);
    if (on) S.flip.add(id); else S.flip.delete(id);
    pc.classList.toggle('is-flip', on); pc.setAttribute('aria-pressed', String(on));
    pc.querySelector('.pc-b').setAttribute('aria-hidden', String(!on));
    const b = pc.querySelector('.pc-read'); if (b) b.tabIndex = on ? 0 : -1;
  };
  document.addEventListener('click', (e) => {
    const l = e.target.closest('[data-lang]'); if (l) { if (l.dataset.lang !== WG.lang) { sheet(false); WG.setLang(l.dataset.lang); } return; }
    const th = e.target.closest('[data-set-theme]');
    if (th) {
      if (th.dataset.setTheme !== S.theme) {
        S.theme = th.dataset.setTheme; WG.store.set('wg-d9-theme', S.theme); applyTheme();
        document.querySelectorAll('[data-set-theme]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.setTheme === S.theme)));
        worldMap(true); mountNear(true);
      }
      return;
    }
    if (e.target.closest('[data-menu]')) { sheet(true); return; }
    const pick = e.target.closest('[data-pick]');
    if (pick) { const pk = document.getElementById('picks'); const on = !pk.classList.contains('on'); pk.classList.toggle('on', on); pick.setAttribute('aria-expanded', String(on)); return; }
    const hb = e.target.closest('[data-hero]'); if (hb) { setHero(hb.dataset.hero); return; }
    const gt = e.target.closest('[data-gtab]');
    if (gt) {
      S.gtab = gt.dataset.gtab;
      document.querySelectorAll('[data-gtab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.gtab === S.gtab)));
      const gp = document.getElementById('g-ph'), gv = document.getElementById('g-vd');
      gp.hidden = S.gtab !== 'ph'; gv.hidden = S.gtab !== 'vd';
      if (S.gtab === 'vd' && !gv.innerHTML.trim()) gv.innerHTML = vidGrid();
      return;
    }
    const vt = e.target.closest('[data-vid]'); if (vt) { openVid(VIDS[Number(vt.dataset.vid)]); return; }
    const sh0 = document.getElementById('sheet');
    if (sh0 && sh0.classList.contains('on') && (e.target === sh0 || e.target.closest('[data-close]'))) { sheet(false); return; }
    const c = e.target.closest('[data-chap]');
    if (c) { S.chap = c.dataset.chap; S.et = ''; renderList(); return; }
    if (e.target.closest('[data-reset]')) { S.chap = ''; S.et = ''; renderList(); return; }
    const pn = e.target.closest('[data-pan]'); if (pn) { const sc = document.getElementById('wm-scroll'); sc.scrollBy({ left: Number(pn.dataset.pan) * sc.clientWidth * 0.7, behavior: RM ? 'auto' : 'smooth' }); return; }
    const sb = e.target.closest('[data-scroll]'); if (sb) { const r = document.getElementById('pcs'); r.scrollBy({ left: Number(sb.dataset.scroll) * Math.min(r.clientWidth * 0.8, 740), behavior: RM ? 'auto' : 'smooth' }); return; }
    if (e.target.closest('[data-avis]')) { const tab = document.querySelector('.wg-tab'); if (tab) tab.click(); else location.reload(); return; }   // sans onglet (vieux wg.js) : recharger
    const pc = e.target.closest('[data-flip]'); if (pc && !e.target.closest('[data-post]')) flip(pc);
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'f-et') { S.et = e.target.value; renderList(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { const s0 = document.getElementById('sheet'); if (s0?.classList.contains('on')) sheet(false); }
    const pc = e.target.closest?.('[data-flip]');
    if (pc && e.target === pc && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); flip(pc); return; }
    const a = e.target.closest?.('article[data-post]');
    if (a && e.target === a && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const p = D.posts.find((x) => x.id === a.dataset.post); if (p) WG.openPost(p); }
  });
  window.addEventListener('wg:lang', render);
  WG.inert();
  render();
})();
</script>
