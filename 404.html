    <!-- V1.9.3 — REVERT V1.9-A11Y-1(a): re-add maximum-scale=1.0 +
         user-scalable=no. The original change satisfied Lighthouse a11y
         (-8 points reclaimed) but real-world UX broke: accidental pinches
         while sailing zoomed the whole page including the StarryHeader and
         TabBar, dropping the user out of the navigation. At-sea PWA UX
         (gloves, wet hands, one hand on a winch) > a11y audit score. Users
         who genuinely need zoom can use iOS Settings → Accessibility →
         Zoom (system-level, works on top of any web app). Lighthouse a11y
         drops back from 93 to ~85, still > 80, well above the public
         landing's other score floors. -->

    <meta name="theme-color" content="#0B1026" />
