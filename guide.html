<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wang'ap — Guide / Guide utilisateur</title>
  <meta name="description" content="Guide complet de l'application Wang'ap — par niveau (public, famille, skipper) et par fonctionnalité." />
  <style>
    :root {
      --night:#0B1026; --navy:#162447; --blue:#1F4068; --teal:#1B9AAA;
      --gold:#E8B059; --gold-deep:#B07820; --coral:#E07A5F; --sand:#F4F1DE;
      --cream:#FFFCF2; --slate:#3D405B; --gray:#8D99AE;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--slate); background:var(--cream); line-height:1.6; -webkit-font-smoothing:antialiased; }
    a { color:var(--teal); }
    header.top { position:sticky; top:0; z-index:50; background:linear-gradient(180deg,var(--night) 0%,var(--navy) 100%); color:var(--sand); padding:14px 18px; box-shadow:0 2px 14px rgba(0,0,0,.25); }
    .top-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; max-width:1080px; margin:0 auto; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:.5px; }
    .brand .logo { width:34px; height:34px; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; }
    .brand small { display:block; font-weight:500; font-size:11px; color:var(--gold); letter-spacing:0; }
    .spacer { flex:1; }
    .search { flex:1 1 240px; min-width:180px; max-width:420px; position:relative; }
    .search input { width:100%; padding:9px 12px 9px 32px; border-radius:10px; border:none; background:rgba(255,255,255,.95); color:var(--slate); font-size:14px; }
    .search::before { content:'🔍'; position:absolute; left:10px; top:8px; font-size:13px; opacity:.6; }
    .lang-toggle { display:flex; background:rgba(255,255,255,.12); border-radius:9px; overflow:hidden; }
    .lang-toggle button { border:none; background:transparent; color:var(--sand); padding:7px 12px; cursor:pointer; font-weight:700; font-size:12px; }
    .lang-toggle button.active { background:var(--gold); color:var(--night); }
    .back-app { color:var(--sand); text-decoration:none; font-size:12px; opacity:.85; border:1px solid rgba(255,255,255,.25); padding:6px 11px; border-radius:9px; white-space:nowrap; }
    .back-app:hover { opacity:1; }
    .tabs { max-width:1080px; margin:0 auto; padding:14px 18px 0; display:flex; gap:8px; flex-wrap:wrap; }
    .tab { border:1px solid rgba(0,0,0,.08); background:#fff; color:var(--slate); padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600; }
    .tab.active { background:var(--navy); color:var(--sand); border-color:var(--navy); }
    main { max-width:1080px; margin:0 auto; padding:16px 18px 60px; }
    .lead { font-size:14px; color:var(--gray); margin:6px 2px 18px; }
    .count { font-size:12px; color:var(--gray); margin:2px 2px 14px; }
    .card { background:#fff; border-radius:16px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 8px rgba(0,0,0,.05); border:1px solid rgba(0,0,0,.04); }
    .card h3 { font-size:17px; color:var(--navy); display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    .card h3 .icon { font-size:20px; }
    .badge { font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.4px; }
    .badge.public { background:#e4f3f5; color:#0d7a8a; }
    .badge.family { background:#fde8ec; color:#b23a52; }
    .badge.skipper { background:rgba(232,176,89,.2); color:var(--gold-deep); }
    .card .desc { margin:10px 0 0; font-size:14.5px; }
    .card ul { margin:9px 0 0 2px; padding-left:18px; }
    .card ul li { margin-bottom:5px; font-size:13.5px; }
    .card ul li b { color:var(--navy); }
    .card .note { margin-top:10px; font-size:12.5px; color:var(--gray); background:var(--sand); border-radius:9px; padding:8px 11px; }
    /* Screenshots — small clickable thumbnails (click to open full size) */
    figure.shot { margin:12px 0 2px; }
    figure.shot a.shotlink { display:inline-block; line-height:0; }
    figure.shot img { max-width:300px; max-height:440px; width:auto; height:auto; border-radius:10px; border:1px solid rgba(0,0,0,.12); display:block; cursor:zoom-in; }
    .shot-ph { display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px; width:300px; max-width:100%; min-height:120px; border:2px dashed var(--gold); border-radius:10px; background:repeating-linear-gradient(45deg,#fff,#fff 12px,#fdf6e8 12px,#fdf6e8 24px); color:var(--gold-deep); text-align:center; padding:14px; }
    .shot-ph .num { font-size:20px; font-weight:800; }
    .shot-ph .cap { font-size:11.5px; color:var(--slate); }
    .shot-ph .path { font-size:10px; color:var(--gray); font-family:ui-monospace,Menlo,monospace; }
    figcaption { font-size:11px; color:var(--gray); margin-top:4px; }
    .no-results { text-align:center; padding:50px 20px; color:var(--gray); }
    footer { max-width:1080px; margin:0 auto; padding:24px 18px 60px; border-top:1px solid rgba(0,0,0,.08); color:var(--gray); font-size:13px; }
    footer a { margin-right:14px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="logo">⛵</span><span>wang'ap<small data-i18n="subtitle">Guide utilisateur</small></span></div>
      <div class="spacer"></div>
      <div class="search"><input id="q" type="search" autocomplete="off" /></div>
      <div class="lang-toggle">
        <button id="lang-fr" onclick="setLang('fr')">FR</button>
        <button id="lang-en" onclick="setLang('en')">EN</button>
      </div>
      <a class="back-app" href="/" data-i18n="backApp">← l'app</a>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <main>
    <p class="lead" id="lead"></p>
    <p class="count" id="count"></p>
    <div id="cards"></div>
    <div class="no-results hidden" id="noResults"></div>
  </main>
  <footer><p id="footerLinks" style="margin-bottom:10px;"></p><p id="footerNote"></p></footer>

  <script>

      shotPath:(n)=>`à venir : /help-shots/${String(n).padStart(2,'0')}.webp`,

      footerLinks:'<a href="/faq.html">FAQ</a><a href="/roadmap.html">Feuille de route</a><a href="/">Ouvrir l’app</a>',

    },

      subtitle:'User guide', backApp:'← the app',
      searchPlaceholder:'Search the guide…',
      lead:"Every Wang'ap screen, in detail — organised by access level. Pick a level, or search a keyword. Click a screenshot to enlarge.",
      tabs:{ all:'All', public:'🌍 Public', family:'❤️ Family', skipper:'⛵ Skipper' },
      count:(n)=>`${n} screen${n>1?'s':''}`,
      noResults:'No topic matches your search.',
      shotPath:(n)=>`coming: /help-shots/${String(n).padStart(2,'0')}.webp`,
      zoom:'click to enlarge',
      footerLinks:'<a href="/faq.html">FAQ</a><a href="/roadmap.html">Roadmap</a><a href="/">Open the app</a>',
      footerNote:"A question not covered here? Ask Le Renard 🦊 in the app, or email sailing.wangap@gmail.com."
    }
  };

  // ── Guide content — exhaustive, one card per panel. shot = existing capture # ──
  const G = [
    // ════════════ PUBLIC ════════════
    { id:'pub-home', level:'public', icon:'🏠', shot:1,
      t:{fr:"Page d'accueil publique",en:'Public home page'},
      d:{fr:"La vitrine du voyage sur wangap.fr, sans connexion.",en:'The voyage shop-window on wangap.fr, no login needed.'},
      bullets:{fr:[
        '<b>Hero</b> : photo plein écran, ciel étoilé animé, citation du Petit Prince, titre du voyage (Outremer 52 · ~36 000 milles · 2026–2029).',
        '<b>Boutons</b> : « Où sommes-nous ? » (carte) et « Lire le carnet ».',
        '<b>Barre de stats</b> : milles, jours, escales, étapes — calculés en direct.',
        '<b>Post mis en avant</b> + grille des posts récents (publics uniquement).',
        '<b>Récit d’intro</b> + galerie photo publique.',
        "<b>Mini-carte</b> « où sommes-nous » (clic → carte plein écran).",
        '<b>🦊 Le mot du bord</b>, en différé : quelques lignes écrites par l’IA sur la navigation — sans position ni destination.',
        '<b>Abonnement newsletter</b> + bouton « Écrire aux skippers ».',
        'Bascule de langue FR/EN, bouton Connexion, retour-en-haut.'],
        en:[
        '<b>Hero</b>: full-screen photo, animated starry sky, Little Prince quote, voyage title (Outremer 52 · ~36,000 nm · 2026–2029).',
        '<b>Buttons</b>: "Where are we?" (map) and "Read the log".',
        '<b>Stats bar</b>: miles, days, stops, legs — computed live.',
        '<b>Featured post</b> + recent posts grid (public only).',
        '<b>Intro narrative</b> + public photo gallery.',
        '<b>Mini-map</b> "where are we" (click → full-screen map).',
        '<b>🦊 Word from the boat</b>, delayed: a few lines written by the AI about the sailing — without position or destination.',
        '<b>Newsletter signup</b> + "Message the skippers" button.',
        'FR/EN language toggle, Login button, scroll-to-top.']},
      cap:{fr:"Accueil : hero, stats, posts, aperçu carte.",en:'Home: hero, stats, posts, map preview.'} },

    { id:'pub-about', level:'public', icon:'📜', shot:2,
      t:{fr:'Le projet & la Genèse',en:'The project & the Genesis'},
      d:{fr:"L'histoire du voyage, du bateau et l'origine du rêve.",en:'The story of the voyage, the boat and where the dream began.'},
      bullets:{fr:[
        '<b>Le projet</b> : illustration du bateau, récit du projet, tableau des 18 phases de route, dates de retour de la famille.',
        '<b>La Genèse</b> : l’origine (Hwangap 환갑 — les 60 ans, début d’un nouveau cycle), les années de préparation depuis 2022.',
        'Liens vers le Programme et la carte.'],
        en:[
        '<b>The project</b>: boat illustration, project story, 18-phase route table, family return dates.',
        '<b>The Genesis</b>: the origin (Hwangap 환갑 — turning 60, the start of a new cycle), the preparation years since 2022.',
        'Links to the Programme and the map.']},
      cap:{fr:'« Le projet » : tableau des 18 phases.',en:'"The project": the 18-phase table.'} },

    { id:'pub-programme', level:'public', icon:'🗓️', shot:3,
      t:{fr:'Le Programme (route prévue)',en:'The Programme (planned route)'},
      d:{fr:"Le plan complet du tour du monde, phase par phase.",en:'The full round-the-world plan, phase by phase.'},
      bullets:{fr:[
        'Les <b>18 phases</b> : itinéraires, distances, escales clés, points forts.',
        'Fenêtres de <b>retour de la famille</b> à chaque phase.',
        'Lien vers <b>l’Animation</b> du voyage.'],
        en:[
        'The <b>18 phases</b>: itineraries, distances, key stops, highlights.',
        '<b>Family-return</b> windows at each phase.',
        'Link to the voyage <b>Animation</b>.']},
      cap:{fr:'Le Programme : 18 phases.',en:'The Programme: 18 phases.'} },

    { id:'pub-animation', level:'public', icon:'🎬', shot:4,
      t:{fr:'Animation du voyage',en:'Voyage animation'},
      d:{fr:"La route prévue rejouée sur la carte.",en:'The planned route replayed on the map.'},
      bullets:{fr:[
        'Un <b>voilier animé</b> parcourt la route d’escale en escale.',
        'Overlay : drapeau, ville, période de chaque étape.',
        '<b>Lecture / pause</b>, barre de progression (scrubber) avec infobulles, points d’étape cliquables.'],
        en:[
        'An <b>animated sailboat</b> travels the route stop to stop.',

      cap:{fr:'Animation : voilier sur la route prévue.',en:'Animation: sailboat on the planned route.'} },

    { id:'pub-map', level:'public', icon:'🗺️', shot:5,
      t:{fr:'Carte publique',en:'Public map'},
      d:{fr:"Toute la carte interactive, accessible aux visiteurs.",en:'The full interactive map, open to visitors.'},
      bullets:{fr:[
        '<b>Trace GPS</b> colorée par chapitre/étape ; regroupement (clusters) + éclatement « spider » au zoom.',
        '<b>Miniatures photo</b> aux points publiés → carte de prévisualisation → modale détail (photo, blocs nav/conditions/tech, galerie, lightbox, coordonnées, tags).',

        '<b>Contrôles</b> : centrer sur la position, vue monde, zoom/boussole, lire le Programme.'],
        en:[
        '<b>GPS track</b> coloured by chapter/leg; clustering + "spider" fan-out on zoom.',
        '<b>Photo thumbnails</b> at published points → preview card → detail modal (photo, nav/conditions/tech blocks, gallery, lightbox, coordinates, tags).',
        '<b>Never the current position</b>: the track stops at the delay the skippers chose.',
        '<b>The panel</b>: Layers (map type Default / Nautical / Satellite, Filter by chapter, leg or topic) and Track (Posts, Track, Plan — the planned route…).',
        'Along the track, the speed and true wind measured aboard, with the same delay.',
        '<b>Controls</b>: center on position, world view, zoom/compass, play the Programme.']},
      cap:{fr:'Carte publique : trace, posts, route.',en:'Public map: track, posts, route.'} },

    { id:'pub-newsletter', level:'public', icon:'💌', shot:6,
      t:{fr:'Newsletter — s’abonner & archive',en:'Newsletter — subscribe & archive'},
      d:{fr:"Recevoir les nouvelles par email et relire les éditions passées.",en:'Get the news by email and re-read past editions.'},
      bullets:{fr:[
        "<b>Abonnement</b> : formulaire en bas de l’accueil (email seulement), confirmation par retour.",
        '<b>Désabonnement</b> en un clic via le lien en bas de chaque email (token unique, sans compte).',
        '<b>Archive publique</b> sur /newsletters : index + page détail par édition (reprise aussi dans archive.wangap.fr).'],
        en:[
        '<b>Subscribe</b>: form at the bottom of the home page (email only), confirmation by return.',
        '<b>One-click unsubscribe</b> via the link at the bottom of every email (unique token, no account).',
        '<b>Public archive</b> at /newsletters: index + per-edition detail page (also inherited into archive.wangap.fr).']},
      cap:{fr:'Abonnement + archive publique.',en:'Subscribe + public archive.'} },

    { id:'pub-contact', level:'public', icon:'✉️', shot:7,
      t:{fr:'Commentaires & contact',en:'Comments & contact'},
      d:{fr:"Rester en lien sans compte.",en:'Stay in touch without an account.'},
      bullets:{fr:[
        '<b>Commentaires</b> sous chaque post public : nom + email + message (email privé, sert aux notifications), modérés par les skippers, mise à jour en direct.',
        '<b>« Écrire à Catherine et Bertrand »</b> : formulaire (nom, email, sujet, message) → boîte de réception + notification push + email.',
        'En cas de blocage réseau (filtre anti-DDoS Vercel), un message propose d’essayer en 4G/5G.'],
        en:[
        '<b>Comments</b> under each public post: name + email + message (email private, used for notifications), moderated by the skippers, live-updated.',
        '<b>"Message Catherine and Bertrand"</b>: form (name, email, subject, body) → inbox + push notification + email.',
        'If a network block hits (Vercel anti-DDoS), a message suggests trying on 4G/5G.']},
      cap:{fr:'Commentaires + formulaire de contact.',en:'Comments + contact form.'} },

    { id:'pub-livreor', level:'public', icon:'🖋️', shot:8,
      t:{fr:'Contribuer au Livre d’Or',en:'Contribute to the Guest Book'},
      d:{fr:"Pour un équipier ou ami invité, via un lien.",en:'For an invited crew member or friend, via a link.'},
      bullets:{fr:[
        'Lien <b>à usage unique</b> (token) reçu de la part des skippers — pas de compte à créer.',
        'Formulaire : <b>nom, message, photos</b>.',
        'La contribution part <b>en modération</b> ; elle n’apparaît qu’après validation.',
        'Lien expiré/déjà utilisé → message clair.'],
        en:[
        '<b>Single-use</b> link (token) received from the skippers — no account to create.',
        'Form: <b>name, message, photos</b>.',
        'The contribution goes <b>to moderation</b>; it appears only after approval.',
        'Expired/already-used link → clear message.']},
      cap:{fr:"Page de contribution (lien d'invitation).",en:'Contribution page (invite link).'} },

    // ════════════ FAMILY ════════════
    { id:'fam-login', level:'family', icon:'🔑', shot:9,
      t:{fr:'Connexion',en:'Login'},
      d:{fr:"L’entrée pour la famille et les skippers.",en:'The entry point for family and skippers.'},
      bullets:{fr:[
        'Email + <b>mot de passe</b>, ou <b>lien magique</b> par email.',
        '<b>Mot de passe oublié</b> → email de réinitialisation (les skippers sont prévenus).',
        'Sous-titre contextuel (mot de passe / lien / reset), retour à l’accueil.',

        en:[
        'Email + <b>password</b>, or email <b>magic link</b>.',
        '<b>Forgot password</b> → reset email (the skippers are notified).',
        'Context-aware subtitle (password / link / reset), back to home.',
        'The session stays active <b>for several weeks</b> on the same device.']},
      cap:{fr:'Écran de connexion.',en:'Login screen.'} },

    { id:'fam-dashboard', level:'family', icon:'🏡', shot:10,
      t:{fr:'Espace Famille',en:'Family space'},
      d:{fr:"Le tableau de bord après connexion (rôle famille).",en:'The dashboard after login (family role).'},
      bullets:{fr:[
        '<b>Position en direct</b> du bateau, et juste dessous <b>🦊 le mot du bord</b> (quelques lignes écrites par l’IA).',
        '<b>Cockpit</b> : un bandeau façon écran de barre (vitesse, vent, cap, fond) avec <b>● EN DIRECT</b> / <b>◐ DIFFÉRÉ</b> ; le toucher — ou l’onglet ⏱ Cockpit — ouvre le cadran de vent, tous les instruments et la trace des 24 h.',
        '<b>Dernières nouvelles</b> (posts famille + publics).',
        'Accès direct aux <b>messages</b> ; pastille de réponse non lue.',
        'Tuile <b>« Page publique »</b> → aperçu visiteur sans se déconnecter (?asVisitor=1).'],
        en:[
        '<b>Live position</b> of the boat, and just below <b>🦊 the word from the boat</b> (a few lines written by the AI).',
        '<b>Cockpit</b>: a helm-display strip (speed, wind, heading, depth) with <b>● LIVE</b> / <b>◐ DELAYED</b>; tapping it — or the ⏱ Cockpit tab — opens the wind dial, every instrument and the last 24 h track.',
        '<b>Latest news</b> (family + public posts).',
        'Direct access to <b>messages</b>; unread-reply dot.',
        '<b>"Public page"</b> tile → visitor preview without logging out (?asVisitor=1).']},
      cap:{fr:'Tableau de bord famille.',en:'Family dashboard.'} },

    { id:'fam-statusbar', level:'family', icon:'📶', shot:null,
      t:{fr:'Les pastilles d’état (sous le logo)',en:'The status chips (under the logo)'},
      d:{fr:"Sous le titre « wang'ap », quelques pastilles disent l’essentiel : vert = tout va bien, or = à surveiller, gris = éteint ou silencieux (souvent normal), rouge = il faut agir. Touche n’importe laquelle : la feuille « État » explique chaque ligne en mots, avec le lien vers le bon réglage.",
         en:"Under the wang'ap title, a few chips tell the essentials: green = all good, gold = worth watching, grey = off or silent (often normal), red = act. Tap any of them: the “Status” sheet explains each line in words, with a link to the right setting."},
      bullets:{fr:[
        '<b>📶 / 📴 Ce téléphone</b> : en ligne ou hors ligne (Wi-Fi / 5G quand le téléphone le dit — l’iPhone ne le dit pas). Pour la famille, la pastille dit aussi si tes messages sont partis ; un chiffre = en attente. Skipper : une pastille <b>bleue</b> en haut à gauche = GPS du téléphone qui enregistre.',
        '<b>⛵ Le bord</b> : vert = mesures en direct (&lt; 15 min), or = différé (normal en mer, Starlink coupé), gris = PC du bord éteint, rouge = le PC répond mais aucune mesure n’arrive.',
        '<b>👁 Public</b> (skipper) : le délai choisi par les skippers, écrit à côté (par exemple « 10 h »), « ✍️ » (positions à la main) ou « Direct » (or : le public voit la position du moment).',
        '<b>🔄 Synchro</b> (skipper) : le mode écrit — « Au large » (bleu), « Manuel », « Off » — ou le nombre d’envois en attente.'],
        en:[
        '<b>📶 / 📴 This phone</b>: online or offline (Wi-Fi / 5G when the phone tells — iPhone does not). For family the dot also tells whether your messages went out; a number = pending. Skipper: a <b>blue</b> dot top-left = phone GPS recording.',
        '<b>⛵ The boat</b>: green = live readings (&lt; 15 min), gold = delayed (normal at sea, Starlink off), grey = boat PC off, red = the PC answers but no reading arrives.',
        '<b>👁 Public</b> (skipper): the delay the skippers chose, written beside it (e.g. “10 h”), “✍️” (hand-placed positions) or “Direct” (gold: the public sees the current position).',
        '<b>🔄 Sync</b> (skipper): the mode written out — “Offshore” (blue), “Manual”, “Off” — or the number of pending sends.']},
      note:{fr:'La famille voit 2 pastilles (téléphone + le bord) ; le skipper en voit 4. Sur un petit écran, elles passent sur une deuxième ligne. L’AIS n’a plus de pastille : il est dans la feuille, sous « Le bord ».',en:'Family sees 2 chips (phone + boat); the skipper sees 4. On a small screen they wrap onto a second line. AIS no longer has a chip: it is in the sheet, under “The boat”.'} },

    { id:'fam-live', level:'family', icon:'⛵', shot:null,
      t:{fr:'Le direct : position et paramètres du bord',en:'Live: position and boat instruments'},
      d:{fr:"D’où viennent la position et les chiffres du bord, et ce que « en direct » veut vraiment dire.",
         en:'Where the position and the boat figures come from, and what “live” really means.'},
      bullets:{fr:[
        'À bord, un programme tourne sur le <b>PC de la table à cartes</b> (le « collecteur ») : il lit les instruments <b>une fois par minute</b>, les garde sur le disque et les envoie <b>toutes les 5 minutes</b> par Starlink.',
        '<b>« En direct » = il y a environ 5 minutes</b>, jamais à la seconde — et seulement quand le PC <b>et</b> Starlink sont allumés.',
        '🟢 <b>En direct</b> : dernière mesure il y a moins de 15 min · 🟡 <b>il y a X h</b> : dernières valeurs connues — <b>l’état normal en mer</b>, Starlink coupé · ⚪ <b>hors ligne</b> : plus de 6 h sans nouvelle (PC, Starlink ou instruments éteints).',
        'Rien n’est perdu pendant une coupure : tout part d’un coup au retour de la connexion, et la trace se complète.',
        '🟣 <b>ARCHIVE</b> : dans la TimeCapsule du Cockpit, vous regardez un moment passé.',
        '<b>Famille et skipper seulement</b> : le site public ne voit que la trace, avec le délai choisi par les skippers, jamais la position du moment, ni les instruments, ni la destination.'],
        en:[
        'On board, a program runs on the <b>chart-table PC</b> (the “collector”): it reads the instruments <b>once a minute</b>, keeps them on disk and sends them <b>every 5 minutes</b> over Starlink.',
        '<b>“Live” = about 5 minutes ago</b>, never to the second — and only while the PC <b>and</b> Starlink are on.',
        '🟢 <b>Live</b>: last reading under 15 min ago · 🟡 <b>X h ago</b>: last known values — <b>the normal state at sea</b>, Starlink off · ⚪ <b>offline</b>: over 6 h without news (PC, Starlink or instruments off).',
        'Nothing is lost during an outage: it all goes out at once when the link returns, and the track fills in.',
        '🟣 <b>ARCHIVE</b>: in the Cockpit’s TimeCapsule, you are looking at a past moment.',
        '<b>Family and skippers only</b>: the public site only sees the track, with the delay the skippers chose, never the current position, the instruments or the destination.']},
      note:{fr:'Une pastille « il y a 8 h » en pleine traversée n’est pas une panne : c’est Starlink coupé pour économiser l’énergie.',en:'A “8 h ago” dot mid-passage is not a failure: it is Starlink switched off to save power.'} },

    // ── V3.36.5 (23 Oct.) — the Cockpit and what came with it ──
    { id:'fam-cockpit', level:'family', icon:'⏱', shot:null,
      t:{fr:'Le Cockpit',en:'The Cockpit'},
      d:{fr:"Les instruments du bateau, comme à la barre — en petit. Onglet ⏱ Cockpit (famille), ou le menu de l’avatar / la Carte (skippers).",en:'The boat’s instruments, as at the helm — in miniature. The ⏱ Cockpit tab (family), or the avatar menu / the Map (skippers).'},
      bullets:{fr:[
        'En haut, un mot : <b>● EN DIRECT</b> (vert, mesure de moins de 15 min), <b>◐ DIFFÉRÉ</b> (or, les dernières valeurs connues — normal en mer quand Starlink est coupé), <b>◷ ARCHIVE</b> (violet, un moment passé dans la TimeCapsule).',
        '<b>Le cadran de vent</b> et les <b>tuiles</b> : vitesses, route et cap, profondeur, températures, pression, gîte, loch…',
        '<b>La mini-carte</b> : son bouton passe de « Vue proche » à « Destination » puis à « Tout le passage ».',
        '<b>Les graphiques</b> : touchez-en un, puis glissez le doigt à gauche ou à droite pour déplacer la barre du temps.',
        '<b>◷ La TimeCapsule</b> : remonter le temps — −1 j, −1 h, 📅, +1 h, +1 j ; « Direct » ramène au présent.',
        '<b>⚑ Destination</b> : le point de route actif du traceur B&amp;G — distance, relèvement, arrivée. « Pas de route active sur le traceur » quand il n’y en a pas. Famille et skippers seulement, jamais les voileux ni le public.'],
        en:[
        'At the top, one word: <b>● LIVE</b> (green, reading under 15 min old), <b>◐ DELAYED</b> (gold, the last known values — normal at sea when Starlink is off), <b>◷ ARCHIVE</b> (purple, a past moment in the TimeCapsule).',
        '<b>The wind dial</b> and the <b>tiles</b>: speeds, course and heading, depth, temperatures, pressure, heel, log…',
        '<b>The mini map</b>: its button switches from “Close view” to “Destination” then to “Whole passage”.',
        '<b>The charts</b>: tap one, then slide your finger left or right to move the time bar.',
        '<b>◷ The TimeCapsule</b>: go back in time — −1 d, −1 h, 📅, +1 h, +1 d; “Live” brings you back to now.',
        '<b>⚑ Destination</b>: the active waypoint of the B&amp;G plotter — distance, bearing, arrival. “No active route on the plotter” when there is none. Family and skippers only, never sailors or the public.']},
      note:{fr:'« Différé » en pleine traversée n’est pas une panne : Starlink est coupé pour économiser l’énergie.',en:'“Delayed” mid-passage is not a failure: Starlink is off to save power.'} },

    { id:'fam-mot', level:'family', icon:'🦊', shot:null,
      t:{fr:'Le mot du bord',en:'Word from the boat'},
      d:{fr:"Deux ou trois lignes sur la navigation, écrites par une IA (Claude) à partir des données du bateau.",en:'Two or three lines about the sailing, written by an AI (Claude) from the boat’s data.'},
      bullets:{fr:[

        'Marqué <b>« ✨ écrit par l’IA »</b> — sauf si un skipper l’a réécrit.',
        'Dans le <b>Cockpit</b> : ‹ › pour lire les précédents, « ⏭ Le dernier » (vert) pour revenir au plus récent ; dans la TimeCapsule, « ⏱ À l’instant » (violet) = le mot de ce moment-là.',
        'Sur l’<b>Accueil famille</b>, sous « Position en direct ». Le public lit une version en différé, sans position ni destination.'],
        en:[

    { id:'fam-map', level:'family', icon:'⭐', shot:null,
      t:{fr:'La Carte (famille)',en:'The Map (family)'},
      d:{fr:"Le voyage sur une carte qu’on touche (menu ⭐ / 🗺️).",en:'The voyage on a map you can touch (menu ⭐ / 🗺️).'},
      bullets:{fr:[
        '<b>Calques</b> : type de carte (Classique, Marine, Satellite), <b>Filtre</b> par chapitre et étape (dans l’ordre des dates), <b>Météo</b>.',
        '<b>Trace</b> : Posts, <b>Médias</b> (les photos de la galerie, interrupteur à part), Trace, Plan, Voilure, Barbules, POI, ⚑ Destination ; <b>Couleur de la trace</b>, avec des « ? » qui expliquent.',
        '<b>Météo</b> : prévision sur 7 jours avec un curseur ; « Couleurs » colore la carte ; « Détail au toucher » : touchez n’importe où pour le vent et les vagues de ce point dans le temps.',
        '<b>Touchez la trace</b> : un petit compas de poche — la route (aiguille), la flèche du vent, la vitesse, le chapitre · l’étape.',
        '<b>En bas à droite</b> : les instruments (le même compas pour la dernière position du bateau, le feu du bord et le lien ⏱ Cockpit) et le bouton de vue : « Vue large » → « Étape en cours » → « Le bateau ».'],
        en:[
        '<b>Layers</b>: map type (Default, Nautical, Satellite), <b>Filter</b> by chapter and leg (in date order), <b>Weather</b>.',
        '<b>Track</b>: Posts, <b>Media</b> (the gallery photos, a separate switch), Track, Plan, Sails, Wind barbs, POI, ⚑ Destination; <b>Track colour</b>, with “?” explanations.',
        '<b>Weather</b>: 7-day forecast with a slider; “Colours” tints the map; “Detail on tap”: tap anywhere for the wind and waves at that spot over time.',
        '<b>Tap the track</b>: a small pocket compass — the course (needle), the wind arrow, the speed, the chapter · leg.',
        '<b>Bottom right</b>: the instruments (the same compass for the boat’s latest position, the boat light and the ⏱ Cockpit link) and the view button: “Wide view” → “Current stage” → “The boat”.']} },

      bullets:{fr:[
        'Ouverture : <b>« + Nouvelle entrée »</b> (Timeline) ou <b>long-press</b> sur la carte (pré-remplit lat/lon + étape).',
        '<b>Chapitre</b> (auto-sélectionne le dernier), <b>titre</b>, <b>corps</b> (texte simple), <b>étape</b> (auto selon la date).',

        '<b>Publier</b> ou <b>Brouillon</b> ; écriture hors-ligne (file de synchro) ; ✏️ modifier / 🗑 supprimer (photos et vidéos vont à la corbeille, récupérables 30 jours).'],
        en:[
        'Open: <b>"+ New entry"</b> (Timeline) or <b>long-press</b> on the map (pre-fills lat/lon + leg).',
        '<b>Chapter</b> (auto-selects the latest), <b>title</b>, <b>body</b> (plain text), <b>leg</b> (auto by date).',
        '<b>Photos</b>: multi-add, 3-size compression, HEIC→JPG; <b>videos</b>: poster generated at 0.5 s.',
        '<b>Geolocation</b>: phone GPS, photo EXIF, or long-press map.',
        '<b>Visibility</b> 🌍/❤️/🔒, <b>category</b> (9), multiple <b>tags</b>.',
        '<b>Navigation</b> block (route, distance, speed, heading, point of sail, sails, reefs), <b>Conditions</b> (wind force/direction, sea, swell, barometer, temperatures, visibility, sky), <b>Technical</b> (engine hours, fuel, water, batteries, solar, incidents).',
        '<b>Publish</b> or <b>Draft</b>; offline writing (sync queue); ✏️ edit / 🗑 delete (photos and videos go to the bin, recoverable for 30 days).']},
      cap:{fr:'Compositeur + blocs journal de bord.',en:'Composer + logbook blocks.'} },

    { id:'sk-mapedit', level:'skipper', icon:'✂️', shot:19,
      t:{fr:'Carte : affichage & édition de la trace',en:'Map: display & track editing'},
      d:{fr:"Choisir ce qu’on affiche, puis corriger et nettoyer la trace GPS.",en:'Choose what is shown, then fix and clean the GPS track.'},
      bullets:{fr:[
        '<b>Le panneau</b> : Calques et Trace comme pour la famille (voir « La Carte »), plus un troisième onglet, <b>Outils</b>, pour les skippers.',
        '<b>📍 Marquer un point</b> : la position du bateau est notée après confirmation ; <b>Outils → Points marqués</b> pour les revoir, les déplacer ou les supprimer.',
        '<b>⚑ Destination</b> (onglet Trace) : le point de route actif du traceur B&amp;G, sur la carte.',
        'Dans la bulle d’un point de trace, un <b>petit badge</b> (icône + mot) dit d’où vient le point : instruments du bord, AIS, téléphone, fichier GPX, manuel…',
        'Bouton <b>✂️ Édition tracé</b> (Outils) : les waypoints deviennent des cercles cliquables.',
        '<b>Glisser</b> un waypoint pour le repositionner ; tap = sélection, second tap = sélection d’une <b>plage</b>.',
        '<b>Supprimer en lot</b> : batché par 200 (limite PostgREST), toast de résultat (vert / orange partiel / rouge).',
        '<b>Forcer une étape</b> sur la sélection ; <b>décaler les dates</b> d’une période.',
        '<b>Créer une nouvelle trace</b> à la main, point par point (source = manual, dates interpolées), quand la balise a manqué une portion.',
        '<b>Simplifier la trace</b> (Douglas-Peucker) avec aperçu et <b>annulation</b> pendant quelques secondes.',
        '<b>Réglages → 🛠 Trace : visualisation et maintenance</b> : <b>tolérance de simplification au zoom</b> (optimisation du rendu — moins de points au zoom faible), <b>détection des coupures</b> (la trace se scinde en segments, les « lignes de rupture », dès que l’écart de temps dépasse N h ou la vitesse implicite N nœuds), et historique de maintenance des waypoints.'],
        en:[
        '<b>The panel</b>: Layers and Track as for the family (see “The Map”), plus a third tab, <b>Tools</b>, for the skippers.',
        '<b>📍 Mark a point</b>: the boat’s position is noted after you confirm; <b>Tools → Marked points</b> to review, move or delete them.',
        '<b>⚑ Destination</b> (Track tab): the active waypoint of the B&amp;G plotter, on the map.',
        'In a track point’s bubble, a <b>small badge</b> (icon + word) tells where the point comes from: boat instruments, AIS, phone, GPX file, manual…',
        '<b>✂️ Edit track</b> button (Tools): waypoints become tappable circles.',
        '<b>Drag</b> a waypoint to reposition; tap = select, second tap = select a <b>range</b>.',
        '<b>Bulk delete</b>: batched in 200s (PostgREST limit), result toast (green / orange partial / red).',
        '<b>Force a leg</b> on the selection; <b>shift dates</b> of a period.',
        '<b>Create a new track</b> by hand, point by point (source = manual, interpolated dates), when the tracker missed a section.',
        '<b>Simplify the track</b> (Douglas-Peucker) with a preview and <b>undo</b> for a few seconds.',
        '<b>Settings → 🛠 Track: visualisation &amp; maintenance</b>: <b>zoom simplification tolerance</b> (render optimisation — fewer points at low zoom), <b>gap detection</b> (the track splits into segments, the "break lines", once the time gap exceeds N h or implied speed N knots), and waypoint maintenance history.']},
      cap:{fr:'Carte en mode édition tracé.',en:'Map in track-edit mode.'} },

    { id:'sk-marks', level:'skipper', icon:'📍', shot:20,
      t:{fr:'Marks & points d’intérêt',en:'Marks & points of interest'},
      d:{fr:"Annoter la carte de repères utiles.",en:'Annotate the map with useful markers.'},
      bullets:{fr:[
        'Poser des <b>marks</b> personnels : mouillages, ports, points d’intérêt.',
        '<b>Couches POI</b> filtrables : mouillages, marinas, fuel, restos, plongée.',
        'Couche 📍 Marks activable comme les autres calques.'],
        en:[
        'Drop personal <b>marks</b>: anchorages, ports, points of interest.',
        'Filterable <b>POI layers</b>: anchorages, marinas, fuel, food, diving.',
        '📍 Marks layer toggled like the other layers.']},
      cap:{fr:'Couche Marks / POIs.',en:'Marks / POI layer.'} },

    { id:'sk-chapters', level:'skipper', icon:'📚', shot:21,
      t:{fr:'Chapitres, étapes & visibilité',en:'Chapters, legs & visibility'},
      d:{fr:"Organiser le voyage en chapitres et étapes.",en:'Organise the voyage into chapters and legs.'},
      bullets:{fr:[
        'Hiérarchie : <b>Chapitre</b> (mois/région) → <b>Étape</b> (port → port) → posts + waypoints.',
        'Réglages → <b>📚 Chapitres</b> : créer, renommer, <b>réordonner ▲▼</b>, choisir la couleur, supprimer (confirmation).',
        'Réglages → <b>🚢 Étapes</b> : nom (Port A → Port B), chapitre parent, ports de départ/arrivée, dates prévues. Les dates fixent l’assignation par défaut des nouveaux posts.',
        '<b>Suppression sûre</b> : les posts/waypoints orphelins tombent dans « Non classés » (chapitre/étape sentinelle immuable) — jamais perdus.',
        '<b>Masquer un chapitre</b> (œil barré) : disparaît de l’app, mais reste lisible par les sauvegardes, l’archive, les stats et le Renard (visibilité, pas confidentialité).'],
        en:[
        'Hierarchy: <b>Chapter</b> (month/region) → <b>Leg</b> (port → port) → posts + waypoints.',
        'Settings → <b>📚 Chapters</b>: create, rename, <b>reorder ▲▼</b>, pick the colour, delete (confirm).',
        'Settings → <b>🚢 Legs</b>: name (Port A → Port B), parent chapter, start/end ports, planned dates. Dates set the default assignment of new posts.',
        '<b>Safe delete</b>: orphan posts/waypoints fall into "Unsorted" (immutable sentinel chapter/leg) — never lost.',
        '<b>Hide a chapter</b> (eye-off): disappears from the app, but stays readable by backups, the archive, stats and Le Renard (visibility, not privacy).']},
      cap:{fr:'Chapitres & étapes + toggle visibilité.',en:'Chapters & legs + visibility toggle.'} },

    { id:'sk-position', level:'skipper', icon:'🎯', shot:22,
      t:{fr:'Position manuelle & visibilité publique',en:'Manual position & public visibility'},
      d:{fr:"Maîtriser ce que voient les visiteurs.",en:'Control what visitors see.'},
      bullets:{fr:[
        '<b>Position manuelle 🎯</b> (Réglages → Navigation & position) : poser un point précis quand rien ne passe (AIS ou PC éteint). Elle prévient la famille ; le public, lui, ne la voit qu’après le délai public, comme la trace.',
        '<b>Visibilité publique</b> : afficher la position <b>en direct</b>, <b>différée</b> (avec délai) ou <b>figée</b> pour le public. Une position manuelle attend le même délai que la trace avant d’être montrée au public.',
        'Famille et skippers voient la position réelle ; le public voit la version choisie — <b>par audience, pas par hasard</b>.'],
        en:[
        '<b>Manual position 🎯</b> (Settings → Navigation & position): drop a precise point when nothing gets through (AIS or PC off). It notifies family; the public only sees it after the public delay, like the track.',
        '<b>Public visibility</b>: show the position <b>live</b>, <b>delayed</b> (with a buffer) or <b>frozen</b> for the public. A manual position waits for the same delay as the track before the public sees it.',
        'Family and skippers see the real position; the public sees the chosen version — <b>per audience, by design</b>.']},
      cap:{fr:'Position manuelle + visibilité publique.',en:'Manual position + public visibility.'} },

    { id:'sk-ais', level:'skipper', icon:'📡', shot:23,
      t:{fr:'AIS — suivi en direct',en:'AIS — live tracking'},
      d:{fr:"La configuration du suivi automatique du bateau.",en:'The automatic boat-tracking configuration.'},
      bullets:{fr:[
        '<b>Bateau suivi</b> : nom, MMSI (9 chiffres), indicatif, pavillon, <b>fournisseur</b> (aisstream), <b>clé API</b> — partagé entre tous les skippers.',
        '<b>État du worker</b> : Éteint / En attente du 1er message / Actif (N min) / Inactif / Limité (réessai auto) / Erreur.',
        '<b>Flux DB</b> : pastille verte ≤ 10 min, gold ≤ 60 min, rouge au-delà — confirme l’écriture en base.',
        '<b>Filtre anti-jitter</b> (rejette les points trop proches) réglable en avancé ; <b>pause manuelle</b> au port.'],
        en:[
        '<b>Tracked boat</b>: name, MMSI (9 digits), call sign, flag, <b>provider</b> (aisstream), <b>API key</b> — shared across all skippers.',
        '<b>Worker status</b>: Off / Waiting for 1st message / Active (N min) / Inactive / Rate-limited (auto retry) / Error.',
        '<b>DB feed</b>: green ≤ 10 min, gold ≤ 60 min, red beyond — confirms writes to the database.',
        '<b>Anti-jitter filter</b> (rejects points too close together) tunable in advanced; <b>manual pause</b> in port.']},
      note:{fr:'Le silence AIS au port est normal. Seul un Flux DB rouge en mer (bateau en marche) est suspect.',en:'AIS silence in port is normal. Only a red DB feed at sea (boat under way) is suspicious.'},
      cap:{fr:'Config AIS + état + Flux DB.',en:'AIS config + status + DB feed.'} },

    { id:'sk-collecteur', level:'skipper', icon:'📡', shot:null,
      t:{fr:'Collecteur du bord (PC de bord)',en:'Onboard collector (boat PC)'},
      d:{fr:"Réglages → Navigation & position → 📡 Collecteur du bord : la santé du programme qui envoie les instruments.",en:'Settings → Navigation & position → 📡 Onboard collector: the health of the program that sends the instruments.'},
      bullets:{fr:[
        '<b>Bandeau de santé</b> : OK / à surveiller / problème, avec les raisons (source déconnectée, erreurs, clé refusée, pause, rapport trop ancien).',
        '<b>Version à bord</b> et dernier contact, <b>Internet (Starlink)</b>, envois du jour, phrases en attente sur le disque, sources connectées (passerelle Yacht Devices + processeur B&amp;G).',
        '<b>Erreurs</b> avec leur ligne exacte, et les <b>dernières lignes d’activité</b> du PC — de quoi corriger depuis la terre sans rien demander à bord.',
        'Sur le PC : <b>une icône près de l’horloge</b> (vert = envois OK, orange = instruments muets ou Internet coupé, bleu = pause, rouge = clé refusée). Survol = bulle d’état ; clic = fenêtre de suivi (la fermer la cache seulement) ; clic droit = <b>pause / redémarrer / quitter</b>. Il démarre tout seul avec Windows.'],
        en:[
        '<b>Health banner</b>: OK / watch / problem, with the reasons (source disconnected, errors, key refused, paused, report too old).',
        '<b>Version aboard</b> and last contact, <b>Internet (Starlink)</b>, today’s sends, sentences waiting on disk, connected sources (Yacht Devices gateway + B&amp;G processor).',
        '<b>Errors</b> with their exact line, and the PC’s <b>latest activity lines</b> — enough to fix things from ashore without asking anything aboard.',
        'On the PC: <b>an icon by the clock</b> (green = sends OK, orange = instruments quiet or Internet down, blue = paused, red = key refused). Hover = status bubble; click = monitor window (closing it only hides it); right-click = <b>pause / restart / quit</b>. It starts by itself with Windows.']},
      note:{fr:'Le PC éteint = pas de direct, mais la trace n’a plus de trous : au retour du PC, il renvoie ce que la passerelle Yacht Devices a gardé dans son journal ; si le PC est éteint mais Starlink allumé, le nuage Yacht Devices donne la position avec 15 à 30 min de retard. Les mesures du direct passent toujours en premier.',en:'PC off = no live feed, but the track no longer has gaps: when the PC comes back it sends what the Yacht Devices gateway kept in its log; if the PC is off but Starlink is on, the Yacht Devices cloud gives the position 15 to 30 min late. The live readings always win.'} },

    // ── V3.36.5 (23 Oct.) ──
    { id:'sk-voileux', level:'skipper', icon:'⛵', shot:null,
      t:{fr:'Accès voileux, mot du bord & discussion du carré',en:'Sailor access, word from the boat & saloon talk'},
      d:{fr:"Réglages → Accès voileux : tout ce que voient les amis voileux, et les deux nouveautés du Cockpit.",en:'Settings → Sailor access: everything your sailing friends see, and the two new Cockpit features.'},
      bullets:{fr:[
        '<b>Les liens voileux</b> : pour chacun, le décalage du direct, la fenêtre de la TimeCapsule et la durée du lien — des menus déroulants. Jamais la destination, rien du journal.',
        '<b>« 🔔 Prévenir quand un passage commence »</b> : l’email « Wang’ap reprend la mer », seulement quand le bateau repart après au moins 4 h au mouillage. <b>Le flux</b> ON/OFF coupe tout d’un geste.',
        '<b>🦊 Le mot du bord</b> ON/OFF, et ⚙️ Réglages : fréquence (4, 6, 8, 12 ou 24 h), modèle, version publique, « ✍️ Écrire maintenant ». Dans le Cockpit, sur la ligne d’un mot : ✎ le réécrire, 🗑 le supprimer.',
        '<b>💬 La discussion du carré</b> ON/OFF. Les messages arrivent aussi dans la boîte de réception, onglet ⏲ Cockpit, d’où l’on répond.',
        'Dans le <b>menu de l’avatar</b>, deux interrupteurs façon iPhone : « Au large » et « Flux voileux ».'],
        en:[
        '<b>Sailor links</b>: for each friend, the delay on the live feed, the TimeCapsule window and the link expiry — drop-down menus. Never the destination, nothing from the journal.',
        '<b>“🔔 Warn when a passage starts”</b>: the “Wang’ap sets sail again” email, only when the boat leaves after at least 4 h at anchor. <b>The feed</b> ON/OFF cuts everything at once.',
        '<b>🦊 Word from the boat</b> ON/OFF, and ⚙️ Settings: frequency (4, 6, 8, 12 or 24 h), model, public version, “✍️ Write now”. In the Cockpit, on a word’s line: ✎ rewrite it, 🗑 delete it.',
        '<b>💬 Saloon talk</b> ON/OFF. Messages also land in the inbox, ⏲ Cockpit tab, where you reply.',
        'In the <b>avatar menu</b>, two iPhone-style switches: “Offshore” and “Sailor feed”.']} },

    { id:'sk-legend', level:'skipper', icon:'⏩', shot:null,
      t:{fr:'« La fin de l’étape approche »',en:'“The end of the leg is near”'},
      d:{fr:"Un rappel quand l’étape en cours se termine aujourd’hui ou demain (ou que des points n’ont pas d’étape).",en:'A reminder when the current leg ends today or tomorrow (or when points have no leg).'},
      bullets:{fr:[
        '<b>⏩ Prolonger de 2 jours</b> : l’étape est prolongée, et le chapitre aussi s’il le faut.',
        '<b>📚 Chapitres et étapes</b> : ouvrir les réglages pour faire autrement.',
        '<b>Plus tard</b> : ne plus le montrer jusqu’à demain, sur cet appareil seulement.'],
        en:[
        '<b>⏩ Extend by 2 days</b>: the leg is extended, and the chapter too if needed.',
        '<b>📚 Chapters and legs</b>: open the settings to do it differently.',
        '<b>Later</b>: hide it until tomorrow, on that device only.']},
      note:{fr:'Sans étape, les points de trace et les nouveaux récits de ces jours-là ne seraient rangés nulle part.',en:'Without a leg, the track points and new stories of those days would be filed nowhere.'} },

    { id:'sk-gallery-upload', level:'skipper', icon:'📷', shot:null,
      t:{fr:'Envoyer des photos à la galerie',en:'Sending photos to the gallery'},
      d:{fr:"Galerie → envoyer (ou Composer → 📷 Médias) : sans écrire de post.",en:'Gallery → send (or Compose → 📷 Media): without writing a post.'},
      bullets:{fr:[
        '<b>Datée</b> d’après la photo elle-même, ou la date que vous indiquez.',
        '<b>Rangée</b> dans le bon chapitre et la bonne étape.',
        '<b>Placée</b> sur la carte : GPS de la photo, sinon la trace à cette heure-là, sinon la dernière position du bateau. Elle apparaît avec l’interrupteur « Médias » de la carte.'],
        en:[
        '<b>Dated</b> from the photo itself, or the date you enter.',
        '<b>Filed</b> in the right chapter and leg.',
        '<b>Placed</b> on the map: the photo’s GPS, else the track at that time, else the boat’s last position. It shows with the map’s “Media” switch.']} },

    { id:'sk-maintenance', level:'skipper', icon:'🔧', shot:24,
      t:{fr:'Carnet de maintenance (Tech)',en:'Maintenance log (Tech)'},
      d:{fr:"Le suivi technique du bateau (menu 🐘 / 🔧).",en:'The boat’s technical tracking (menu 🐘 / 🔧).'},
      bullets:{fr:[
        '<b>Nouvelle intervention</b> : titre, catégorie (12 : moteur, voiles, électricité, plomberie, électronique, gréement, sécurité, coque, dessalinisateur, solaire, frigo, autre), description, heures moteur, pièces, coût, date.',
        '<b>Historique</b> chronologique filtrable par catégorie + recherche + badge de date flottant.',
        '<b>Statistiques</b> : nombre d’interventions, dernière vidange, heures moteur cumulées, prochaine échéance + alertes.',
        'Lit aussi le bloc Technique des posts ; ✏️ modifier une entrée.'],
        en:[
        '<b>New job</b>: title, category (12: engine, sails, electrical, plumbing, electronics, rigging, safety, hull, watermaker, solar, fridge, other), description, engine hours, parts, cost, date.',
        '<b>History</b> chronological, filterable by category + search + floating date badge.',
        '<b>Stats</b>: number of jobs, last oil change, total engine hours, next-due + alerts.',
        'Also reads posts’ Technical block; ✏️ edit an entry.']},
      cap:{fr:'Carnet de maintenance + stats.',en:'Maintenance log + stats.'} },

    { id:'sk-todos', level:'skipper', icon:'✅', shot:25,
      t:{fr:'To-dos',en:'To-dos'},
      d:{fr:"La liste des choses à faire (onglet « À faire » de Tech).",en:'The to-do list (Tech "To-do" tab).'},
      bullets:{fr:[
        '<b>Nouvelle todo</b> : titre, description, <b>priorité</b> (4 niveaux), étape associée, <b>date butoir</b>.',
        '<b>Cocher / décocher</b> (texte barré + opacité), <b>alerte de retard</b>.',
        'Swipe gauche (mobile) ou 🗑 pour supprimer.',
        'Prospectif (à faire) — par opposition au carnet, rétrospectif (fait).'],
        en:[
        '<b>New to-do</b>: title, description, <b>priority</b> (4 levels), associated leg, <b>due date</b>.',
        '<b>Check / uncheck</b> (struck-through + dimmed), <b>overdue warning</b>.',
        'Swipe left (mobile) or 🗑 to delete.',
        'Prospective (to do) — vs the log, retrospective (done).']},
      cap:{fr:'Liste de to-dos.',en:'To-do list.'} },

    { id:'sk-renard', level:'skipper', icon:'🦊', shot:26,
      t:{fr:'Le Renard — assistant IA',en:'Le Renard — AI assistant'},
      d:{fr:"Poser des questions techniques sur le bateau.",en:'Ask technical questions about the boat.'},
      bullets:{fr:[
        'Question en langage naturel → <b>réponse en streaming</b> (mot à mot), rendu Markdown.',
        '<b>Sources</b> sous chaque réponse : chips sable (manuels/textes) et chips or 🎬 (vidéos handover) avec <b>deep-link au timecode</b> dans Drive.',
        '<b>Bascule Haiku</b> (rapide, ~centimes) <b>/ Sonnet</b> (réfléchi, ~10×) + compteur de tokens.',
        '<b>Mode hors-ligne</b> 🟢/🟡 : recherche plein-texte locale dans la base, sans Claude — utile en mer.',
        '<b>Fils de conversation</b> conservés (mémoire).'],
        en:[
        'Natural-language question → <b>streamed answer</b> (word by word), Markdown rendering.',
        '<b>Sources</b> under each answer: sand chips (manuals/texts) and gold 🎬 chips (handover videos) with a <b>deep-link to the timecode</b> in Drive.',
        '<b>Haiku</b> (fast, ~cents) <b>/ Sonnet</b> (thorough, ~10×) toggle + token counter.',
        '<b>Offline mode</b> 🟢/🟡: local full-text search in the base, no Claude — useful at sea.',
        '<b>Conversation threads</b> kept (memory).']},
      cap:{fr:'Chat du Renard + bande Sources.',en:'Le Renard chat + Sources bar.'} },

    { id:'sk-renard-admin', level:'skipper', icon:'📚', shot:27,
      t:{fr:'Base de connaissances du Renard',en:'Le Renard knowledge base'},
      d:{fr:"Nourrir l’assistant (page /renard/admin).",en:'Feed the assistant (the /renard/admin page).'},
      bullets:{fr:[
        '<b>Uploader un manuel</b> PDF/TXT/MD/HTML avec un <b>thème</b> (moteur, voiles…) + une <b>source</b> (outremer-officiel, vendor, communauté, littérature, wangap-app) ; indexation avec barre de progression (parsing → découpage → upload).',
        '<b>Ingérer une vidéo handover</b> depuis Drive : transcription Whisper côté serveur (GitHub Action), découpée en chunks horodatés. Guidelines : un sujet/vidéo, ≤ 10 min, ré-énoncer le contexte à l’oral.',
        '<b>Backfill d’embeddings</b> (vectorisation pgvector, idempotent).',
        '<b>Base indexée</b> : documents (type, nb de chunks, source, 🗑) + travaux d’ingestion ; listes complètes /documents et /ingests.'],
        en:[
        '<b>Upload a manual</b> PDF/TXT/MD/HTML with a <b>theme</b> (engine, sails…) + a <b>source</b> (outremer-official, vendor, community, literature, wangap-app); indexing with a progress bar (parsing → chunking → upload).',
        '<b>Ingest a handover video</b> from Drive: server-side Whisper transcription (GitHub Action), split into timecoded chunks. Guidelines: one subject/video, ≤ 10 min, re-state context aloud.',
        '<b>Embeddings backfill</b> (pgvector vectorisation, idempotent).',
        '<b>Indexed base</b>: documents (type, chunk count, source, 🗑) + ingestion jobs; full lists /documents and /ingests.']},
      cap:{fr:'Administration de la base de connaissances.',en:'Knowledge base administration.'} },

    { id:'sk-newsletter', level:'skipper', icon:'📧', shot:28,
      t:{fr:'Newsletter — composer & envoyer',en:'Newsletter — compose & send'},
      d:{fr:"Préparer et diffuser une newsletter (onglet de la boîte Liens).",en:'Prepare and send a newsletter (a tab in the Bonds inbox).'},
      bullets:{fr:[
        '<b>Composition par sections</b> : titre, collage photo (grille avec suggestions IA), carte auto-générée, métriques (distance/jours/escales/posts/photos/vitesse max), texte (éditeur TipTap), équipage (filtré sur la période).',
        '<b>Sélecteur de posts</b> par période avec chips de visibilité (🌍/💛/🔒, privé masqué par défaut) + aperçu rapide.',
        '<b>Brouillon IA</b> Sonnet/Opus avec formulaire multi-champs (titre, thème, ton, style, longueur, audience).',
        '<b>Envoyer un test à moi</b> (vrai email via Resend), puis <b>envoi en masse</b> aux abonnés (lots de 50/min).',
        '<b>Abonnés</b> (ajout/édition/suppression + nb de newsletters reçues), <b>brouillons</b> & envoyées, <b>archive publique</b> /newsletters.',
        '<b>Rappel automatique</b> (cron) si trop longtemps sans envoi avec assez de nouveaux posts.'],
        en:[
        '<b>Section-based composition</b>: title, photo collage (grid with AI suggestions), auto-generated map, metrics (distance/days/stops/posts/photos/max speed), text (TipTap editor), crew (filtered to the period).',
        '<b>Post selector</b> by period with visibility chips (🌍/💛/🔒, private hidden by default) + quick preview.',
        '<b>AI draft</b> Sonnet/Opus with a multi-field form (title, theme, tone, style, length, audience).',
        '<b>Send a test to me</b> (real email via Resend), then <b>mass-send</b> to subscribers (batches of 50/min).',
        '<b>Subscribers</b> (add/edit/delete + count received), <b>drafts</b> & sent, <b>public archive</b> /newsletters.',
        '<b>Automatic reminder</b> (cron) after too long without a send with enough new posts.']},
      note:{fr:'L’envoi en masse reste bloqué tant que le domaine d’envoi n’est pas vérifié (étape DNS V2.5). Le test fonctionne déjà.',en:'Mass-send stays blocked until the sending domain is verified (V2.5 DNS step). The test send already works.'},
      cap:{fr:'Compositeur de newsletter par sections.',en:'Section-based newsletter composer.'} },

    { id:'sk-livreor-admin', level:'skipper', icon:'🖋️', shot:29,
      t:{fr:"Livre d'Or — administration",en:'Guest Book — administration'},
      d:{fr:"Inviter et modérer les contributions.",en:'Invite and moderate contributions.'},
      bullets:{fr:[
        '<b>Inviter un équipier</b> via un lien à usage unique (token) — il contribue sans compte ; gestion des équipiers sur une page dédiée.',
        '<b>File de modération</b> : approuver ou écarter chaque contribution (modale de confirmation).',
        'Choisir la <b>visibilité</b> (public / famille) de chaque entrée validée.',
        'Indicateur ⭐ dans l’en-tête quand une contribution attend.'],
        en:[
        '<b>Invite a crew member</b> via a single-use link (token) — they contribute without an account; crew managed on a dedicated page.',
        '<b>Moderation queue</b>: approve or dismiss each contribution (confirmation modal).',
        'Set the <b>visibility</b> (public / family) of each approved entry.',
        '⭐ indicator in the header when a contribution is waiting.']},
      cap:{fr:"Modération du Livre d'Or + invitations.",en:'Guest Book moderation + invites.'} },

    { id:'sk-backup', level:'skipper', icon:'💾', shot:30,
      t:{fr:'Sauvegarde, archive, accès & maintenance',en:'Backup, archive, access & maintenance'},
      d:{fr:"Les outils d’exploitation, dans les Réglages (admin).",en:'The operational tools, in Settings (admin).'},
      bullets:{fr:[
        '<b>Tout exporter</b> : toutes les tables (JSON) + photos (sm/md/lg) + waypoints → zip Google Drive (manuel + cron dimanche 03:00 UTC). Historique sur /backups.',
        '<b>Snapshot archive</b> : régénère <b>archive.wangap.fr</b> (version statique long-terme et immuable) — cron lundi 03:00 UTC. Historique sur /archives.',
        '<b>Gestion des accès</b> : promouvoir un utilisateur (famille / admin), désactiver un compte (comptes fondateurs protégés).',
        '<b>Maintenance technique</b> : « Forcer la mise à jour » (vide le cache du Service Worker), version de l’app, backfill des variantes photo.',
        '<b>📷 Récupérer les originaux</b> : les photos dont il manque la version pleine résolution (publiées avant le 26 septembre, ou écrasées par un bug en septembre–octobre, corrigé) — à rattacher une par une depuis le téléphone, tant que la pellicule n’est pas vidée.',
        '<b>Cohérence du trace</b> : maintenant dans Navigation & position ; la trace est aussi rangée toute seule chaque nuit.'],

  let lang='fr', tab='all';
  function setLang(l){
    lang=(l==='en')?'en':'fr';
    localStorage.setItem('lang', lang);
    document.documentElement.lang=lang;
    document.getElementById('lang-fr').classList.toggle('active', lang==='fr');
    document.getElementById('lang-en').classList.toggle('active', lang==='en');
    applyChrome(); render();
  }
  function applyChrome(){
    const u=UI[lang];
    document.querySelector('[data-i18n="subtitle"]').textContent=u.subtitle;
    document.querySelector('[data-i18n="backApp"]').textContent=u.backApp;
    document.getElementById('q').placeholder=u.searchPlaceholder;
    document.getElementById('lead').textContent=u.lead;
    document.getElementById('footerLinks').innerHTML=u.footerLinks;
    document.getElementById('footerNote').textContent=u.footerNote;
    const tabsEl=document.getElementById('tabs'); tabsEl.innerHTML='';
    ['all','public','family','skipper'].forEach(k=>{
      const b=document.createElement('button');
      b.className='tab'+(tab===k?' active':'');
      b.textContent=u.tabs[k];
      b.onclick=()=>{ tab=k; document.getElementById('q').value=''; applyChrome(); render(); };
      tabsEl.appendChild(b);
    });
  }
  function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  // bullets may contain trusted <b> tags from our own data — allow them through.
  // A few bullets were written with entities (B&amp;G, &lt; 15 min, &nbsp;): decode
  // them first, or esc() shows them literally (« B&amp;G » on screen).
  function unent(s){ return s.replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'); }
  function bul(s){ return esc(unent(s)).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>'); }
  function cardHtml(s){
    const u=UI[lang];
    const lvlLabel=u.tabs[s.level].replace(/^[^\s]+\s/,'');
    let html=`<div class="card">`;
    html+=`<h3><span class="icon">${s.icon}</span>${esc(s.t[lang])} <span class="badge ${s.level}">${esc(lvlLabel)}</span></h3>`;
    html+=`<p class="desc">${esc(s.d[lang])}</p>`;
    if(s.bullets){ html+='<ul>'+s.bullets[lang].map(b=>`<li>${bul(b)}</li>`).join('')+'</ul>'; }
    if(s.note){ html+=`<p class="note">ℹ️ ${esc(s.note[lang])}</p>`; }
    if(s.shot){
      const nn=String(s.shot).padStart(2,'0');
      const cap=s.cap?esc(s.cap[lang]):'';
      html+=`<figure class="shot">`
        +`<a class="shotlink" href="/help-shots/${nn}.webp" target="_blank" rel="noopener"><img src="/help-shots/${nn}.webp" alt="${cap}" loading="lazy" onerror="this.closest('figure').querySelector('.shot-ph').style.display='flex';this.closest('a').style.display='none';"></a>`
        +`<div class="shot-ph" style="display:none"><span class="num">📸 #${nn}</span><span class="cap">${cap}</span><span class="path">${u.shotPath(s.shot)}</span></div>`
        +`<figcaption>#${nn} — ${cap} · ${u.zoom}</figcaption>`
        +`</figure>`;
    }
    html+=`</div>`;
    return html;
  }
  function render(){
    const u=UI[lang];
    const q=document.getElementById('q').value.trim().toLowerCase();
    let list=G.slice();
    if(q){
      list=list.filter(s=>{
        const hay=[s.t.fr,s.t.en,s.d.fr,s.d.en,
          (s.bullets?(s.bullets.fr.join(' ')+s.bullets.en.join(' ')):''),
          (s.note?s.note.fr+s.note.en:''),(s.cap?s.cap.fr+s.cap.en:'')].join(' ').toLowerCase();
        return hay.includes(q);
      });
    } else if(tab!=='all'){
      list=list.filter(s=>s.level===tab);
    }
    const cards=document.getElementById('cards');
    const none=document.getElementById('noResults');
    document.getElementById('count').textContent=u.count(list.length);
    if(!list.length){ cards.innerHTML=''; none.textContent=u.noResults; none.classList.remove('hidden'); return; }
    none.classList.add('hidden');
    cards.innerHTML=list.map(cardHtml).join('');
  }
  document.getElementById('q').addEventListener('input', render);
  (function init(){
    const p=new URLSearchParams(location.search).get('lang');
    setLang(p||localStorage.getItem('lang')||'fr');
  })();
  </script>
